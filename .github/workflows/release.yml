name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: release admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: tag matches the workspace release version
        shell: bash
        run: |
          expected="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: producer and frozen-contract release verification
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify
          cargo test --locked -p brokkr-bridge
          cargo test --locked -p brokkr-cli --test driver_conformance
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: exact release coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/coverage-exact.sh

  build:
    name: build (${{ matrix.name }})
    needs: [verify, coverage]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: brokkr-linux-x86_64, nfpm_arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: brokkr-linux-aarch64, nfpm_arch: arm64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: brokkr-macos-arm64 }
          # macos-13 (Intel runners) is retired: cross-compile from arm64.
          - { os: macos-latest,     target: x86_64-apple-darwin,       name: brokkr-macos-x86_64, cross: true }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: brokkr-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p brokkr-cli --target ${{ matrix.target }}
      # brokkr is the binary, and now the only one: the `forge` shim rode
      # along for one release (decision 0019 ruling 9) and is dropped.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" brokkr
          cd dist
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/brokkr.exe" -DestinationPath "dist/${{ matrix.name }}.zip"
          (Get-FileHash "dist/${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.name }}.zip.sha256"
      # The .deb and the .rpm are made from the binary the tarball leg
      # just packaged — nfpm never compiles — so every channel carries
      # one build, and both land in `dist/` before the attest step below
      # sees it. That is the whole provenance argument: same bytes, same
      # sidecar, same SHA256SUMS, same attestation.
      - uses: actions/setup-go@v5
        if: matrix.nfpm_arch
        with:
          go-version: stable
      - name: install nfpm
        if: matrix.nfpm_arch
        # Deliberately not version-pinned: `go install` resolves the
        # latest v2, which is the only form that works unchanged on both
        # the x86_64 and the aarch64 runner. Pinning is a bench decision
        # recorded as a follow-up in packaging/README.md.
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: package (linux .deb and .rpm)
        if: matrix.nfpm_arch
        env:
          BROKKR_PKG_ARCH: ${{ matrix.nfpm_arch }}
          BROKKR_PKG_BINARY: target/${{ matrix.target }}/release/brokkr
        run: |
          export BROKKR_PKG_VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/${{ matrix.name }}.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/${{ matrix.name }}.rpm"
          cd dist
          for package in "${{ matrix.name }}.deb" "${{ matrix.name }}.rpm"; do
            shasum -a 256 "$package" > "$package.sha256"
          done
      - name: attest packaged binary and checksum
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: aggregate checksums
        run: |
          cd dist
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - name: attest aggregate checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            One native binary per platform — no Python, no Node, no services.
            The binary is `brokkr`, and now the only one: the `forge` shim
            that rode along for one release is gone.
            Linux also ships `.deb` and `.rpm` built from those same
            binaries; every package manager channel serves these files.
            Verify downloads against SHA256SUMS, then verify signed GitHub
            build provenance with `gh attestation verify <asset> -R ${{ github.repository }}`.
            See ARCHITECTURE.md and docs/decisions/ for what this engine is and why.

  # The apt and dnf repositories are the release's own artifacts served
  # under a directory layout those tools understand — never a rebuild.
  # Signing happens here, in the workflow, from a repository secret
  # (decision 0012: the name is in the repository, the value never is).
  pages:
    name: publish apt and rpm repositories
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c
      - name: build the apt repository
        run: bash packaging/apt/build-repo.sh --debs dist --out site/apt
      - name: build the rpm repository
        run: |
          bash packaging/rpm/build-repo.sh --rpms dist --out site/rpm \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/rpm"
      - name: sign the repository indexes
        env:
          BROKKR_APT_SIGNING_KEY: ${{ secrets.BROKKR_APT_SIGNING_KEY }}
          BROKKR_APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.BROKKR_APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "${BROKKR_APT_SIGNING_KEY}" ]; then
            echo "refusing to publish an unsigned repository: BROKKR_APT_SIGNING_KEY is not set" >&2
            echo "see packaging/README.md for provisioning the steward key" >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "${BROKKR_APT_SIGNING_KEY}" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          sign() {
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase "${BROKKR_APT_SIGNING_KEY_PASSPHRASE}" \
              --local-user "$key" "$@"
          }
          release=site/apt/dists/stable/Release
          sign --armor --detach-sign --output "${release}.gpg" "$release"
          sign --clearsign --output site/apt/dists/stable/InRelease "$release"
          for repomd in site/rpm/*/repodata/repomd.xml; do
            sign --armor --detach-sign --output "${repomd}.asc" "$repomd"
          done
          gpg --armor --export "$key" > site/brokkr-archive-keyring.asc
          rm -rf "$GNUPGHOME"
      - name: the site's front door
        run: cp packaging/pages/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Homebrew, scoop and nix all read their digests from the release's own
  # attested SHA256SUMS — never from a second download of their own.
  channels:
    name: bump downstream channels
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: render the templates from the attested manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir .
          bash packaging/bump-from-sums.sh --version "${GITHUB_REF_NAME#v}" --sums SHA256SUMS
          rm SHA256SUMS
      - name: the flake's digests, as a pull request against this repository
        uses: peter-evans/create-pull-request@v7
        with:
          # A tag build is a detached HEAD, and the action refuses to
          # guess a base from one — the branch the pull request targets
          # has to be named here or the step fails on every release.
          base: ${{ github.event.repository.default_branch }}
          add-paths: flake.nix
          branch: channels/flake-${{ github.ref_name }}
          commit-message: "packaging: the flake's digests catch up with ${{ github.ref_name }}"
          title: "packaging: flake.nix digests for ${{ github.ref_name }}"
          body: |
            Rendered by `packaging/bump-from-sums.sh` from the attested
            `SHA256SUMS` of ${{ github.ref_name }}. The flake fetches the
            release artifacts, so its digests can only land after the
            release exists.
      # The tap and the bucket live in sibling repositories that a
      # workflow token cannot reach. Each step is skipped — loudly, not
      # silently — until the bench provisions its token; see
      # packaging/README.md.
      - name: open the homebrew tap pull request
        env:
          BROKKR_TAP_TOKEN: ${{ secrets.BROKKR_TAP_TOKEN }}
        run: |
          if [ -z "${BROKKR_TAP_TOKEN}" ]; then
            echo "::warning::BROKKR_TAP_TOKEN is not set — the homebrew tap was not bumped for ${GITHUB_REF_NAME}"
            exit 0
          fi
          bash packaging/open-channel-pr.sh \
            --token "${BROKKR_TAP_TOKEN}" \
            --repo "${GITHUB_REPOSITORY_OWNER}/homebrew-brokkr" \
            --source packaging/homebrew/brokkr.rb \
            --destination Formula/brokkr.rb \
            --version "${GITHUB_REF_NAME#v}"
      - name: open the scoop bucket pull request
        env:
          BROKKR_BUCKET_TOKEN: ${{ secrets.BROKKR_BUCKET_TOKEN }}
        run: |
          if [ -z "${BROKKR_BUCKET_TOKEN}" ]; then
            echo "::warning::BROKKR_BUCKET_TOKEN is not set — the scoop bucket was not bumped for ${GITHUB_REF_NAME}"
            exit 0
          fi
          bash packaging/open-channel-pr.sh \
            --token "${BROKKR_BUCKET_TOKEN}" \
            --repo "${GITHUB_REPOSITORY_OWNER}/scoop-brokkr" \
            --source packaging/scoop/brokkr.json \
            --destination bucket/brokkr.json \
            --version "${GITHUB_REF_NAME#v}"
