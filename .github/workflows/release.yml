name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: release admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: tag matches the workspace release version
        shell: bash
        run: |
          expected="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: producer and frozen-contract release verification
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify
          cargo test --locked -p brokkr-bridge
          cargo test --locked -p brokkr-cli --test driver_conformance
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: exact release coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/coverage-exact.sh

  build:
    name: build (${{ matrix.name }})
    needs: [verify, coverage]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: brokkr-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: brokkr-linux-aarch64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: brokkr-macos-arm64 }
          # macos-13 (Intel runners) is retired: cross-compile from arm64.
          - { os: macos-latest,     target: x86_64-apple-darwin,       name: brokkr-macos-x86_64, cross: true }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: brokkr-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p brokkr-cli --target ${{ matrix.target }}
      # brokkr is the binary, and now the only one: the `forge` shim rode
      # along for one release (decision 0019 ruling 9) and is dropped.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" brokkr
          cd dist
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/brokkr.exe" -DestinationPath "dist/${{ matrix.name }}.zip"
          (Get-FileHash "dist/${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.name }}.zip.sha256"
      - name: attest packaged binary and checksum
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: aggregate checksums
        run: |
          cd dist
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - name: attest aggregate checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            One native binary per platform — no Python, no Node, no services.
            The binary is `brokkr`, and now the only one: the `forge` shim
            that rode along for one release is gone.
            Verify downloads against SHA256SUMS, then verify signed GitHub
            build provenance with `gh attestation verify <asset> -R ${{ github.repository }}`.
            See ARCHITECTURE.md and docs/decisions/ for what this engine is and why.
