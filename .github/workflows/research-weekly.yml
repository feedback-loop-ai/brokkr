# Decision 0044 ruling 7: the weekly research sweep, on the dsh lane the
# operator ruled. The workflow is only the trigger; the stop condition,
# the budget, the cap and the fetch grant live in recipes/research-dsh.
# It fails loudly without the Model Studio and DeepSeek credentials
# (the model's and the search's) rather than running unauthenticated.
# Decision 0025's standing operator takes this schedule over when it
# exists.
name: research weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    name: the researcher reads the week
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: the credentials are granted, or nothing runs
        run: |
          for key in DASHSCOPE_API_KEY DEEPSEEK_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set; the researcher does not run unauthenticated (decision 0044 ruling 7)"
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] the sweep pushes its research branch with these credentials, and uploads no checkout
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      # The registry gate is a boxed exec seat (decision 0043): the same
      # bubblewrap CI builds for the hands tests, for the same reasons.
      - name: bubblewrap for the boxed gate
        uses: ./.github/actions/setup-bubblewrap
      - name: the harness is the one the adapter measured
        run: |
          npm install -g @deepseek-ai/dsh@0.1.5-rc.1
          dsh -V
          dsh --profile headless --dump-default-config >/dev/null
      - name: the engine
        run: cargo build --release --locked -p brokkr-cli
      - name: the seat commits as the researcher
        run: |
          git config user.name "brokkr-researcher"
          git config user.email "researcher@users.noreply.github.com"
      - name: the run
        id: run
        run: |
          set +e
          target/release/brokkr run --recipe research-dsh --repo . --feature "$(cat recipes/research/commissions/weekly-sweep.md)"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          target/release/brokkr inspect --run latest > .forge/research-inspect.txt 2>&1 || true
          # The journal is the evidence and the runner is gone in an hour:
          # export the run beside the journal, and pull the seat's own
          # notes out of it, because a park's question lives there and
          # nowhere the readout prints.
          mkdir -p .forge/export
          target/release/brokkr export --run latest --out .forge/export >/dev/null 2>&1 || true
          python3 - > .forge/research-notes.txt <<'PY' || true
          import glob, json
          for path in glob.glob('.forge/export/*.ndjson'):
              for line in open(path):
                  event = json.loads(line)
                  if event.get('type') != 'effect/succeeded':
                      continue
                  result = event.get('payload', {}).get('result', {})
                  notes = result.get('notes')
                  if notes:
                      print(f"seat result `{result.get('result')}`; notes:\n\n{notes}\n")
          PY
      - name: the branch and the Research issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: |
          branch="$(git branch --list 'research/*' --format '%(refname:short)' | tail -n 1)"
          today="$(date -u +%Y-%m-%d)"
          if [ -n "$branch" ] && [ -n "$(git log --oneline main.."$branch")" ]; then
            git push origin "$branch"
          fi
          body="$(printf 'Weekly research sweep, %s, on the dsh lane.\n\nRun exit: %s (0 done, 2 parked, 3 stopped).\nBranch: %s\nEvidence: the `research-sweep-evidence` artifact on this workflow run carries the journal, the export, the seat result files and the dsh session transcript.\n\n## The seat said\n\n%s\n\n## The readout\n\n```\n%s\n```\n\nThe classifications on the branch are proposals (decision 0044 ruling 3). Rule them, then deliver the branch.' "$today" "$RUN_EXIT" "${branch:-none}" "$(head -c 20000 .forge/research-notes.txt)" "$(head -c 30000 .forge/research-inspect.txt)")"
          gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="Research sweep $today" \
            -f body="$body" \
            -f type="Research" >/dev/null
      - name: the evidence outlives the runner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-sweep-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            .forge/forge.db
            .forge/export/
            .forge/results/
            .forge/research-inspect.txt
            .forge/research-notes.txt
            ~/.dsh/sessions/
      - name: the run's verdict is the job's
        if: steps.run.outputs.exit != '0'
        env:
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: |
          echo "::error::the research run did not reach done (exit ${RUN_EXIT}); the Research issue carries the readout"
          exit 1
