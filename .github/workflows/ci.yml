name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` and `unlabeled` are decision 0038 ruling 4: applying the
    # operator's by-hand label re-runs the gate on the same head, with no
    # close-and-reopen ceremony.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new event on a pull request supersedes the run still going on its
# older one. Any other run is grouped by its own commit, so a later push
# to main neither cancels nor queues behind it, and every main commit
# keeps its verdict (issue #340).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing more unless it names what else
# it needs itself; no checkout keeps the token in .git/config (zizmor's
# excessive-permissions and artipacked, issue #339).
permissions:
  contents: read

# Every action is pinned by commit SHA, its release in the trailing
# comment, and every Rust toolchain by exact version: the stable one is
# rust-toolchain.toml's channel. A tag or a branch can move under a
# verdict with no change here; `workflow_pins.rs` refuses one (issue #340).
jobs:
  delivered-by-brokkr:
    name: delivered by brokkr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The verifier, the gate script and the delivery classes come from
      # the trusted base, never from the pull request whose evidence they
      # judge.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-verifier
      # The head under judgment, with the history its merge-base needs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
      - name: the base branch, for the merge-base
        # Event data reaches the shell through the environment, never by
        # interpolation into the command line.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: https://github.com/${{ github.repository }}.git
        run: |
          git -C pr fetch --no-tags "$BASE_REPO" "${BASE_REF}:refs/remotes/base/${BASE_REF}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - name: build the base branch's offline verifier
        run: cargo build --locked --manifest-path "base-verifier/Cargo.toml" -p brokkr-cli
      - name: the tier is cut by the delta since the judgment (decisions 0033, 0038)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: refs/remotes/base/${{ github.event.pull_request.base.ref }}
          REPO: pr
          EVIDENCE: https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git
          VERIFIER: base-verifier/target/debug/brokkr
          CLASSES: base-verifier/.github/delivery-classes.json
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # The by-hand label is honoured inside the script, which logs the
        # tier it would have applied (0038 ruling 6). A base branch that
        # carries no gate script yet — the one landing that introduces it —
        # can cut no tier: the label skips, anything else refuses.
        run: |
          if [ ! -f base-verifier/scripts/delivered-by-brokkr.sh ]; then
            case ",${LABELS}," in
              *,by-hand,*)
                echo "delivered by brokkr: skipped — operator applied the by-hand label; the base branch carries no gate script yet"
                exit 0 ;;
            esac
            echo "delivered by brokkr: the base branch carries no gate script" >&2
            exit 1
          fi
          bash base-verifier/scripts/delivered-by-brokkr.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0 # the MSRV, Cargo.toml's rust-version: moved by hand, never by Renovate
      # The README's claim, enforced: the badge says 1.88+, so 1.88
      # must check the locked tree — an untested MSRV is prose, and
      # this one was found stale (it said 1.85; darling requires 1.88).
      # Task 13.6 / design D11: all targets and features, so the
      # dev-only Boa controller harness and its tests compile on the
      # MSRV too, not just the production targets. The `+1.88.0` is
      # load-bearing: rust-toolchain.toml would otherwise select stable.
      - run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
  quality:
    name: format, clippy, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: formatting is canonical
        run: cargo fmt --all -- --check
      - name: clippy is warning-free across every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: frozen and additive contracts compile
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  engine:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Decision 0043: the hands tests build a real bubblewrap namespace on
      # Linux; the boundary is never simulated, so the tool is installed.
      - name: bubblewrap for the hands tests
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-bubblewrap
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        env:
          # Decision 0054 ruling 9: a boundary proof that cannot open a
          # namespace skips, and a skipped Rust test prints `ok`. On the
          # Linux leg — the one that installed bubblewrap above and whose
          # job is to produce this evidence — a skip is a failure. The
          # other operating systems have no namespace to open, so they
          # are left to skip.
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: ${{ runner.os == 'Linux' && '1' || '' }}
      # Decision 0046 slice II, design D3/D14: Gate A (startup) executes here
      # and its durable report survives even when it fails. Gate B (lifetime)
      # is the `seatbelt-lifetime` job below, whose gated driver re-runs the
      # startup gate in its own process and marks the lifetime matrix `not
      # run` if that verdict is not a pass for the exact helper/profile
      # candidate. Both use real /usr/bin/sandbox-exec and real per-user
      # launchctl; a missing tool, an outer box, zero selected cells or any
      # unmet observation fails the step and never skips into success.
      #
      # The destructive launchd adapter is `#[ignore]`d so the generic parallel
      # workspace suite runs only the host-independent model; these steps select
      # it explicitly with `--ignored --exact`. The report-content checks make a
      # mis-selection or an empty report a failure rather than a silent pass.
      - name: R3 native startup gate
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test -x /usr/bin/sandbox-exec
          cargo test --locked -p brokkr-protocol --test seatbelt_lifetime_probe \
            -- --ignored --exact --nocapture \
            seatbelt_probe::native::native_startup_feasibility_probe \
            2>&1 | tee target/r3-startup.log
          grep -Eq 'test result: ok\. 1 passed' target/r3-startup.log
          grep -q 'Gate A startup verdict' target/r3-startup-report.txt
      - name: R3 native diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-native-diagnostics
          path: |
            target/r3-startup.log
            target/r3-startup-report.txt
          if-no-files-found: warn
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  # Gate A is a hard gate in `test (macos-latest)`: it passes, so it
  # protects a solved property. Gate B reports while #269 is open. The
  # launchd lease-pair teardown is tasks 1.29-1.33 of
  # boundary-seatbelt-slice-ii and all five are unticked, so this probe
  # measures work the slice has not built yet. Held as a hard gate in the
  # required check it would fail every pull request's macOS job and block
  # merges on unbuilt work, and as a non-blocking step there it still sat
  # on that job's critical path (103-132 s of it, issue #340). So it is its
  # own job, in no required check: the verdict is still printed, the report
  # is still content-checked and the r3-lifetime-diagnostics artifact
  # still carries every cell, so nothing is lost. Seatbelt stays unbuilt
  # either way; closing #269 restores the gate.
  seatbelt-lifetime:
    name: seatbelt lifetime probe (Gate B, reporting)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: R3 native lifetime feasibility probe
        continue-on-error: true
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test -x /usr/bin/sandbox-exec
          mkdir -p target
          cargo test --locked -p brokkr-protocol --test seatbelt_lifetime_probe \
            -- --ignored --exact --nocapture \
            seatbelt_probe::native::native_lifetime_feasibility_probe \
            2>&1 | tee target/r3-lifetime.log
          grep -Eq 'test result: ok\. 1 passed' target/r3-lifetime.log
          grep -q 'Gate A startup verdict' target/r3-lifetime-report.txt
      - name: R3 lifetime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-lifetime-diagnostics
          path: |
            target/r3-lifetime.log
            target/r3-lifetime-report.txt
          if-no-files-found: warn

  coverage:
    name: exact coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The exact gate demands literal 100%, so its compiler is pinned like
      # every other tool CI installs: a nightly release changes the
      # instrumented line, branch and function set, and an unpinned one
      # turns "a test is missing" and "the compiler moved" into the same
      # red. Bumping the pin is its own change, with the numbers in it.
      # The measuring tool is pinned the same way, in the file beside it:
      # its default ignore regex decides which files are test harness
      # (issue #340). RUSTUP_TOOLCHAIN makes this job's every cargo the
      # pin, where rust-toolchain.toml would otherwise select stable.
      - name: the pinned coverage toolchain and its measuring tool
        id: nightly
        run: |
          echo "toolchain=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_OUTPUT"
          echo "cargo_llvm_cov=$(tr -d '[:space:]' < cargo-llvm-cov-version.txt)" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@${{ steps.nightly.outputs.cargo_llvm_cov }}
          # A version the pinned manifest lacks fails here rather than
          # installing through cargo-binstall, unchecked (#339).
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: bubblewrap for the hands tests
        uses: ./.github/actions/setup-bubblewrap
      - name: prove literal nonzero 100% source-line/branch/function coverage
        run: bash scripts/coverage-exact.sh
        env:
          # The exact gate counts regions a skipped proof never enters, so
          # this job must run the boundary proofs for real too
          # (decision 0054 ruling 9).
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-exact
          path: target/coverage/

  license-compliance:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The action's image carries cargo-deny 0.20.2, so pinning the action
      # by SHA pins the tool that rules on the licences.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  # The non-Rust half of the tree, linted (issue #339): the workflows and
  # their scripts, workflow security, shell, spelling, links and anchors,
  # and the diagrams. Every tool is pinned by version and verified by
  # digest. NOT a required check until the operator adds it to branch
  # protection.
  lint-non-rust:
    name: non-Rust lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint, pinned by digest
        uses: ./.github/actions/setup-actionlint
      - name: lychee, pinned by digest
        uses: ./.github/actions/setup-lychee
      # install-action checks each release against the digest its manifest
      # records at the pinned commit before it installs it.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck@0.11.0,typos@1.50.2,zizmor@1.30.1
          # A version the pinned manifest lacks fails here rather than
          # installing through cargo-binstall, unchecked (#339).
          fallback: none
      - name: the workflows and their run scripts (actionlint with shellcheck)
        env:
          SHELLCHECK_OPTS: -S warning
        run: actionlint
      - name: workflow security (zizmor, offline, .github/zizmor.yml's policy)
        run: git ls-files -z .github/workflows .github/actions | xargs -0 zizmor --offline
      - name: shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: the composite actions' scripts (shellcheck)
        run: bash scripts/shellcheck-actions.sh
      # --hidden: typos skips dot-directories by default, and .github is
      # where this job's own workflows live.
      - name: spelling (typos, _typos.toml)
        run: typos --hidden
      - name: links and their anchors (lychee, offline)
        run: git ls-files -z '*.md' | xargs -0 lychee --offline --include-fragments --no-progress
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - name: the diagrams render (mermaid-cli, from .github/lint's lockfile)
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          npm ci --prefix .github/lint --ignore-scripts --no-audit --no-fund
          bash scripts/lint-diagrams.sh
      # The validator runs from the very image the Renovate workflow runs,
      # pinned once in .github/renovate-image.txt, so the config is judged
      # by the Renovate that will read it.
      - name: Renovate's configuration is valid (renovate-config-validator, the pinned image)
        run: |
          image="$(tr -d '[:space:]' < .github/renovate-image.txt)"
          validate() {
            docker run --rm -v "$PWD":/usr/src/app -w /usr/src/app \
              --entrypoint renovate-config-validator "$image" --strict "$@"
          }
          validate --no-global .github/renovate.json5
          validate .github/renovate-global.json5

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # cargo-audit is pinned by version AND digest in the one composite
      # step both this job and the release admission use; left to
      # itself, audit-check builds the latest cargo-audit from source.
      - name: cargo-audit, pinned by digest
        uses: ./.github/actions/setup-cargo-audit
      # This job stays apart from every other on purpose: its verdict
      # changes with the advisory database, by design, while every tool
      # in it is pinned (issue #340).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The bootstrap budgets, measured rather than promised. NOT in any
  # required status check or branch protection: whether a blown budget
  # blocks a merge is an operator's ruling, and this job exists so the
  # ruling can be made against numbers instead of impressions.
  #
  # What it does NOT prove is printed by the script itself, every run:
  # the download is a local file:// read, not a GitHub transfer, and the
  # timed run drives a stub standing in for the `claude` binary, so no
  # agent session is spawned and nothing is billed.
  #
  # Both hosts the README's bootstrap names (decision 0063): on Linux the
  # scaffold's verify and ship gates run boxed under `namespace`; on
  # macOS `init` declares `harness`, and the same steps run unboxed.
  #
  # The Linux leg times the binary the `release-binary` job built, so
  # brokkr is release-built once per run on Linux (issue #340); the macOS
  # leg builds its own, the only macOS release build, and waits on nothing.
  bootstrap-budgets:
    name: bootstrap budgets (60s install / 5min first run, ubuntu-latest)
    needs: release-binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The benchmark runs the boxed gates from the real init scaffold.
      # Decision 0043 never simulates their bubblewrap boundary.
      - name: bubblewrap for the boxed gates
        uses: ./.github/actions/setup-bubblewrap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brokkr-linux-x86_64
          path: target/release
      # An artifact does not keep the file mode.
      - run: chmod +x target/release/brokkr
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  bootstrap-budgets-macos:
    name: bootstrap budgets (60s install / 5min first run, macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p brokkr-cli
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  # The packaging channels are proved with the real tools, against real
  # packages built from the real binary — the test's own fallbacks (a
  # synthetic .deb, a skipped createrepo_c) exist for a developer's
  # laptop, and `BROKKR_PACKAGING_TOOLS=required` forbids them here. The
  # binary is the one `release-binary` built, never a second build.
  packaging:
    name: packaging channels
    needs: release-binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
      - name: repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c rpm
          # The same pin the release path uses — CI proves the pinned
          # version is installable before a tag depends on it.
          nfpm_version="$(tr -d '[:space:]' < packaging/nfpm-version.txt)"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${nfpm_version}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brokkr-linux-x86_64
          path: target/release
      # An artifact does not keep the file mode.
      - run: chmod +x target/release/brokkr
      - name: nfpm builds the .deb and the .rpm
        env:
          BROKKR_PKG_ARCH: amd64
          BROKKR_PKG_BINARY: target/release/brokkr
        run: |
          BROKKR_PKG_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          export BROKKR_PKG_VERSION
          mkdir -p target/packaging
          # nfpm's env interpolation does not reach every field (the
          # contents src glob saw the literal ${BROKKR_PKG_BINARY}), so
          # the config is rendered with envsubst first — same contract,
          # no interpolation gamble.
          envsubst < packaging/nfpm.yaml > target/packaging/nfpm.rendered.yaml
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager deb --target target/packaging/brokkr-linux-x86_64.deb
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager rpm --target target/packaging/brokkr-linux-x86_64.rpm
          ls -la target/packaging
      - name: the repositories, the templates and the bump render
        env:
          BROKKR_PACKAGING_TOOLS: required
          BROKKR_PACKAGING_DIST: target/packaging
        run: cargo test --locked -p brokkr-cli --test packaging

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).
  flake:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The one Linux release build per run: the bootstrap bench and the
      # packaging job download this artifact rather than build their own.
      - run: cargo build --release --locked -p brokkr-cli
      # One binary: the `forge` shim is gone (decision 0019 ruling 9).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brokkr-linux-x86_64
          path: target/release/brokkr
