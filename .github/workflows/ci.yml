name: ci

on:
  # The push of a commit the merge queue already judged (#1295) runs only
  # what nothing else feeds: the fast gates, so the README's badge still
  # reads a verdict on main, and the builds whose caches a pull request's
  # run restores from main, which no merge group's cache can reach. Every
  # test, coverage, bootstrap and packaging job skips on `push`
  # alone; contributing.rs holds which jobs run there.
  push:
    branches: [main]
  # A label or a body change starts no run here (#1295): the two required
  # checks that read a pull request's labels and body, `delivered by
  # brokkr` and `baseline ratchets`, live in pr-gates.yml, which re-runs on
  # `edited`, `labeled` and `unlabeled` alone.
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue (#451): the required checks run again on the commit
  # that lands, main plus the queued pull requests, so two green pull
  # requests first meet here rather than on main. A job that judges a pull
  # request's own head skips here; contributing.rs pins which, and why.
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

# A new event on a pull request supersedes the run still going on its
# older one. Any other run is grouped by its own commit, so a later push
# to main neither cancels nor queues behind it, and every main commit
# keeps its verdict (issue #340). The event is in the group too, so a
# merge group's run and the push of the commit it lands stay apart
# (#451).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository and nothing more unless it names what else
# it needs itself; no checkout keeps the token in .git/config (zizmor's
# excessive-permissions and artipacked, issue #339).
permissions:
  contents: read

# Every action is pinned by commit SHA, its release in the trailing
# comment, and every Rust toolchain by exact version: the stable one is
# rust-toolchain.toml's channel. A tag or a branch can move under a
# verdict with no change here; `workflow_pins.rs` refuses one (issue #340).
jobs:
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.89.0 # the MSRV, Cargo.toml's rust-version: moved by hand, never by Renovate
      # The README's claim, enforced: the badge says 1.89+, so 1.89
      # must check the locked tree — an untested MSRV is prose, and
      # this one was found stale (it said 1.85; darling requires 1.88).
      # rusqlite 0.41, which bundles SQLite's fix for RUSTSEC-2026-0459,
      # requires 1.89.
      # Task 13.6 / design D11: all targets and features, so the
      # dev-only Boa controller harness and its tests compile on the
      # MSRV too, not just the production targets. The `+1.89.0` is
      # load-bearing: rust-toolchain.toml would otherwise select stable.
      - run: cargo +1.89.0 check --workspace --all-targets --all-features --locked
  quality:
    name: format, clippy, contracts
    runs-on: ${{ fromJSON(vars.BROKKR_LOCAL_CI == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "brokkr-build"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/local-runner
        if: runner.environment == 'self-hosted'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
      - name: formatting is canonical
        run: cargo fmt --all -- --check
      - name: clippy is warning-free across every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Decision 0071 ruling 4, ratcheted (#337): a suppression of a
      # ratcheted lint that this pull request adds to production code names
      # a ruling in its reason. The counts themselves ride the test jobs
      # (quality/suppressions.txt).
      - name: an added suppression names a ruling
        if: github.event_name == 'pull_request'
        env:
          BROKKR_SUPPRESSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BROKKR_SUPPRESSION_BASE"
          scripts/run-it-tests.sh cargo test --locked -p brokkr-cli --test it -- --ignored --exact suppressions::an_added_suppression_of_a_ratcheted_lint_names_a_ruling
      - name: frozen and additive contracts compile
        run: |
          cargo run --locked -p brokkr-cli -- library compile --bundle recipes/self
          cargo run --locked -p brokkr-cli -- library compile --bundle recipes/verify

  # The DSH operator console plugin's own tests (decision 0085 ruling 5,
  # #568 slice two): Node's test runner in extensions/dsh/brokkr-console/,
  # offline, with the Node the research sweep pins, on both supported hosts
  # (decision 0063). The plugin has no dependencies, so nothing is installed.
  plugin-tests:
    name: plugin tests (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - name: the console plugin's tests
        working-directory: extensions/dsh/brokkr-console
        run: npm test

  # The docs lane (#1295): a pull request whose change scripts/docs-lane.sh
  # classifies as documentation alone runs the tests that read documentation
  # (`docs-lane`) in place of the test and coverage machines, which do not
  # start, and the three suite verdicts pass on that job's own result. The
  # classifier run is the base branch's copy, so a pull request that edits it
  # is judged by the one it would replace, and a base without one is full.
  # Every other event is full: a merge group can hold several pull requests
  # and is the last check before main, and the push to main saves the
  # caches. It fails closed: a step that fails fails this job, and every
  # verdict with it.
  classify:
    name: docs lane or full (scripts/docs-lane.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      # Only a pull request is classified, so only a pull request pays for
      # the full history; push and merge_group are full without a checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a pull request's change, documentation alone or not
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          lane=full
          if [ "$EVENT" = pull_request ] && git show "$BASE:scripts/docs-lane.sh" > "$RUNNER_TEMP/docs-lane.sh"; then
            lane="$(bash "$RUNNER_TEMP/docs-lane.sh" classify "$BASE" "$HEAD")"
          fi
          case "$lane" in docs | full) ;; *) exit 1 ;; esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

  # The tests that read documentation, as scripts/docs-lane-tests.txt pins
  # them (docs_lane.rs holds the list complete), on a docs change alone. The
  # links, spelling and the rest are `non-Rust lints`, which runs on every
  # pull request.
  docs-lane:
    name: docs lane (the tests that read documentation)
    needs: classify
    if: needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # doc_samples runs the samples at the scaffold's boxed gates in a real
      # namespace (decision 0043), and requires it here as the Linux test
      # machines do, so a sample is never skipped into a pass.
      - name: bubblewrap for the boxed samples
        uses: ./.github/actions/setup-bubblewrap
        with:
          cache-build: 'true'
      - name: the tests that read documentation (scripts/docs-lane-tests.txt)
        run: bash scripts/docs-lane.sh run
        env:
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
          BROKKR_REQUIRE_PIDNS: '1'

  # The Linux suite's machines (operator ruling 2026-11-01; macOS split out by
  # operator ruling 2026-11-25, #1383): one runner ran every shard one after
  # another, and a hosted merge-queue run took 57 minutes on Linux, past 75 on
  # a slow runner. Each Linux machine below runs the shards
  # scripts/test-shards.sh lays on it, still one after another, so a shard
  # never shares its runner, and the machines run at once.
  # `test (ubuntu-latest)` is the `engine` job's verdict over the Linux
  # machines alone, so no macOS test shard can fail a pull request or merge
  # group.
  engine-machines:
    name: test (ubuntu-latest) on ${{ matrix.machine }}
    needs: classify
    if: github.event_name != 'push' && needs.classify.outputs.lane != 'docs'
    strategy:
      fail-fast: false
      matrix:
        machine: [linux/1, linux/2, linux/3, linux/4, linux/5, linux/6, linux/7, linux/8]
    runs-on: ${{ fromJSON(vars.BROKKR_LOCAL_CI == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "brokkr-engine"]' || '["ubuntu-24.04"]') }}
    # 45 on Linux, not the usual 20 (operator rulings 2026-10-09 to
    # 2026-11-01): a machine's shards took about 20 minutes on a hosted runner,
    # its build and setup 3 to 5, and a slow hosted runner is a third slower.
    # One runner running every shard took 57 minutes and was cancelled at 75 on
    # a slow one (#940).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/local-runner
        if: runner.environment == 'self-hosted'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
      # Decision 0043: the hands tests build a real bubblewrap namespace on
      # Linux; the boundary is never simulated, so the tool is installed.
      # The protected system set is prepared in the background, beside the
      # build, and the shard script waits on it before its first shard
      # (#647); nothing between here and the shards installs under /usr.
      - name: bubblewrap for the hands tests
        id: bubblewrap
        if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup-bubblewrap
        with:
          protect-system-tree: 'background'
          cache-build: 'true'
      # The suite `cargo test --workspace --all-features --locked
      # --no-fail-fast` runs, each test target exactly once, as shards run
      # one after another, capability_broker last (#633). Only the three
      # single-test heap binaries run together, with every child joined.
      - run: bash scripts/test-shards.sh test --parallel-heaps
        env:
          # The machine whose shards this runner runs; a local run, with
          # none named, runs every shard.
          BROKKR_TEST_MACHINE: ${{ matrix.machine }}
          # The protected set's directory (#647).
          BROKKR_SYSTEM_SET: ${{ steps.bubblewrap.outputs.system-set }}
          # Decision 0054 ruling 9: a boundary proof that cannot open a
          # namespace skips, and a skipped Rust test prints `ok`. On Linux —
          # which installed bubblewrap above and whose job is to produce this
          # evidence — a skip is a failure.
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
          # #1137h: a test that delivers a real signal runs alone in a PID
          # namespace of its own, and skips where none can be built. On Linux,
          # which installed bubblewrap above, a skip is a failure.
          BROKKR_REQUIRE_PIDNS: '1'
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run --locked -p brokkr-cli -- library compile --bundle recipes/self
          cargo run --locked -p brokkr-cli -- library compile --bundle recipes/verify

  # The check main requires for the Linux suite: its verdict over the Linux
  # machines above, or over the docs lane on a docs change (#1295). It runs
  # whatever they ended with, `always()`, because a skipped job reports
  # success to a required check: a classifier that failed, a docs lane that
  # did not pass on a docs change, or a Linux machine that failed, was
  # cancelled or never ran on any other fails the verdict, and the job's own
  # run names which. On `push` the machines skip by design, so the verdict
  # skips with them (#1295).
  engine:
    name: test (ubuntu-latest)
    needs: [classify, docs-lane, engine-machines]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: the docs lane passed on a docs change, and every machine on any other
        env:
          CLASSIFIED: ${{ needs.classify.result }}
          LANE: ${{ needs.classify.outputs.lane }}
          DOCS: ${{ needs.docs-lane.result }}
          MACHINES: ${{ needs.engine-machines.result }}
        run: |
          test "$CLASSIFIED" = success
          case "$LANE" in docs) test "$DOCS" = success ;; full) test "$MACHINES" = success ;; *) exit 1 ;; esac

  # The macOS build check (#1383, operator ruling 2026-11-25): compiles the
  # whole workspace and every test target with the locked dependencies and
  # all features, and runs no test. Reuses the same rust-cache setup the
  # macOS shards used (`pr-caches` warms `build-macos` on main), so a warm
  # build takes about 3 to 5 minutes (up to ~12 cold); bounded at 30 minutes
  # for slow hosted runners.
  build-macos:
    name: build (macos-latest)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: workspace and test targets compile on macOS
        run: cargo test --workspace --all-features --locked --no-run

  # Manual dispatch of ci.yml also runs the five macOS test shards and Seatbelt
  # Gate A via the one shared definition (macos-test-shards.yml), so a branch
  # can prove the macOS suite on demand before merge (#1383). On pull requests
  # and merge groups neither job runs; nightly runs live in macos-tests.yml.
  macos-machines:
    name: test (macos-latest) shards
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/macos-test-shards.yml
    with:
      use-cache: true

  macos-tests:
    name: test (macos-latest)
    needs: macos-machines
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every macOS machine passed
        env:
          MACHINES: ${{ needs.macos-machines.result }}
        run: test "$MACHINES" = success

  # Gate A is a hard gate in `test (macos-latest)` (macos-test-shards.yml, run
  # nightly, on dispatch and in release.yml): it passes, so it
  # protects a solved property. Gate B reports while #269 is open. The
  # launchd lease-pair teardown is tasks 1.29-1.33 of
  # boundary-seatbelt-slice-ii and all five are unticked, so this probe
  # measures work the slice has not built yet. Held as a hard gate in the
  # required check it would fail every pull request's macOS job and block
  # merges on unbuilt work, and as a non-blocking step there it still sat
  # on that job's critical path (103-132 s of it, issue #340). So it is its
  # own job, in no required check: the verdict is still printed, the report
  # is still content-checked and the r3-lifetime-diagnostics artifact
  # still carries every cell, so nothing is lost. Seatbelt stays unbuilt
  # either way; closing #269 restores the gate.
  seatbelt-lifetime:
    name: seatbelt lifetime probe (Gate B, reporting)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: R3 native lifetime feasibility probe
        continue-on-error: true
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test -x /usr/bin/sandbox-exec
          mkdir -p target
          cargo test --locked -p brokkr-seatbelt-probe --test seatbelt_lifetime_probe \
            -- --ignored --exact --nocapture \
            seatbelt_probe::native::native_lifetime_feasibility_probe \
            2>&1 | tee target/r3-lifetime.log
          grep -Eq 'test result: ok\. 1 passed' target/r3-lifetime.log
          grep -q 'Gate A startup verdict' target/r3-lifetime-report.txt
      - name: R3 lifetime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r3-lifetime-diagnostics
          path: |
            target/r3-lifetime.log
            target/r3-lifetime-report.txt
          if-no-files-found: warn

  # The exact gate's machines (operator ruling 2026-11-01): one runner ran
  # every instrumented shard one after another, 46 to 66 minutes on a
  # hosted runner, past 75 on a slow one. Each machine measures the shards
  # scripts/test-shards.sh lays on it, one after another, and hands the
  # report its merged profile; the machines run at once. They run on the
  # push to main too, unlike the test machines: their instrumented build is
  # made only by scripts/coverage-exact.sh as it measures, so measuring on
  # main is what saves the caches a merge group's and a pull request's
  # coverage jobs restore (#1295). On a docs change they do not start.
  coverage-machines:
    name: exact coverage on ${{ matrix.machine }}
    needs: classify
    if: needs.classify.outputs.lane != 'docs'
    strategy:
      fail-fast: false
      matrix:
        machine: [linux/1, linux/2, linux/3, linux/4, linux/5, linux/6, linux/7, linux/8]
    runs-on: ${{ fromJSON(vars.BROKKR_LOCAL_CI == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "brokkr-coverage"]' || '["ubuntu-24.04"]') }}
    # 45, not the usual 20: a machine's instrumented shards took up to about
    # 20 minutes on a hosted runner, its build and setup about 5, and a slow
    # hosted runner is a third slower (operator rulings 2026-10-07 to
    # 2026-11-01).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/local-runner
        if: runner.environment == 'self-hosted'
      # The exact gate demands literal 100%, so its compiler is pinned like
      # every other tool CI installs: a nightly release changes the
      # instrumented line, branch and function set, and an unpinned one
      # turns "a test is missing" and "the compiler moved" into the same
      # red. Bumping the pin is its own change, with the numbers in it.
      # The measuring tool is pinned the same way, in the file beside it:
      # its default ignore regex decides which files are test harness
      # (issue #340). RUSTUP_TOOLCHAIN makes this job's every cargo the
      # pin, where rust-toolchain.toml would otherwise select stable.
      - name: the pinned coverage toolchain and its measuring tool
        id: nightly
        run: |
          echo "toolchain=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_OUTPUT"
          echo "cargo_llvm_cov=$(tr -d '[:space:]' < cargo-llvm-cov-version.txt)" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: llvm-tools-preview, rustfmt, clippy
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@${{ steps.nightly.outputs.cargo_llvm_cov }}
          # A version the pinned manifest lacks fails here rather than
          # installing through cargo-binstall, unchecked (#339).
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
      # The instrumented dependency build and the production check, kept
      # warm between runs (issue #341). coverage-exact.sh keys its own
      # directory by the nightly, the lockfile and the workspace's target set,
      # and drops every workspace artifact before it measures, so a restored
      # cache never reaches the report. This key is coarser: it cannot see
      # the target set, so a restored cache may hold only a stale key, which
      # the script replaces with a cold build and prunes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/brokkr-coverage-cache
          key: brokkr-coverage-${{ runner.os }}-${{ hashFiles('rust-nightly-version.txt', 'cargo-llvm-cov-version.txt', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
      # As in the test jobs, coverage-exact.sh's shards wait on the set (#647).
      - name: bubblewrap for the hands tests
        id: bubblewrap
        if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup-bubblewrap
        with:
          protect-system-tree: 'background'
          cache-build: 'true'
      - name: measure this machine's shards
        run: bash scripts/coverage-exact.sh --parallel-heaps
        env:
          # The machine whose shards this runner measures, and where its
          # merged profile and manifest go for the report.
          BROKKR_TEST_MACHINE: ${{ matrix.machine }}
          BROKKR_COVERAGE_PROFILES: target/coverage-machine
          BROKKR_SYSTEM_SET: ${{ steps.bubblewrap.outputs.system-set }}
          # The exact gate counts regions a skipped proof never enters, so
          # this job must run the boundary proofs for real too
          # (decision 0054 ruling 9).
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
          # And the tests that deliver a real signal, each alone in a PID
          # namespace of its own (#1137h).
          BROKKR_REQUIRE_PIDNS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-machine-${{ strategy.job-index }}
          path: target/coverage-machine/
          if-no-files-found: error
          retention-days: 1

  # The exact gate's report: every machine's profile, merged over the same
  # instrumented build, and judged whole. It runs only when every machine
  # passed, so a machine that failed, was cancelled or never ran leaves it
  # skipped, which the gate below refuses.
  coverage:
    name: exact coverage report
    needs: coverage-machines
    runs-on: ${{ fromJSON(vars.BROKKR_LOCAL_CI == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "brokkr-coverage"]' || '["ubuntu-24.04"]') }}
    # 30, not the usual 20: it rebuilds the instrumented binaries, about 5
    # minutes on a hosted runner, then runs the ratchets.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/local-runner
        if: runner.environment == 'self-hosted'
      # The exact gate demands literal 100%, so its compiler is pinned like
      # every other tool CI installs: a nightly release changes the
      # instrumented line, branch and function set, and an unpinned one
      # turns "a test is missing" and "the compiler moved" into the same
      # red. Bumping the pin is its own change, with the numbers in it.
      # The measuring tool is pinned the same way, in the file beside it:
      # its default ignore regex decides which files are test harness
      # (issue #340). RUSTUP_TOOLCHAIN makes this job's every cargo the
      # pin, where rust-toolchain.toml would otherwise select stable.
      - name: the pinned coverage toolchain and its measuring tool
        id: nightly
        run: |
          echo "toolchain=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_OUTPUT"
          echo "cargo_llvm_cov=$(tr -d '[:space:]' < cargo-llvm-cov-version.txt)" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: llvm-tools-preview, rustfmt, clippy
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@${{ steps.nightly.outputs.cargo_llvm_cov }}
          # A version the pinned manifest lacks fails here rather than
          # installing through cargo-binstall, unchecked (#339).
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
      # The instrumented dependency build and the production check, kept
      # warm between runs (issue #341). coverage-exact.sh keys its own
      # directory by the nightly, the lockfile and the workspace's target set,
      # and drops every workspace artifact before it measures, so a restored
      # cache never reaches the report. This key is coarser: it cannot see
      # the target set, so a restored cache may hold only a stale key, which
      # the script replaces with a cold build and prunes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/brokkr-coverage-cache
          key: brokkr-coverage-${{ runner.os }}-${{ hashFiles('rust-nightly-version.txt', 'cargo-llvm-cov-version.txt', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-machine-*
          path: target/coverage-machines
      - name: prove literal nonzero 100% source-line/branch/function coverage
        run: bash scripts/coverage-exact.sh --parallel-heaps
        env:
          # Every machine's merged profile, each in its own directory.
          BROKKR_COVERAGE_PROFILES: target/coverage-machines
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
      # Issue #338: the complexity ratchet reads the LCOV the gate just
      # wrote, and the public-API ratchet runs on the same pinned nightly.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-crap@0.5.0
          fallback: none
      - name: complexity ratchet (quality/crap-baseline.json)
        run: quality/ratchet.sh crap
      - name: cargo-public-api 0.52.0, pinned
        run: cargo install --locked cargo-public-api --version 0.52.0
      - name: public-API ratchet (quality/public-api/)
        run: quality/ratchet.sh api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-exact
          path: target/coverage/

  # The check main requires for exact coverage: the report's verdict, or the
  # docs lane's on a docs change (#1295). Like the suite's verdicts it runs
  # whatever they ended with, `always()`, because a skipped job reports
  # success to a required check, so a report that did not run on a change
  # that is not documentation fails it.
  coverage-gate:
    name: exact coverage gate
    needs: [classify, docs-lane, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: the docs lane passed on a docs change, and the report on any other
        env:
          CLASSIFIED: ${{ needs.classify.result }}
          LANE: ${{ needs.classify.outputs.lane }}
          DOCS: ${{ needs.docs-lane.result }}
          REPORT: ${{ needs.coverage.result }}
        run: |
          test "$CLASSIFIED" = success
          case "$LANE" in docs) test "$DOCS" = success ;; full) test "$REPORT" = success ;; *) exit 1 ;; esac

  license-compliance:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The action's image carries cargo-deny 0.20.2, so pinning the action
      # by SHA pins the tool that rules on the licences.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # The non-Rust half of the tree, linted (issue #339): the workflows and
  # their scripts, workflow security, shell, spelling, links and anchors,
  # and the diagrams. Every tool is pinned by version and verified by
  # digest. A required check on main, by the operator's ruling of
  # 2026-09-26.
  lint-non-rust:
    name: non-Rust lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint, pinned by digest
        uses: ./.github/actions/setup-actionlint
      - name: lychee, pinned by digest
        uses: ./.github/actions/setup-lychee
      # install-action checks each release against the digest its manifest
      # records at the pinned commit before it installs it.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: shellcheck@0.11.0,typos@1.50.2,zizmor@1.30.1
          # A version the pinned manifest lacks fails here rather than
          # installing through cargo-binstall, unchecked (#339).
          fallback: none
      # Spelling (typos --hidden: .github is a dot-directory), the shell
      # scripts and the composite actions' scripts (shellcheck), the
      # workflows (actionlint with shellcheck), workflow security (zizmor,
      # offline, .github/zizmor.yml's policy), and links with their anchors
      # (lychee, offline): one list, the one fast's verify seat runs (#427).
      - name: the offline lints (scripts/lint-non-rust.sh)
        run: bash scripts/lint-non-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - name: the diagrams render (mermaid-cli, from .github/lint's lockfile)
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          npm ci --prefix .github/lint --ignore-scripts --no-audit --no-fund
          bash scripts/lint-diagrams.sh
      # The validator runs from the very image the Renovate workflow runs,
      # pinned once in .github/renovate-image.txt, so the config is judged
      # by the Renovate that will read it.
      - name: Renovate's configuration is valid (renovate-config-validator, the pinned image)
        run: |
          image="$(tr -d '[:space:]' < .github/renovate-image.txt)"
          validate() {
            docker run --rm -v "$PWD":/usr/src/app -w /usr/src/app \
              --entrypoint renovate-config-validator "$image" --strict "$@"
          }
          validate --no-global .github/renovate.json5
          validate .github/renovate-global.json5

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # cargo-audit is pinned by version AND digest in the one composite
      # step both this job and the release admission use.
      - name: cargo-audit, pinned by digest
        uses: ./.github/actions/setup-cargo-audit
      # This job stays apart from every other on purpose: its verdict
      # changes with the advisory database, by design, while every tool
      # in it is pinned (issue #340). The verdict is the pinned
      # cargo-audit's own exit code: a vulnerability fails the job, and a
      # warning such as "unmaintained" is printed and does not. No check
      # run of the audit's own is written: rustsec/audit-check's could
      # fail to update one and so fail a clean audit (#1113).
      - name: RustSec advisory audit
        run: cargo audit

  # The bootstrap budgets, measured rather than promised. NOT in any
  # required status check or branch protection: whether a blown budget
  # blocks a merge is an operator's ruling, and this job exists so the
  # ruling can be made against numbers instead of impressions.
  #
  # What it does NOT prove is printed by the script itself, every run:
  # the download is a local file:// read, not a GitHub transfer, and the
  # timed run drives a stub standing in for the `claude` binary, so no
  # agent session is spawned and nothing is billed.
  #
  # Both hosts the README's bootstrap names (decision 0063): on Linux the
  # scaffold's verify and ship gates run boxed under `namespace`; on
  # macOS `init` declares `harness`, and the same steps run unboxed.
  #
  # The Linux leg times the binary the `release-binary` job built, so
  # brokkr is release-built once per run on Linux (issue #340); the macOS
  # leg builds its own, the only macOS release build, and waits on nothing.
  bootstrap-budgets:
    name: bootstrap budgets (60s install / 5min first run, ubuntu-latest)
    needs: release-binary
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The benchmark runs the boxed gates from the real init scaffold.
      # Decision 0043 never simulates their bubblewrap boundary.
      - name: bubblewrap for the boxed gates
        uses: ./.github/actions/setup-bubblewrap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brokkr-linux-x86_64
          path: target/release
      # An artifact does not keep the file mode.
      - run: chmod +x target/release/brokkr
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  bootstrap-budgets-macos:
    name: bootstrap budgets (60s install / 5min first run, macos-latest)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p brokkr-cli
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  # The packaging channels are proved with the real tools, against real
  # packages built from the real binary — the test's own fallbacks (a
  # synthetic .deb, a skipped createrepo_c) exist for a developer's
  # laptop, and `BROKKR_PACKAGING_TOOLS=required` forbids them here. The
  # binary is the one `release-binary` built, never a second build.
  packaging:
    name: packaging channels
    needs: release-binary
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
      - name: repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c rpm
          # The same pin the release path uses — CI proves the pinned
          # version is installable before a tag depends on it.
          nfpm_version="$(tr -d '[:space:]' < packaging/nfpm-version.txt)"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${nfpm_version}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brokkr-linux-x86_64
          path: target/release
      # An artifact does not keep the file mode.
      - run: chmod +x target/release/brokkr
      - name: nfpm builds the .deb and the .rpm
        env:
          BROKKR_PKG_ARCH: amd64
          BROKKR_PKG_BINARY: target/release/brokkr
        run: |
          BROKKR_PKG_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          export BROKKR_PKG_VERSION
          mkdir -p target/packaging
          # nfpm's env interpolation does not reach every field (the
          # contents src glob saw the literal ${BROKKR_PKG_BINARY}), so
          # the config is rendered with envsubst first — same contract,
          # no interpolation gamble.
          envsubst < packaging/nfpm.yaml > target/packaging/nfpm.rendered.yaml
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager deb --target target/packaging/brokkr-linux-x86_64.deb
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager rpm --target target/packaging/brokkr-linux-x86_64.rpm
          ls -la target/packaging
      - name: the repositories, the templates and the bump render
        env:
          BROKKR_PACKAGING_TOOLS: required
          BROKKR_PACKAGING_DIST: target/packaging
        run: |
          scripts/run-it-tests.sh cargo test --locked -p brokkr-cli --test it packaging::

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).
  flake:
    name: nix flake check
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  release-binary:
    name: release binary artifact
    runs-on: ${{ fromJSON(vars.BROKKR_LOCAL_CI == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "brokkr-build"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/local-runner
        if: runner.environment == 'self-hosted'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
      # The one Linux release build per run: the bootstrap bench and the
      # packaging job download this artifact rather than build their own.
      - run: cargo build --release --locked -p brokkr-cli
      # The binary size budget (#342): a ceiling (30 MB, operator ruling
      # 2026-10-01), so growth past it is raised on purpose; the size prints.
      - run: bash scripts/binary-size.sh target/release/brokkr quality/binary-size.json
      # One binary: the `forge` shim is gone (decision 0019 ruling 9).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brokkr-linux-x86_64
          path: target/release/brokkr

  # The CPU budgets (#342) under Callgrind are not measured here: the
  # nightly cpu-budgets.yml measures main against the previous night's head
  # (#1295), and measures a branch on demand.

  # The caches a pull request's run restores (#1295). GitHub scopes a cache
  # to the ref that saved it, and a pull request's run reads its own ref's
  # and its base branch's, never a merge group's. So the push to main is
  # what saves them, and on `push` the jobs that restore them skip. Each
  # entry builds what one such job builds, running nothing, under that
  # job's own cache key: rust-cache's key is its `shared-key` where one is
  # given and the job's id where not, then the runner's system and
  # architecture and a hash of the toolchain and its CARGO and RUST
  # variables, so `shared-key: engine-machines` here saves the very key
  # engine-machines restores. `format, clippy, contracts` and the release
  # binary run on `push` themselves and save their own, and so do the
  # coverage machines and gate: their rust-cache keys, the
  # `brokkr-coverage-<system>-<hash>` cache of the instrumented build and
  # bubblewrap's build cache. An exact hit means main already holds this
  # key, so the build is skipped. Not saved on `push` any more: the
  # baseline ratchets' jscpd install, now pr-gates.yml's, which a pull
  # request's own run saves for itself.
  pr-caches:
    name: pull-request cache (${{ matrix.key }}, ${{ matrix.os }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: engine-machines
            os: ubuntu-24.04
          - key: build-macos
            os: macos-latest
          - key: seatbelt-lifetime
            os: macos-latest
          - key: bootstrap-budgets-macos
            os: macos-latest
          - key: packaging
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: cache
        with:
          shared-key: ${{ matrix.key }}
      - name: the job's build, no test run
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          KEY: ${{ matrix.key }}
        run: |
          case "$KEY" in
            engine-machines) cargo test --workspace --all-features --locked --no-run ;;
            build-macos) cargo test --workspace --all-features --locked --no-run ;;
            seatbelt-lifetime) cargo test --locked -p brokkr-seatbelt-probe --test seatbelt_lifetime_probe --no-run ;;
            bootstrap-budgets-macos) cargo build --release --locked -p brokkr-cli ;;
            packaging) cargo test --locked -p brokkr-cli --no-run ;;
            *) echo "no build for the cache key $KEY" >&2; exit 1 ;;
          esac
