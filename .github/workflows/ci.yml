name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: rust engine + machine proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: self bundle compiles under the constitutional lint
        run: cargo run -p forge-cli -- compile --bundle bundles/self

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p forge-cli
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x86_64
          path: target/release/forge
