name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: format, clippy, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: formatting is canonical
        run: cargo fmt --all -- --check
      - name: clippy is warning-free across every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: frozen and additive contracts compile
        run: |
          cargo run --locked -p forge-cli -- compile --bundle bundles/self
          cargo run --locked -p forge-cli -- compile --bundle bundles/verify

  engine:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run --locked -p forge-cli -- compile --bundle bundles/self
          cargo run --locked -p forge-cli -- compile --bundle bundles/verify

  coverage:
    name: exact coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: prove literal nonzero 100% source-line/branch/function coverage
        run: bash scripts/coverage-exact.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-exact
          path: target/coverage/

  license-compliance:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p forge-cli
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x86_64
          path: target/release/forge
