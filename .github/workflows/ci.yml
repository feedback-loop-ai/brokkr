name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` and `unlabeled` are decision 0038 ruling 4: applying the
    # operator's by-hand label re-runs the gate on the same head, with no
    # close-and-reopen ceremony.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  delivered-by-brokkr:
    name: delivered by brokkr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The verifier, the gate script and the delivery classes come from
      # the trusted base, never from the pull request whose evidence they
      # judge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-verifier
      # The head under judgment, with the history its merge-base needs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
      - name: the base branch, for the merge-base
        # Event data reaches the shell through the environment, never by
        # interpolation into the command line.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: https://github.com/${{ github.repository }}.git
        run: |
          git -C pr fetch --no-tags "$BASE_REPO" "${BASE_REF}:refs/remotes/base/${BASE_REF}"
      - uses: dtolnay/rust-toolchain@stable
      - name: build the base branch's offline verifier
        run: cargo build --locked --manifest-path "base-verifier/Cargo.toml" -p brokkr-cli
      - name: the tier is cut by the delta since the judgment (decisions 0033, 0038)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: refs/remotes/base/${{ github.event.pull_request.base.ref }}
          REPO: pr
          EVIDENCE: https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git
          VERIFIER: base-verifier/target/debug/brokkr
          CLASSES: base-verifier/.github/delivery-classes.json
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # The by-hand label is honoured inside the script, which logs the
        # tier it would have applied (0038 ruling 6). A base branch that
        # carries no gate script yet — the one landing that introduces it —
        # can cut no tier: the label skips, anything else refuses.
        run: |
          if [ ! -f base-verifier/scripts/delivered-by-brokkr.sh ]; then
            case ",${LABELS}," in
              *,by-hand,*)
                echo "delivered by brokkr: skipped — operator applied the by-hand label; the base branch carries no gate script yet"
                exit 0 ;;
            esac
            echo "delivered by brokkr: the base branch carries no gate script" >&2
            exit 1
          fi
          bash base-verifier/scripts/delivered-by-brokkr.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # The README's claim, enforced: the badge says 1.88+, so 1.88
      # must check the locked tree — an untested MSRV is prose, and
      # this one was found stale (it said 1.85; darling requires 1.88).
      - run: cargo check --workspace --locked
  quality:
    name: format, clippy, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: formatting is canonical
        run: cargo fmt --all -- --check
      - name: clippy is warning-free across every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: frozen and additive contracts compile
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  engine:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Decision 0043: the hands tests build a real bubblewrap namespace on
      # Linux; the boundary is never simulated, so the tool is installed.
      - name: bubblewrap for the hands tests
        if: runner.os == 'Linux'
        # The runner image restricts unprivileged user namespaces through
        # AppArmor, which leaves a new network namespace unable to raise
        # its own loopback ("loopback: Failed RTM_NEWADDR"). That is a
        # runner setting, not a product requirement: an operator's Linux
        # box needs bubblewrap and nothing else.
        # Ubuntu's package is 0.9, and overlay binds arrived in 0.10, so
        # the release is built from its tarball.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build libcap-dev pkg-config xz-utils
          curl -sSL https://github.com/containers/bubblewrap/releases/download/v0.11.0/bubblewrap-0.11.0.tar.xz | tar xJ -C /tmp
          (cd /tmp/bubblewrap-0.11.0 && meson setup _build -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled >/dev/null && ninja -C _build >/dev/null && sudo install -m 0755 _build/bwrap /usr/local/bin/bwrap)
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        env:
          # Decision 0054 ruling 9: a boundary proof that cannot open a
          # namespace skips, and a skipped Rust test prints `ok`. On the
          # Linux leg — the one that installed bubblewrap above and whose
          # job is to produce this evidence — a skip is a failure. The
          # other operating systems have no namespace to open, so they
          # are left to skip.
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: ${{ runner.os == 'Linux' && '1' || '' }}
      # Decision 0046 slice II, design D3/D14: Gate A (startup) executes first
      # and its durable report survives even when it fails. Gate B (lifetime)
      # is a separate step that only runs after Gate A succeeds, and the gated
      # driver marks the lifetime matrix `not run` if the startup verdict is
      # not a pass for the exact helper/profile candidate. Both use real
      # /usr/bin/sandbox-exec and real per-user launchctl; a missing tool, an
      # outer box, zero selected cells or any unmet observation is reported as
      # a failed step and never skips into success.
      #
      # Both steps carry `continue-on-error` while issue #268 is open. They run
      # in the `engine` job, which is the required `test (macos-latest)` check,
      # and Gate A does not pass yet: the payload aborts on guard-page
      # allocation (EINVAL) with no Sandbox denial event. As hard gates they
      # would fail every pull request's macOS job and block all merges into
      # main, which is authority this slice never asked for. The verdict is
      # still printed, the report is still content-checked, and the
      # r3-native-diagnostics artifact is still uploaded, so no evidence is
      # lost. Acceptance of the slice stays gated where it belongs: the
      # section 6 and 8 tasks are unticked and Seatbelt remains unbuilt.
      # Closing #268 restores both steps to hard gates.
      #
      # The destructive launchd adapter is `#[ignore]`d so the generic parallel
      # workspace suite runs only the host-independent model; these steps select
      # it explicitly with `--ignored --exact`. The report-content checks make a
      # mis-selection or an empty report a failure rather than a silent pass.
      - name: R3 native startup gate
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test -x /usr/bin/sandbox-exec
          cargo test --locked -p brokkr-protocol --test seatbelt_lifetime_probe \
            -- --ignored --exact --nocapture \
            seatbelt_probe::native::native_startup_feasibility_probe \
            2>&1 | tee target/r3-startup.log
          grep -Eq 'test result: ok\. 1 passed' target/r3-startup.log
          grep -q 'Gate A startup verdict' target/r3-startup-report.txt
      - name: R3 native lifetime feasibility probe
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked -p brokkr-protocol --test seatbelt_lifetime_probe \
            -- --ignored --exact --nocapture \
            seatbelt_probe::native::native_lifetime_feasibility_probe \
            2>&1 | tee target/r3-lifetime.log
          grep -Eq 'test result: ok\. 1 passed' target/r3-lifetime.log
          grep -q 'Gate A startup verdict' target/r3-lifetime-report.txt
      - name: R3 native diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: r3-native-diagnostics
          path: |
            target/r3-startup.log
            target/r3-lifetime.log
            target/r3-startup-report.txt
            target/r3-lifetime-report.txt
          if-no-files-found: warn
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  coverage:
    name: exact coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The exact gate demands literal 100%, so its compiler is pinned like
      # every other tool CI installs: a nightly release changes the
      # instrumented line, branch and function set, and an unpinned one
      # turns "a test is missing" and "the compiler moved" into the same
      # red. Bumping the pin is its own change, with the numbers in it.
      - name: the pinned coverage toolchain
        id: nightly
        run: echo "toolchain=$(tr -d '[:space:]' < rust-nightly-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: bubblewrap for the hands tests
        # Ubuntu's package is 0.9, and overlay binds arrived in 0.10, so
        # the release is built from its tarball.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build libcap-dev pkg-config xz-utils
          curl -sSL https://github.com/containers/bubblewrap/releases/download/v0.11.0/bubblewrap-0.11.0.tar.xz | tar xJ -C /tmp
          (cd /tmp/bubblewrap-0.11.0 && meson setup _build -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled >/dev/null && ninja -C _build >/dev/null && sudo install -m 0755 _build/bwrap /usr/local/bin/bwrap)
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: prove literal nonzero 100% source-line/branch/function coverage
        run: bash scripts/coverage-exact.sh
        env:
          # The exact gate counts regions a skipped proof never enters, so
          # this job must run the boundary proofs for real too
          # (decision 0054 ruling 9).
          BROKKR_REQUIRE_BOUNDARY_EVIDENCE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-exact
          path: target/coverage/

  license-compliance:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      # cargo-audit is pinned by version AND digest and installed from
      # rustsec's own release, never built from source on the runner.
      # Left to itself, audit-check runs `cargo install cargo-audit`
      # (latest, unlocked) whenever the binary is absent — and on
      # 2026-09-03 that pulled a freshly published dependency that
      # failed to compile, so the required check went red on main with
      # no advisory involved (#164, #166 merged past it by ruling). A
      # prebuilt binary whose digest is recorded here fails only when
      # the pinned release itself changes, which is a fact worth
      # failing on. Bumping the version means bumping the digest.
      - name: install cargo-audit 0.22.2, pinned by digest
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -euo pipefail
          asset="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          curl -sSfL --retry 3 -o "$asset" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${asset}"
          echo "${CARGO_AUDIT_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset"
          install -m 0755 "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The bootstrap budgets, measured rather than promised. NOT in any
  # required status check or branch protection: whether a blown budget
  # blocks a merge is an operator's ruling, and this job exists so the
  # ruling can be made against numbers instead of impressions.
  #
  # What it does NOT prove is printed by the script itself, every run:
  # the download is a local file:// read, not a GitHub transfer, and the
  # timed run drives a stub standing in for the `claude` binary, so no
  # agent session is spawned and nothing is billed.
  bootstrap-budgets:
    name: bootstrap budgets (60s install / 5min first run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The benchmark runs the boxed gates from the real init scaffold.
      # Decision 0043 never simulates their bubblewrap boundary.
      - name: bubblewrap for the hands tests
        # The runner image restricts unprivileged user namespaces through
        # AppArmor, and Ubuntu's package is 0.9; overlay binds need 0.10+.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build libcap-dev pkg-config xz-utils
          curl -sSL https://github.com/containers/bubblewrap/releases/download/v0.11.0/bubblewrap-0.11.0.tar.xz | tar xJ -C /tmp
          (cd /tmp/bubblewrap-0.11.0 && meson setup _build -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled >/dev/null && ninja -C _build >/dev/null && sudo install -m 0755 _build/bwrap /usr/local/bin/bwrap)
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - run: cargo build --release --locked -p brokkr-cli
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  # The packaging channels are proved with the real tools, against real
  # packages built from the real binary — the test's own fallbacks (a
  # synthetic .deb, a skipped createrepo_c) exist for a developer's
  # laptop, and `BROKKR_PACKAGING_TOOLS=required` forbids them here.
  packaging:
    name: packaging channels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c rpm
          # The same pin the release path uses — CI proves the pinned
          # version is installable before a tag depends on it.
          nfpm_version="$(tr -d '[:space:]' < packaging/nfpm-version.txt)"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${nfpm_version}"
      - run: cargo build --release --locked -p brokkr-cli
      - name: nfpm builds the .deb and the .rpm
        env:
          BROKKR_PKG_ARCH: amd64
          BROKKR_PKG_BINARY: target/release/brokkr
        run: |
          export BROKKR_PKG_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p target/packaging
          # nfpm's env interpolation does not reach every field (the
          # contents src glob saw the literal ${BROKKR_PKG_BINARY}), so
          # the config is rendered with envsubst first — same contract,
          # no interpolation gamble.
          envsubst < packaging/nfpm.yaml > target/packaging/nfpm.rendered.yaml
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager deb --target target/packaging/brokkr-linux-x86_64.deb
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager rpm --target target/packaging/brokkr-linux-x86_64.rpm
          ls -la target/packaging
      - name: the repositories, the templates and the bump render
        env:
          BROKKR_PACKAGING_TOOLS: required
          BROKKR_PACKAGING_DIST: target/packaging
        run: cargo test --locked -p brokkr-cli --test packaging

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).
  flake:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p brokkr-cli
      # One binary: the `forge` shim is gone (decision 0019 ruling 9).
      - uses: actions/upload-artifact@v4
        with:
          name: brokkr-linux-x86_64
          path: target/release/brokkr
