name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  oracle:
    name: python oracle + corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pytest>=8"
      - run: python -m pytest -q
      - name: committed corpus is exactly what the oracle generates
        run: |
          python tools/generate_evaluator_corpus.py
          git diff --exit-code fixtures/

  engine:
    name: rust engine + machine proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: self bundle compiles under the constitutional lint
        run: cargo run -p forge-cli -- compile --bundle bundles/self
