name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run -p forge-cli -- compile --bundle bundles/self
          cargo run -p forge-cli -- compile --bundle bundles/verify

  coverage:
    name: coverage gate (lines >= 83%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: measure and gate
        run: cargo llvm-cov --workspace --fail-under-lines 83 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p forge-cli
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x86_64
          path: target/release/forge
