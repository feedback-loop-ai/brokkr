name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  delivered-by-brokkr:
    name: delivered by brokkr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: operator by-hand escape hatch is visible
        if: contains(github.event.pull_request.labels.*.name, 'by-hand')
        run: echo "delivered by brokkr skipped — operator applied the by-hand label"
      # Build the verifier from the trusted base, not from code supplied
      # by the pull request whose evidence it judges.
      - uses: actions/checkout@v4
        if: ${{ ! contains(github.event.pull_request.labels.*.name, 'by-hand') }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-verifier
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ ! contains(github.event.pull_request.labels.*.name, 'by-hand') }}
      - name: build the base branch's offline verifier
        if: ${{ ! contains(github.event.pull_request.labels.*.name, 'by-hand') }}
        run: cargo build --locked --manifest-path "base-verifier/Cargo.toml" -p brokkr-cli
      - name: verify the named run vouches for the pull request head
        if: ${{ ! contains(github.event.pull_request.labels.*.name, 'by-hand') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          mapfile -t declarations < <(printf '%s\n' "$PR_BODY" | sed -n '/^Brokkr-Run:/p')
          if (( ${#declarations[@]} != 1 )); then
            echo "expected exactly one Brokkr-Run: line in the pull request body" >&2
            exit 1
          fi
          declaration="${declarations[0]%$'\r'}"
          if [[ ! "$declaration" =~ ^Brokkr-Run:\ ([a-z0-9-]{0,32}-[0-9a-f]{8})$ ]]; then
            echo "Brokkr-Run must carry a native run id: [a-z0-9-]{0,32}-[0-9a-f]{8}" >&2
            exit 1
          fi
          run_id="${BASH_REMATCH[1]}"
          evidence_ref="refs/remotes/brokkr-run/${run_id}"
          git -C "base-verifier" fetch --no-tags --depth=1 \
            "https://github.com/${PR_HEAD_REPOSITORY}.git" \
            "refs/heads/brokkr-runs/${run_id}:${evidence_ref}"
          evidence_dir="base-verifier/target/brokkr-evidence"
          mkdir -p "$evidence_dir"
          journal="${evidence_dir}/${run_id}.ndjson"
          anchor="${evidence_dir}/${run_id}.anchor.json"
          git -C "base-verifier" show "${evidence_ref}:${run_id}.ndjson" > "$journal"
          git -C "base-verifier" show -s --format=%B "$evidence_ref" > "$anchor"
          verified="$("base-verifier/target/debug/brokkr" verify-run "$journal")"
          printf '%s\n' "$verified"
          printf '%s\n' "$verified" | jq -e --arg run "$run_id" \
            '.chain == "verified" and .state.run_id == $run and .state.status == "completed"'
          journal_head="$(tail -n 1 "$journal" | jq -er '.event_hash')"
          journal_seq="$(tail -n 1 "$journal" | jq -er '.seq')"
          jq -s -e 'any(.[]; .type == "transition/decided" and
            .payload.from == "ship" and .payload.result == "shipped")' "$journal"
          jq -e --arg run "$run_id" --arg head "$PR_HEAD" --arg journal "$journal_head" \
            --argjson seq "$journal_seq" \
            '.anchor == "forge.journal-anchor/v2" and .run_id == $run and
             .repo_head == $head and .seq == $seq and
             .journal_head_hash == $journal' "$anchor"
          echo "Brokkr run ${run_id} is complete and vouches for ${PR_HEAD}"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # The README's claim, enforced: the badge says 1.88+, so 1.88
      # must check the locked tree — an untested MSRV is prose, and
      # this one was found stale (it said 1.85; darling requires 1.88).
      - run: cargo check --workspace --locked
  quality:
    name: format, clippy, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: formatting is canonical
        run: cargo fmt --all -- --check
      - name: clippy is warning-free across every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: frozen and additive contracts compile
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  engine:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - name: self and verify bundles compile under the constitutional lint
        run: |
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/self
          cargo run --locked -p brokkr-cli -- compile --bundle bundles/verify

  coverage:
    name: exact coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: prove literal nonzero 100% source-line/branch/function coverage
        run: bash scripts/coverage-exact.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-exact
          path: target/coverage/

  license-compliance:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The bootstrap budgets, measured rather than promised. NOT in any
  # required status check or branch protection: whether a blown budget
  # blocks a merge is an operator's ruling, and this job exists so the
  # ruling can be made against numbers instead of impressions.
  #
  # What it does NOT prove is printed by the script itself, every run:
  # the download is a local file:// read, not a GitHub transfer, and the
  # timed run drives a stub standing in for the `claude` binary, so no
  # agent session is spawned and nothing is billed.
  bootstrap-budgets:
    name: bootstrap budgets (60s install / 5min first run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p brokkr-cli
      - name: install and first-run budgets hold
        run: bash scripts/bootstrap-bench.sh --binary target/release/brokkr

  # The packaging channels are proved with the real tools, against real
  # packages built from the real binary — the test's own fallbacks (a
  # synthetic .deb, a skipped createrepo_c) exist for a developer's
  # laptop, and `BROKKR_PACKAGING_TOOLS=required` forbids them here.
  packaging:
    name: packaging channels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c rpm
          # The same pin the release path uses — CI proves the pinned
          # version is installable before a tag depends on it.
          nfpm_version="$(tr -d '[:space:]' < packaging/nfpm-version.txt)"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${nfpm_version}"
      - run: cargo build --release --locked -p brokkr-cli
      - name: nfpm builds the .deb and the .rpm
        env:
          BROKKR_PKG_ARCH: amd64
          BROKKR_PKG_BINARY: target/release/brokkr
        run: |
          export BROKKR_PKG_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p target/packaging
          # nfpm's env interpolation does not reach every field (the
          # contents src glob saw the literal ${BROKKR_PKG_BINARY}), so
          # the config is rendered with envsubst first — same contract,
          # no interpolation gamble.
          envsubst < packaging/nfpm.yaml > target/packaging/nfpm.rendered.yaml
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager deb --target target/packaging/brokkr-linux-x86_64.deb
          nfpm package --config target/packaging/nfpm.rendered.yaml --packager rpm --target target/packaging/brokkr-linux-x86_64.rpm
          ls -la target/packaging
      - name: the repositories, the templates and the bump render
        env:
          BROKKR_PACKAGING_TOOLS: required
          BROKKR_PACKAGING_DIST: target/packaging
        run: cargo test --locked -p brokkr-cli --test packaging

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).

  # `nix flake check` is run where nix exists rather than asserted where
  # it does not: this job installs it. What the check proves is that the
  # flake evaluates — building it needs a release's real digests, which
  # the channels job renders after the tag (see packaging/README.md).
  flake:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  release-binary:
    name: release binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p brokkr-cli
      # One binary: the `forge` shim is gone (decision 0019 ruling 9).
      - uses: actions/upload-artifact@v4
        with:
          name: brokkr-linux-x86_64
          path: target/release/brokkr
