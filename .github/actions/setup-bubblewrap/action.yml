name: setup-bubblewrap
description: >-
  Build bubblewrap from its release tarball, verified by digest, and open
  unprivileged user namespaces on the runner.
# Decision 0043: the hands tests and the boxed seats build a real bubblewrap
# namespace on Linux; the boundary is never simulated, so the tool is
# installed. Ubuntu's package is 0.9, and overlay binds arrived in 0.10, so
# the release is built from its tarball, and the tarball is checked against
# the digest recorded here before anything is built from it (issue #340).
# Bumping the version means bumping the digest.
#
# The runner image restricts unprivileged user namespaces through AppArmor,
# which leaves a new network namespace unable to raise its own loopback
# ("loopback: Failed RTM_NEWADDR"). That is a runner setting, not a product
# requirement: an operator's Linux box needs bubblewrap and nothing else.
#
# strace is test tooling, not a product requirement: the broker's
# held-launcher proofs stop a fixture launcher at its exec, and where boundary
# evidence is required a missing tracer fails them rather than skipping
# (decision 0065 slice two, U6c5c).
#
# The build is cached where a job asks for it (#633): `apt-get update` and
# the build tools cost the two longest required jobs over two minutes a run.
# The key is the runner's OS release and architecture and this file's own
# digest, so a new version or digest here, or a runner on another OS
# release (`ubuntu-24.04`, say), builds afresh from the verified tarball. The cache is opt-in: a release job builds
# from source every time, and never runs a binary another run left.
inputs:
  protect-system-tree:
    description: >-
      'true' makes the runner's system set protected before the broker's
      boundary proofs run (decision 0065 slice two, operator ruling
      2026-10-07). 'background' starts the same preparation detached and
      names it in BROKKR_SYSTEM_SET, so it overlaps the build and
      scripts/test-shards.sh waits on it, failing closed, before its first
      shard (#647). 'false' leaves the set as the image ships it; any other
      value fails the step.
    default: 'false'
  cache-build:
    description: >-
      'true' restores the bwrap this file's pins built on the same runner
      release, and saves the one it builds on a miss (#633).
    default: 'false'
runs:
  using: composite
  steps:
    - name: the runner's release, for the build cache
      id: release
      if: inputs.cache-build == 'true'
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        echo "release=${ID}-${VERSION_ID}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
    - name: bubblewrap's build, cached by release and pins
      id: cache
      if: inputs.cache-build == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/bubblewrap-build
        key: bubblewrap-${{ steps.release.outputs.release }}-${{ hashFiles('.github/actions/setup-bubblewrap/action.yml') }}
    - name: bubblewrap, pinned by version and digest
      shell: bash
      env:
        BWRAP_VERSION: 0.11.0
        BWRAP_SHA256: 988fd6b232dafa04b8b8198723efeaccdb3c6aa9c1c7936219d5791a8b7a8646
        CACHED: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        build="${RUNNER_TEMP}/bubblewrap-build"
        if [ "$CACHED" != 'true' ]; then
          sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build libcap-dev pkg-config xz-utils strace
          tarball="${RUNNER_TEMP}/bubblewrap-${BWRAP_VERSION}.tar.xz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/containers/bubblewrap/releases/download/v${BWRAP_VERSION}/bubblewrap-${BWRAP_VERSION}.tar.xz"
          echo "${BWRAP_SHA256}  ${tarball}" | sha256sum -c -
          tar xJf "$tarball" -C "$RUNNER_TEMP"
          (cd "${RUNNER_TEMP}/bubblewrap-${BWRAP_VERSION}" && meson setup _build -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled >/dev/null && ninja -C _build >/dev/null)
          mkdir -p "$build"
          install -m 0755 "${RUNNER_TEMP}/bubblewrap-${BWRAP_VERSION}/_build/bwrap" "$build/bwrap"
        fi
        sudo install -m 0755 "$build/bwrap" /usr/local/bin/bwrap
        # The image carries strace (6.8 on ubuntu-24.04), so a cached build
        # updates no package list; one without it is given it.
        if ! command -v strace >/dev/null; then
          sudo apt-get update -q && sudo apt-get install -y -q strace
        fi
        bwrap --version
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
    # The broker admits an MCP server only where the system set its box
    # binds (hands.rs HOST_TOOLCHAIN_BINDS and the system bin directories)
    # is root-owned, has no group or other write and carries no access
    # ACL. The hosted image ships /usr/share mode 777 with ACLs,
    # /usr/lib/jvm and parts of /usr/local 777, and packer- and
    # runner-owned files under /usr/local, so the broker rightly refuses
    # it. This makes the disposable runner's set protected, as a properly
    # run host is. Owners change only where they are not root, so no
    # setuid bit on a root file is cleared, and group owners are left as
    # they are.
    #
    # The preparation takes about 143 s, so 'background' overlaps it with
    # the build (#647). The build only reads /usr: setfacl -b, chmod go-w and
    # a chown to root keep every read, and no step between this one and the
    # shards installs under /usr. Its output goes to the directory's `log`,
    # and its exit status and seconds to `status`, renamed into place once
    # it has ended; scripts/test-shards.sh waits for that status after its
    # build and before its first shard, and refuses a missing, unreadable
    # or non-zero one with the log printed, so a half-protected set never
    # reaches the proofs and nothing changes the set once they start.
    - name: a protected system set for the broker's boundary proofs
      if: inputs.protect-system-tree != 'false'
      shell: bash
      env:
        PROTECT: ${{ inputs.protect-system-tree }}
      run: | # zizmor: ignore[github-env] BROKKR_SYSTEM_SET is ${RUNNER_TEMP}/brokkr-system-set, a runner-controlled constant scripts/test-shards.sh reads; no input reaches it
        set -euo pipefail
        protect() {
          set -euo pipefail
          # The hosted image's preinstalled SDKs make the server's system set
          # ~708,000 entries (420,000 under /usr/local), and one broker
          # admission walks it in ~11 s, so the full suite's contention pushes
          # some past the fixed 30 s deadline (diagnostic #587). No test uses
          # them; removing them leaves an ordinary host's set (operator ruling
          # 2026-10-08). The broker's real cost on such hosts stays a finding
          # for task 28.17.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/share/vcpkg /usr/local/julia* /usr/local/.ghcup \
            /usr/share/swift /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/jvm
          for d in /usr/bin /usr/sbin /usr/lib /usr/lib64 /usr/include /usr/share /usr/local \
                   /usr/libexec /bin /sbin /lib /lib64 /etc/ssl/certs /etc/ca-certificates /etc/alternatives \
                   /etc/ld.so.cache /etc/ld.so.conf /etc/ld.so.conf.d; do
            if [ ! -e "$d" ] || [ -L "$d" ]; then continue; fi
            sudo setfacl -R -P -b "$d"
            sudo find "$d" -xdev ! -user root -exec chown -h root {} +
            sudo find "$d" -xdev ! -type l -perm /022 -exec chmod go-w {} +
          done
          echo "server system set: $(sudo find /usr/bin /usr/lib /usr/share /usr/local /usr/libexec /usr/include -xdev 2>/dev/null | wc -l) entries"
        }
        case "$PROTECT" in
          true) protect; exit 0 ;;
          background) ;;
          *) echo "protect-system-tree is 'true', 'background' or 'false', not '$PROTECT'" >&2; exit 1 ;;
        esac
        set_dir="${RUNNER_TEMP}/brokkr-system-set"
        mkdir "$set_dir"
        echo "BROKKR_SYSTEM_SET=$set_dir" >> "$GITHUB_ENV"
        export -f protect
        # A new session, every descriptor away from the step's: the step
        # ends at once, and the runner keeps the preparation to the job's end.
        setsid bash -c '
          start="$SECONDS"
          (protect) >"$1/log" 2>&1
          status=$?
          printf "%s %s\n" "$status" "$((SECONDS - start))" >"$1/status.new"
          mv "$1/status.new" "$1/status"
        ' _ "$set_dir" </dev/null >/dev/null 2>&1 &
        echo "the protected system set is prepared in the background; its log is $set_dir/log"
