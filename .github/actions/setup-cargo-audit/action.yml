name: setup-cargo-audit
description: >-
  Install cargo-audit from rustsec's own release, verified by digest, so
  rustsec/audit-check finds it and never builds one from source.
# cargo-audit is pinned by version AND digest and installed from rustsec's
# own release, never built from source on the runner. Left to itself,
# audit-check runs `cargo install cargo-audit` (latest, unlocked) whenever
# the binary is absent — and on 2026-09-03 that pulled a freshly published
# dependency that failed to compile, so the required check went red on main
# with no advisory involved (#164, #166 merged past it by ruling). A
# prebuilt binary whose digest is recorded here fails only when the pinned
# release itself changes, which is a fact worth failing on. CI and the
# release admission both use this one step (issue #340). Bumping the
# version means bumping the digest.
runs:
  using: composite
  steps:
    - name: cargo-audit's release asset, cached by this file's pins
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/cargo-audit-release
        key: cargo-audit-release-${{ hashFiles('.github/actions/setup-cargo-audit/action.yml') }}
    - name: cargo-audit, pinned by version and digest
      shell: bash
      env:
        CARGO_AUDIT_VERSION: 0.22.2
        CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
      run: |
        set -euo pipefail
        asset="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
        mkdir -p "${RUNNER_TEMP}/cargo-audit-release"
        tarball="${RUNNER_TEMP}/cargo-audit-release/${asset}.tgz"
        # The cached asset is used only while its digest holds; otherwise it
        # is fetched again. Each attempt has a minute, so a hung connection
        # is retried like a release download's 5xx answer or a dropped one.
        if ! sha256sum -c --status <<< "${CARGO_AUDIT_SHA256}  ${tarball}" >/dev/null 2>&1; then
          curl -sSfL --connect-timeout 20 --max-time 60 --retry 6 --retry-delay 10 --retry-all-errors -o "$tarball" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${asset}.tgz"
        fi
        echo "${CARGO_AUDIT_SHA256}  ${tarball}" | sha256sum -c -
        tar xzf "$tarball" -C "$RUNNER_TEMP"
        install -m 0755 "${RUNNER_TEMP}/${asset}/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
        cargo audit --version
