name: setup-actionlint
description: >-
  Install actionlint from its own release, verified by digest, for the
  non-Rust lints job.
# actionlint is pinned by version AND digest and installed from rhysd's own
# release: the digest is the one the release's checksums file publishes,
# checked on the host before it was recorded here (issue #339). Bumping the
# version means bumping the digest.
runs:
  using: composite
  steps:
    - name: actionlint's release asset, cached by this file's pins
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/actionlint-release
        key: actionlint-release-${{ hashFiles('.github/actions/setup-actionlint/action.yml') }}
    - name: actionlint, pinned by version and digest
      shell: bash
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64"
        mkdir -p "${RUNNER_TEMP}/actionlint-release"
        tarball="${RUNNER_TEMP}/actionlint-release/${asset}.tar.gz"
        # The cached asset is used only while its digest holds; otherwise it
        # is fetched again. Each attempt has a minute, so a hung connection
        # is retried like a release download's 5xx answer or a dropped one.
        if ! sha256sum -c --status <<< "${ACTIONLINT_SHA256}  ${tarball}" >/dev/null 2>&1; then
          curl -sSfL --connect-timeout 20 --max-time 60 --retry 6 --retry-delay 10 --retry-all-errors -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}.tar.gz"
        fi
        echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/bin"
        tar xzf "$tarball" -C "${RUNNER_TEMP}/bin" actionlint
        install -m 0755 "${RUNNER_TEMP}/bin/actionlint" "$HOME/.cargo/bin/actionlint"
        actionlint -version
