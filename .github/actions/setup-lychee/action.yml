name: setup-lychee
description: >-
  Install lychee from its own release, verified by digest, for the
  non-Rust lints job and the weekly online link report.
# lychee is pinned by version AND digest and installed from lycheeverse's own
# release: the digest is the one the release's .sha256 file publishes,
# checked on the host before it was recorded here (issue #339). Bumping the
# version means bumping the digest.
runs:
  using: composite
  steps:
    - name: lychee's release asset, cached by this file's pins
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/lychee-release
        key: lychee-release-${{ hashFiles('.github/actions/setup-lychee/action.yml') }}
    - name: lychee, pinned by version and digest
      shell: bash
      env:
        LYCHEE_VERSION: 0.24.2
        LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
      run: |
        set -euo pipefail
        asset="lychee-x86_64-unknown-linux-musl"
        mkdir -p "${RUNNER_TEMP}/lychee-release"
        tarball="${RUNNER_TEMP}/lychee-release/${asset}.tar.gz"
        # The cached asset is used only while its digest holds; otherwise it
        # is fetched again. Each attempt has a minute, so a hung connection
        # is retried like a release download's 5xx answer or a dropped one.
        if ! sha256sum -c --status <<< "${LYCHEE_SHA256}  ${tarball}" >/dev/null 2>&1; then
          curl -sSfL --connect-timeout 20 --max-time 60 --retry 6 --retry-delay 10 --retry-all-errors -o "$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${asset}.tar.gz"
        fi
        echo "${LYCHEE_SHA256}  ${tarball}" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/bin"
        tar xzf "$tarball" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${asset}/lychee"
        install -m 0755 "${RUNNER_TEMP}/bin/lychee" "$HOME/.cargo/bin/lychee"
        lychee --version
