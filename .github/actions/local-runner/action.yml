name: local-runner
description: Keep compiled workspace artifacts on the local runner's NVMe volume.
runs:
  using: composite
  steps:
    - name: persistent compilation directory and real namespace probe
      shell: bash
      run: |
        set -euo pipefail
        # Keep a real target directory inside the workspace: the hands
        # tests bind that workspace, so an external symlink is not usable.
        if [ -L target ]; then
          echo 'local runner: target must be a real directory' >&2
          exit 1
        fi
        git clean -ffdx -e /target/
        mkdir -p target
        # rust-toolchain otherwise defaults to CARGO_INCREMENTAL=0 for
        # disposable runners. Keep workspace incremental state where useful;
        # release code generation and coverage keep their existing settings.
        case "$GITHUB_JOB" in
          engine | quality) echo 'CARGO_INCREMENTAL=1' >> "$GITHUB_ENV" ;;
        esac
        expected="$(sed -n 's/^ *BWRAP_VERSION: //p' .github/actions/setup-bubblewrap/action.yml)"
        test "$(bwrap --version)" = "bubblewrap $expected"
        command -v strace
        bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev /bin/true
