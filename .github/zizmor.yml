# zizmor 1.30.1's policy for this repository (issue #339). Every audit runs;
# what is set aside here is set aside by name, with its reason. A finding
# held to a line comes back the day that line moves, so it is re-judged
# rather than hidden. A finding a YAML comment can reach carries its ignore
# beside it in the workflow instead.
rules:
  self-repository:
    # zizmor prefers `$/.github/actions/...`; actionlint 1.7.12, the other
    # workflow gate, refuses that form ("ref is missing"), so both cannot
    # hold. Local actions stay `./.github/actions/<name>`, which
    # workflow_pins.rs holds to the repository's own action files.
    disable: true
  use-trusted-publishing:
    ignore:
      # The crates job's `cargo publish` uses the registry token the
      # operator ruled on 2026-09-05. Trusted publishing needs the
      # operator's crates.io configuration first.
      - release.yml:244
  adhoc-packages:
    ignore:
      # The weekly sweep installs the exact dsh release the dsh adapter
      # measured, pinned by version on the line itself.
      - research-weekly.yml:53
