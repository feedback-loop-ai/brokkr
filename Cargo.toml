[workspace]
resolver = "2"
members = [
    "crates/brokkr-core",
    "crates/brokkr-store",
    "crates/brokkr-protocol",
    "crates/brokkr-runtime",
    "crates/brokkr-view",
    "crates/brokkr-bridge",
    "crates/brokkr-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
# Decision 0018: permissive, never copyleft; the Rust ecosystem's dual
# convention, so a user picks either license.
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.dependencies]
brokkr-core = { path = "crates/brokkr-core" }
brokkr-store = { path = "crates/brokkr-store" }
brokkr-protocol = { path = "crates/brokkr-protocol" }
brokkr-runtime = { path = "crates/brokkr-runtime" }
brokkr-bridge = { path = "crates/brokkr-bridge" }
brokkr-view = { path = "crates/brokkr-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
# Decision 0014's narrow, explicit exception to the no-new-dependencies
# default, on the TUI path only. crossterm is reached through ratatui's
# own re-export: a second manifest line could resolve a different
# crossterm than `ratatui-crossterm` links.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
