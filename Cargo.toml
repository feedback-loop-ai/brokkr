[workspace]
resolver = "2"
members = [
    "crates/brokkr-core",
    "crates/brokkr-store",
    "crates/brokkr-protocol",
    "crates/brokkr-runtime",
    "crates/brokkr-view",
    "crates/brokkr-bridge",
    "crates/brokkr-cli",
    "crates/brokkr-seatbelt-probe",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.88"
# Decision 0018: permissive, never copyleft; the Rust ecosystem's dual
# convention, so a user picks either license.
license = "MIT OR Apache-2.0"
# cargo-binstall builds its download URL from `{ repo }`; without this
# field the manifest's binstall metadata cannot resolve at all.
repository = "https://github.com/feedback-loop-ai/brokkr"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unreachable_pub = "warn"

# Decision 0071 ruling 4, ratcheted (#337): the ceilings are clippy.toml's,
# and today's offenders carry #[expect(.., reason)], which
# unfulfilled_lint_expectations forces out as each is fixed.
[workspace.lints.clippy]
too_many_lines = "warn"
excessive_nesting = "warn"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
regex = "1.13"
brokkr-core = { path = "crates/brokkr-core", version = "0.11.0" }
brokkr-store = { path = "crates/brokkr-store", version = "0.11.0" }
brokkr-protocol = { path = "crates/brokkr-protocol", version = "0.11.0" }
brokkr-runtime = { path = "crates/brokkr-runtime", version = "0.11.0" }
brokkr-bridge = { path = "crates/brokkr-bridge", version = "0.11.0" }
brokkr-view = { path = "crates/brokkr-view", version = "0.11.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.53", default-features = false }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
# Decision 0014's narrow, explicit exception to the no-new-dependencies
# default, on the TUI path only. crossterm is reached through ratatui's
# own re-export: a second manifest line could resolve a different
# crossterm than `ratatui-crossterm` links.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# Debug builds keep file-and-line tables for backtraces and nothing more:
# full DWARF made every test binary 150-270 MB and each worktree's target
# 9-28 GB (2026-09-26). Dependencies carry no debug info at all; a
# backtrace through them still names their functions from the symbol
# table. The release profile is untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
