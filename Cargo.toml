[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-store",
    "crates/forge-protocol",
    "crates/forge-runtime",
    "crates/forge-bridge",
    "crates/forge-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-store = { path = "crates/forge-store" }
forge-protocol = { path = "crates/forge-protocol" }
forge-runtime = { path = "crates/forge-runtime" }
forge-bridge = { path = "crates/forge-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
