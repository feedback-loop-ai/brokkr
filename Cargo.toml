[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-store",
    "crates/forge-protocol",
    "crates/forge-runtime",
    "crates/forge-view",
    "crates/forge-bridge",
    "crates/forge-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-store = { path = "crates/forge-store" }
forge-protocol = { path = "crates/forge-protocol" }
forge-runtime = { path = "crates/forge-runtime" }
forge-bridge = { path = "crates/forge-bridge" }
forge-view = { path = "crates/forge-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
# Decision 0014's narrow, explicit exception to the no-new-dependencies
# default, on the TUI path only. crossterm is reached through ratatui's
# own re-export: a second manifest line could resolve a different
# crossterm than `ratatui-crossterm` links.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
