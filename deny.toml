# License compliance for the dependency tree — the control decision
# 0018 claims. cargo-deny checks every crate in Cargo.lock against
# this allowlist; anything outside it fails CI. Permissive only, in
# the spirit of the ruling: openness that imposes nothing.
[licenses]
# Dev-only crates such as the test ECMAScript engine are held to the
# same allowlist; cargo-deny skips them unless told otherwise.
include-dev = true
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Unicode data tables in the TUI dependency tree — a permissive DATA
  # license (Community Data License Agreement), within the ruling.
  "CDLA-Permissive-2.0",
  # Arrived with the seat-record validator's schema tree (decision
  # 0034): MIT without even the attribution clause. Strictly more
  # permissive than the MIT already allowed above, so it imposes less
  # than anything on this list rather than more.
  "MIT-0",
]

[advisories]
# Advisories are the RustSec job's beat; cargo-deny here checks
# licenses, bans and sources, so each gate says one thing.
db-path = "~/.cargo/advisory-dbs"

# The graph cargo-deny judges carries every feature and every
# dev-dependency, so the licence check covers every crate it gathers.
[graph]
all-features = true

# Every crate comes from crates.io or this workspace, never an unknown
# registry or a git repository.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Decision 0071 ruling 1's one-way crate graph, and its one home. Each
# entry names the only crates allowed to depend on it directly (its
# `wrappers`), dev edges included, so a new upward edge of any kind is
# refused here. cargo-deny cannot tell a dev edge from a normal one, so
# `crates/brokkr-cli/tests/layering/` holds every edge `cargo metadata`
# reports to this table and refuses a normal edge where only a dev one is
# allowed. It refuses any line here it does not understand, so keep one
# entry per line. `brokkr-cli` is the root and has no parent to name.
# The same test closes core's and view's own dependency sets, and holds
# them to the wrappers here, so a pure crate names no crate unlisted.
[bans]
# Decision 0071 ruling 4, ratcheted (#337): a second version of any crate
# is refused. The skips are today's duplicates, each the version with the
# narrower reach; crates/brokkr-cli/tests/layering/ refuses a skip the
# lockfile no longer duplicates, and holds the list to the baseline in
# quality/duplicate-skips.txt, so this list only shrinks.
multiple-versions = "deny"
skip = [
  { crate = "getrandom@0.2.17", reason = "pulled by ring 0.17 under ureq's rustls (#337 baseline)" },
  { crate = "getrandom@0.3.4", reason = "pulled by ahash 0.8 (#337 baseline)" },
  { crate = "hashbrown@0.14.5", reason = "pulled by dashmap 6 (#337 baseline)" },
  { crate = "hashbrown@0.16.1", reason = "pulled by boa_engine 0.21, dev-only (#337 baseline)" },
  { crate = "r-efi@5.3.0", reason = "pulled by getrandom 0.3 (#337 baseline)" },
  { crate = "syn@3.0.3", reason = "pulled by bytemuck_derive 1.12 (#337 baseline)" },
  { crate = "windows-sys@0.52.0", reason = "pulled by ring 0.17, never built on Linux or macOS (#337 baseline)" },
]
deny = [
  { crate = "brokkr-core", wrappers = ["brokkr-view", "brokkr-store", "brokkr-runtime", "brokkr-bridge", "brokkr-cli"], reason = "core sits at the bottom of the one-way graph (decision 0071 ruling 1)" },
  { crate = "brokkr-view", wrappers = ["brokkr-runtime", "brokkr-cli"], reason = "view is read by the engine and the surfaces only (decision 0071 ruling 1)" },
  { crate = "brokkr-protocol", wrappers = ["brokkr-runtime", "brokkr-cli", "brokkr-seatbelt-probe"], reason = "the driver protocol is spoken by the engine and the binary only, and exercised by the seatbelt probe's tests (decision 0071 ruling 1, #341)" },
  { crate = "brokkr-store", wrappers = ["brokkr-runtime", "brokkr-bridge", "brokkr-cli"], reason = "the journal is written above core and view (decision 0071 ruling 1)" },
  { crate = "brokkr-runtime", wrappers = ["brokkr-bridge", "brokkr-cli"], reason = "the engine sits under the bridge and the binary only (decision 0071 ruling 1)" },
  { crate = "brokkr-bridge", wrappers = ["brokkr-cli"], reason = "the bridge is reached from the binary only (decision 0071 ruling 1)" },
  { crate = "rusqlite", wrappers = ["brokkr-store", "brokkr-runtime", "brokkr-bridge", "brokkr-cli"], reason = "SQLite lives behind brokkr-store; the crates above it read journals in tests only (decision 0071 ruling 1)" },
  { crate = "ureq", wrappers = ["brokkr-bridge"], reason = "the network client lives in brokkr-bridge (decision 0071 ruling 1)" },
  { crate = "ratatui", wrappers = ["brokkr-cli"], reason = "the terminal lives in brokkr-cli (decision 0014)" },
  { crate = "uuid", wrappers = ["brokkr-protocol", "brokkr-store", "brokkr-runtime"], reason = "fresh ids are randomness, which core and view never draw (decision 0071 ruling 1)" },
  { crate = "time", wrappers = ["brokkr-core", "brokkr-store", "brokkr-runtime", "brokkr-bridge", "brokkr-cli", "boa_engine"], reason = "view takes `now` as an argument and needs no clock crate (decision 0071 ruling 1)" },
]
