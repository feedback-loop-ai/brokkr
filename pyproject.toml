[project]
name = "the-forge"
version = "0.0.1"
description = "Deterministic delivery engine: an event-sourced phase state machine at the outermost layer of autonomous multi-agent software delivery; agent sessions are leaf effects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Valentin Yanakiev" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
