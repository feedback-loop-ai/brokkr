# typos 1.50.2 over the whole tree (issue #339). A genuine typo is fixed,
# never listed here. What is listed is a real term typos does not know, or
# a spelling the tree means, each with its reason.

[files]
# The diagram renderer's npm lockfile: registry URLs and integrity hashes,
# generated, never prose.
extend-exclude = [
  ".github/lint/package-lock.json",
  # --hidden reaches dot-directories; a fresh CI clone's .git holds commit
  # messages and refs, which are not the tree.
  ".git/",
]

[default]
extend-ignore-re = [
  # Commit ids and digest prefixes: `6ba24cf`, `f742ba0e…`.
  "\\b[0-9a-f]{7,64}\\b",
  # Run ids: a slug cut at a length, then its seven- or eight-hex suffix
  # (`the-whole-family-branch-integrat-0a5cdb4f`).
  "\\b[a-z0-9]+(?:-[a-z0-9]+)+-[0-9a-f]{7,8}\\b",
  # A readout shown cut short with an ellipsis (`prefix selec…`).
  "\\b\\w+…",
  # Keys misspelled on purpose, quoted as the refused example beside the
  # refusal a test pins: "clas", 'tool_permisions', `"lokal"`, "whenn",
  # and base64's b"fo" test vector. Unquoted, they are still typos.
  "[\"'`](?:clas|lokal|tool_permisions|whenn|fo)\\\\?[\"'`]",
]

[default.extend-words]
# The TUI crate (decision 0014).
ratatui = "ratatui"
# A standard spelling of "unparsable", in refusal text tests assert on.
unparseable = "unparseable"
Unparseable = "Unparseable"
# A possessive in a test name, where no apostrophe can go.
librarys = "librarys"
repositorys = "repositorys"
boundarys = "boundarys"
anothers = "anothers"
dispatchs = "dispatchs"
# "mis-instantiated": the prefix before its hyphen.
mis = "mis"
# The `.seh_stackalloc` assembler directive (decision 0048).
seh = "seh"
# A real word typos does not know.
compilability = "compilability"
# gpg's --with-colons fingerprint record, which release.yml's signing step
# reads the key from.
fpr = "fpr"

[default.extend-identifiers]
# SQL's INSERT, pluralised in prose.
INSERTs = "INSERTs"
# Decisions as code, the essay's acronym.
DaaC = "DaaC"
# A node in the console's graph layout (ui.html).
nd = "nd"
