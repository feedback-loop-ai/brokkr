# Decision 0044 ruling 5 (erratum of 2026-09-04): the hire the operator
# ruled for this office, Qwen3.8-Max on Model Studio, and nothing else.
#
# dsh's default headless profile names no Model Studio route, so the
# provider is stated here, keyed from the environment (DASHSCOPE_API_KEY)
# and never holding a value, exactly as the operator's own profile layer
# states it; where that layer exists the two agree. Search keeps its own
# key (DEEPSEEK_API_KEY).
#
# This file once also turned the harness's page fetch on. That row was
# inert: 0.1.0-rc.6 shipped no fetch provider, so the first sweep read
# with curl, and 0.1.2-rc.1 ships `web-fetch-http` with fetch on by
# default (measured 2026-09-04). The grant is the profile's; the overlay
# carries only the route. The file is part of the bundle, so it is part
# of the recipe's digest. The path is read from the repository root,
# where the sweep runs.
#
# The model entry states its reasoning levels, because nothing else
# can. A custom provider's entry with no `reasoningEfforts` is resolved
# against dsh's installed catalog for the same provider key, and no
# catalog ships for `dashscope`, so the model materialised as
# non-reasoning and every pinned effort threw
# (UNSUPPORTED_REASONING_EFFORT, workflow run 34115364530, 2026-09-07;
# measured on dsh 0.1.2-rc.1 and again on 0.1.3-alpha.2, identical).
# The levels are the ones dsh's own Qwen catalog lists for Qwen3.8-Max:
# low, medium, xhigh; high and max are pinned unsupported there and are
# left undeclared here, so they stay refused. Each key is the level a
# seat may pin; each value is what goes on the wire.
#
# The route says Model Studio takes no `developer` role. pi-ai 1.0.2+
# in dsh 0.2 sends a `developer`-role message to a reasoning model, and
# Model Studio refuses it: `INVALID_REQUEST: 400 … developer is not one
# of ['system', 'assistant', 'user', 'tool', 'function']`. With
# `supportsDeveloperRole: false`, qwen3.8-max answered at xhigh and at
# low on dsh 0.2.1-rc.2 (measured 2026-10-17, #728; decision 0035
# addendum 2026-10-17).
- id: llm-pi-ai
  config:
    providers:
      dashscope:
        displayName: Model Studio (Token Plan)
        apiKeyEnv: DASHSCOPE_API_KEY
        api: openai-completions
        baseURL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
        models:
          - id: qwen3.8-max
            reasoningEfforts:
              low: low
              medium: medium
              xhigh: xhigh
