<!doctype html>
<meta charset="utf-8">
<title>forge</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #7c5cff; }
  body { font: 14px/1.5 ui-monospace, monospace; margin: 0; display: flex; height: 100vh; }
  #runs { width: 340px; border-right: 1px solid var(--line); overflow-y: auto; padding: .5rem; }
  #detail { flex: 1; overflow-y: auto; padding: 1rem; }
  h1 { font-size: 1rem; margin: .3rem 0 .8rem; }
  .run { padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 6px;
         margin-bottom: .4rem; cursor: pointer; }
  .run:hover, .run.active { border-color: var(--accent); }
  .run .id { font-weight: 600; word-break: break-all; }
  .badge { display: inline-block; padding: 0 .45em; border-radius: 999px;
           border: 1px solid var(--line); font-size: .85em; }
  .completed { color: #2e9e5b; } .stopped { color: #d05050; }
  .awaiting_operator { color: #d09a3e; } .running { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin-top: .8rem; }
  td, th { border-bottom: 1px solid var(--line); padding: .3rem .5rem;
           text-align: left; vertical-align: top; }
  td.payload { max-width: 46rem; overflow-wrap: anywhere; color: #888; }
  .cause { color: #888; font-size: .85em; }
  pre { background: #8881; padding: .6rem; border-radius: 6px; overflow-x: auto; }
</style>
<div id="runs"><h1>forge — runs</h1><div id="runlist">loading…</div></div>
<div id="detail"><h1>select a run</h1>
  <p>Read-only surface: this page submits no commands and writes nothing
  (decision 0003, constitutional boundary 6).</p></div>
<script>
// SECURITY DISCIPLINE: journal content is seat/driver-authored and
// untrusted. Nothing journal-derived ever reaches innerHTML — all
// dynamic content is set through textContent (el(); badge classes come
// from a fixed allowlist, never from data).
let active = null, source = null;

const KNOWN_STATUS = ['completed', 'stopped', 'awaiting_operator', 'running'];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function badge(text, status) {
  const cls = KNOWN_STATUS.includes(status) ? ' ' + status : '';
  return el('span', 'badge' + cls, text);
}

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  const list = document.getElementById('runlist');
  list.replaceChildren();
  for (const run of runs.reverse()) {
    const item = el('div', 'run' + (run.run_id === active ? ' active' : ''));
    item.appendChild(el('div', 'id', run.run_id));
    item.appendChild(badge(run.status ?? '?', run.status));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge(run.phase ?? '-'));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge('seq ' + (run.seq ?? 0)));
    item.onclick = () => select(run.run_id);
    list.appendChild(item);
  }
}

function row(cells) {
  const tr = el('tr');
  for (const cell of cells) tr.appendChild(cell);
  return tr;
}

async function loadDetail(id) {
  const data = await (await fetch('/api/run/' + encodeURIComponent(id))).json();
  const s = data.summary ?? {};
  const byId = {};
  for (const e of data.events ?? []) byId[e.event_id] = e.seq;

  const detail = document.getElementById('detail');
  detail.replaceChildren();
  detail.appendChild(el('h1', null, s.run_id ?? id));
  const line = el('p');
  line.appendChild(badge(s.status ?? '?', s.status));
  line.appendChild(document.createTextNode(' '));
  line.appendChild(badge('phase ' + (s.phase ?? '-')));
  detail.appendChild(line);
  if (s.park_reason) detail.appendChild(el('pre', null, s.park_reason));
  detail.appendChild(el('pre', null, JSON.stringify(s.last_decision ?? {}, null, 2)));

  const table = el('table');
  table.appendChild(row([
    el('th', null, 'seq ←cause'), el('th', null, 'type'), el('th', null, 'label'),
    el('th', null, 'payload'), el('th', null, 'recorded'),
  ]));
  for (const e of data.events ?? []) {
    const p = e.payload || {};
    const label = p.rule_id ?? p.phase ?? p.result ?? p.command ?? p.reason ?? '';
    const seqCell = el('td', null, e.seq);
    if (e.causation_id && byId[e.causation_id]) {
      seqCell.appendChild(document.createTextNode(' '));
      seqCell.appendChild(el('span', 'cause', '← ' + byId[e.causation_id]));
    }
    table.appendChild(row([
      seqCell,
      el('td', null, e.type),
      el('td', null, label),
      el('td', 'payload', JSON.stringify(p)),
      el('td', null, e.recorded_at),
    ]));
  }
  detail.appendChild(table);
}

function select(id) {
  active = id;
  loadRuns();
  loadDetail(id);
  if (source) source.close();
  source = new EventSource('/sse/' + encodeURIComponent(id));
  source.onmessage = () => { loadDetail(id); loadRuns(); };
}

loadRuns();
setInterval(loadRuns, 5000);
</script>
