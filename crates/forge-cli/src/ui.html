<!doctype html>
<meta charset="utf-8">
<title>forge</title>
<style>
  :root {
    color-scheme: dark;
    --void: #12101a; --panel: #1a1726; --line: #2c2840;
    --text: #e8e6f0; --dim: #8b87a0;
    --violet: #7c5cff; --phosphor: #45e08c; --park: #f0b15a; --halt: #ff6b5e;
  }
  body { font: 14px/1.5 'JetBrains Mono', ui-monospace, monospace; margin: 0;
         display: flex; flex-direction: column; height: 100vh;
         background: var(--void); color: var(--text); }
  #brand { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  #brand .word { font-size: 15px; letter-spacing: 0.06em; font-weight: 700; }
  #brand .word .the { color: var(--dim); font-weight: 400; }
  #brand .tag { margin-left: auto; font-size: 11px; color: var(--phosphor);
                letter-spacing: 0.08em; }
  #cols { display: flex; flex: 1; min-height: 0; }
  #runs { width: 340px; border-right: 1px solid var(--line); overflow-y: auto;
          padding: .5rem; }
  #detail { flex: 1; overflow-y: auto; padding: 1rem; }
  h1 { font-size: 1rem; margin: .3rem 0 .8rem; }
  .run { padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 8px;
         margin-bottom: .4rem; cursor: pointer; background: var(--panel); }
  .run:hover, .run.active { border-color: var(--violet); }
  .run .id { font-weight: 600; word-break: break-all; }
  .badge { display: inline-block; padding: 0 .5em; border-radius: 999px;
           border: 1px solid var(--line); font-size: .85em; color: var(--dim); }
  .completed { color: var(--phosphor); border-color: rgba(69,224,140,.45);
               background: rgba(69,224,140,.10); }
  .stopped { color: var(--halt); border-color: rgba(255,107,94,.45);
             background: rgba(255,107,94,.10); }
  .awaiting_operator { color: var(--park); border-color: rgba(240,177,90,.45);
                       background: rgba(240,177,90,.10); }
  .running { color: var(--violet); border-color: rgba(124,92,255,.45);
             background: rgba(124,92,255,.10); }
  table { border-collapse: collapse; width: 100%; margin-top: .8rem; }
  td, th { border-bottom: 1px solid var(--line); padding: .3rem .5rem;
           text-align: left; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  td.payload { max-width: 46rem; overflow-wrap: anywhere; color: var(--dim); }
  .cause { color: var(--dim); font-size: .85em; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: .6rem;
        border-radius: 8px; overflow-x: auto; }
</style>
<div id="brand">
  <svg width="20" height="20" viewBox="0 0 44 44" fill="none" aria-hidden="true"><path d="M6 22h22" stroke="#3a3654" stroke-width="2"/><circle cx="10" cy="22" r="3" fill="#7c5cff"/><circle cx="19" cy="22" r="3" fill="#7c5cff"/><circle cx="33" cy="22" r="5" fill="#45e08c"/></svg>
  <span class="word"><span class="the">the_</span>FORGE</span>
  <span class="tag">&gt; the machine is the outer loop_</span>
</div>
<div id="cols">
<div id="runs"><h1>runs</h1><div id="runlist">loading…</div></div>
<div id="detail"><h1>select a run</h1>
  <p>Read-only surface: this page submits no commands and writes nothing
  (decision 0003, constitutional boundary 6).</p></div>
</div>
<script>
// SECURITY DISCIPLINE: journal content is seat/driver-authored and
// untrusted. Nothing journal-derived ever reaches innerHTML — all
// dynamic content is set through textContent (el(); badge classes come
// from a fixed allowlist, never from data).
let active = null, source = null;

const KNOWN_STATUS = ['completed', 'stopped', 'awaiting_operator', 'running'];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function badge(text, status) {
  const cls = KNOWN_STATUS.includes(status) ? ' ' + status : '';
  return el('span', 'badge' + cls, text);
}

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  const list = document.getElementById('runlist');
  list.replaceChildren();
  for (const run of runs.reverse()) {
    const item = el('div', 'run' + (run.run_id === active ? ' active' : ''));
    item.appendChild(el('div', 'id', run.run_id));
    item.appendChild(badge(run.status ?? '?', run.status));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge(run.phase ?? '-'));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge('seq ' + (run.seq ?? 0)));
    item.onclick = () => select(run.run_id);
    list.appendChild(item);
  }
}

function row(cells) {
  const tr = el('tr');
  for (const cell of cells) tr.appendChild(cell);
  return tr;
}

async function loadDetail(id) {
  const data = await (await fetch('/api/run/' + encodeURIComponent(id))).json();
  const s = data.summary ?? {};
  const byId = {};
  for (const e of data.events ?? []) byId[e.event_id] = e.seq;

  const detail = document.getElementById('detail');
  detail.replaceChildren();
  detail.appendChild(el('h1', null, s.run_id ?? id));
  const line = el('p');
  line.appendChild(badge(s.status ?? '?', s.status));
  line.appendChild(document.createTextNode(' '));
  line.appendChild(badge('phase ' + (s.phase ?? '-')));
  detail.appendChild(line);
  if (s.park_reason) detail.appendChild(el('pre', null, s.park_reason));
  detail.appendChild(el('pre', null, JSON.stringify(s.last_decision ?? {}, null, 2)));

  const table = el('table');
  table.appendChild(row([
    el('th', null, 'seq ←cause'), el('th', null, 'type'), el('th', null, 'label'),
    el('th', null, 'payload'), el('th', null, 'recorded'),
  ]));
  for (const e of data.events ?? []) {
    const p = e.payload || {};
    const label = p.rule_id ?? p.phase ?? p.result ?? p.command ?? p.reason ?? '';
    const seqCell = el('td', null, e.seq);
    if (e.causation_id && byId[e.causation_id]) {
      seqCell.appendChild(document.createTextNode(' '));
      seqCell.appendChild(el('span', 'cause', '← ' + byId[e.causation_id]));
    }
    table.appendChild(row([
      seqCell,
      el('td', null, e.type),
      el('td', null, label),
      el('td', 'payload', JSON.stringify(p)),
      el('td', null, e.recorded_at),
    ]));
  }
  detail.appendChild(table);
}

function select(id) {
  active = id;
  loadRuns();
  loadDetail(id);
  if (source) source.close();
  source = new EventSource('/sse/' + encodeURIComponent(id));
  source.onmessage = () => { loadDetail(id); loadRuns(); };
}

loadRuns();
setInterval(loadRuns, 5000);
</script>
