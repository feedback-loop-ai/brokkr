<!doctype html>
<meta charset="utf-8">
<title>forge</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%2345e08c'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --void: #12101a; --panel: #1a1726; --line: #2c2840;
    --text: #e8e6f0; --dim: #8b87a0;
    --violet: #7c5cff; --phosphor: #45e08c; --park: #f0b15a; --halt: #ff6b5e;
  }
  body { font: 14px/1.5 'JetBrains Mono', ui-monospace, monospace; margin: 0;
         display: flex; flex-direction: column; height: 100vh;
         background: var(--void); color: var(--text); }
  #brand { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  #brand .word { font-size: 15px; letter-spacing: 0.06em; font-weight: 700; }
  #brand .word .the { color: var(--dim); font-weight: 400; }
  #brand .tag { margin-left: auto; font-size: 11px; color: var(--phosphor);
                letter-spacing: 0.08em; }
  #cols { display: flex; flex: 1; min-height: 0; }
  #runs { width: clamp(220px, 26vw, 340px); flex-shrink: 0;
          border-right: 1px solid var(--line); overflow-y: auto;
          padding: .5rem; }
  #detail { flex: 1; min-width: 0; overflow-y: auto; padding: 1rem; }
  h1 { font-size: 1rem; margin: .3rem 0 .8rem; }
  .run { padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 8px;
         margin-bottom: .4rem; cursor: pointer; background: var(--panel); }
  .run:hover, .run.active { border-color: var(--violet); }
  .run .id { font-weight: 600; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 0 .5em; border-radius: 999px;
           border: 1px solid var(--line); font-size: .85em; color: var(--dim); }
  .completed { color: var(--phosphor); border-color: rgba(69,224,140,.45);
               background: rgba(69,224,140,.10); }
  .stopped { color: var(--halt); border-color: rgba(255,107,94,.45);
             background: rgba(255,107,94,.10); }
  .awaiting_operator { color: var(--park); border-color: rgba(240,177,90,.45);
                       background: rgba(240,177,90,.10); }
  .running { color: var(--violet); border-color: rgba(124,92,255,.45);
             background: rgba(124,92,255,.10); }
  /* Tables live in .tbl scroll containers: a wide table scrolls inside
     its own box instead of clipping invisibly on narrow screens. */
  .tbl { overflow-x: auto; margin-top: .8rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: .3rem .5rem;
           text-align: left; vertical-align: top; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; }
  td.payload { min-width: 18rem; max-width: 46rem; overflow-wrap: anywhere;
               white-space: normal; color: var(--dim); }
  /* Payloads clamp to two lines by default — a 5KB feature text must
     not become a 3500px row. Click toggles the full text; the text
     itself stays in the DOM either way, so find-in-page still works. */
  td.payload.clip { cursor: pointer; }
  td.payload.clip > .body { display: -webkit-box; -webkit-line-clamp: 2;
                            -webkit-box-orient: vertical; overflow: hidden; }
  td.payload.clip.open > .body { display: block; }
  td.payload.clip > .more { color: var(--violet); opacity: .8;
                            font-size: .85em; user-select: none; }
  /* The last ruling, natively: badge + transition, inputs in the
     tooltip. The raw payload stays reachable in the events table. */
  .ruling { margin: .2rem 0 .6rem; }
  .ruling .arrow { color: var(--dim); }
  .problem { color: var(--halt); white-space: pre-wrap; }
  /* Target cells hold short (tail-first) paths: keep them on one line
     and let the .tbl container scroll instead of letter-wrapping. */
  td.target { color: var(--dim); }
  /* Label cells wrap: one long member-tagged step name must not claim
     column width the (longer, clamped) payload needs more. */
  td.label { max-width: 15rem; white-space: normal; overflow-wrap: anywhere; }
  /* Deliberate absence (a value the journal never carries) renders as a
     dim mark, not an empty cell that reads as broken data. */
  td .absent { color: var(--dim); opacity: .55; }
  .cause { color: var(--dim); font-size: .85em; }
  tr.seat { cursor: pointer; }
  tr.seat:hover td { background: rgba(124,92,255,.08); }
  .live { color: var(--phosphor); margin: .3rem 0; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: .6rem;
        border-radius: 8px; overflow-x: auto; }
  /* The forge-in-progress pulse: rail nodes strike in sequence while any
     run is live; still otherwise. */
  #mark circle { transform-box: fill-box; transform-origin: center; }
  @keyframes forge-strike {
    0%, 100% { opacity: .55; transform: scale(1); }
    45% { opacity: 1; transform: scale(1.45); }
  }
  @keyframes forge-halo {
    0% { opacity: .6; transform: scale(1); }
    100% { opacity: 0; transform: scale(3.2); }
  }
  body.forging .rail-n { animation: forge-strike 1.8s ease-in-out infinite; }
  body.forging .rail-n2 { animation-delay: .3s; }
  body.forging .rail-t { animation: forge-strike 1.8s ease-in-out .6s infinite; }
  body.forging .rail-halo { animation: forge-halo 1.8s ease-out .6s infinite; }
  /* The loops view: outer phase rail + inner loop mini-rail. Node state
     classes are a fixed allowlist below; journal strings only ever reach
     SVG <text> via textContent. The pulse reuses the brand keyframes but
     is gated on the SELECTED run's status, not body.forging. */
  .loops { margin: .7rem 0 .3rem; overflow-x: auto; }
  .loops svg { display: block; overflow: visible; }
  .loops .rail-line { stroke: var(--line); stroke-width: 2; }
  .loops .hit { cursor: pointer; }
  .loops text { font: 10px 'JetBrains Mono', ui-monospace, monospace;
                fill: var(--dim); }
  .loops text.revisit { font-size: 9px; fill: var(--park); }
  .loops .on-visited { fill: var(--violet); }
  .loops .on-phosphor { fill: var(--phosphor); }
  .loops .on-park { fill: var(--park); }
  .loops .on-halt { fill: var(--halt); }
  .loops .in-active { fill: var(--violet); }
  .loops .sel-ring { fill: none; stroke: var(--dim); stroke-width: 1.2;
                     stroke-dasharray: 3 2; }
  /* Graph grammar: arrowed edges read as "then" (sequence); forked
     lanes leaving and rejoining the rail read as parallel members —
     the join is the dependency. */
  .loops .edge { stroke: var(--line); stroke-width: 2; marker-end: url(#arr); }
  .loops .arr-tip { fill: var(--dim); }
  .loops .lane { fill: none; }
  .loops .seg-hit { fill: transparent; }
  .loops .seg-sel { fill: rgba(124,92,255,.06); stroke: var(--dim);
                    stroke-dasharray: 4 3; pointer-events: none; }
  .loops text.phase { font-weight: 700; fill: var(--text); opacity: .75; }
  .loops text.phase-sel { fill: var(--violet); opacity: 1; }
  .loops .halo { fill: none; stroke: var(--phosphor); stroke-width: 1.4;
                 opacity: 0; }
  .loops .loop-pulse, .loops .halo-on { transform-box: fill-box;
                                        transform-origin: center; }
  .loops .loop-pulse { animation: forge-strike 1.8s ease-in-out infinite; }
  .loops .halo-on { animation: forge-halo 1.8s ease-out infinite; }
  .loops .sub { color: var(--dim); font-size: .85em; margin: .15rem 0; }
  @media (max-width: 760px) {
    #brand .tag { display: none; }
    #runs { width: clamp(180px, 34vw, 260px); }
  }
</style>
<div id="brand">
  <svg id="mark" width="24" height="24" viewBox="0 0 44 44" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="38" height="38" rx="7" stroke="#45e08c" stroke-width="2.5"/>
    <path d="M10 28h9l-3 6h12l-3-6h9v-5H12l-2-6h24" stroke="#45e08c" stroke-width="2.5" stroke-linejoin="round"/>
    <circle class="rail-n" cx="15" cy="11" r="2.2" fill="#7c5cff"/>
    <circle class="rail-n rail-n2" cx="22" cy="11" r="2.2" fill="#7c5cff"/>
    <circle class="rail-t" cx="30" cy="11" r="3" fill="#45e08c"/>
    <circle class="rail-halo" cx="30" cy="11" r="3" fill="none" stroke="#45e08c" stroke-width="1.4" opacity="0"/>
  </svg>
  <span class="word"><span class="the">the_</span>FORGE</span>
  <span class="tag">&gt; the machine is the outer loop_</span>
</div>
<div id="cols">
<div id="runs"><h1>runs</h1><div id="runlist">loading…</div></div>
<div id="detail"><h1>select a run</h1>
  <p>Read-only surface: this page submits no commands and writes nothing
  (decision 0003, constitutional boundary 6).</p></div>
</div>
<script>
// SECURITY DISCIPLINE: journal content is seat/driver-authored and
// untrusted. Nothing journal-derived ever reaches innerHTML — all
// dynamic content is set through textContent (el(); badge classes come
// from a fixed allowlist, never from data).
let active = null, source = null, activeParticipant = null, selectedPhase = null;

// Favicon pair: phosphor seal at rest, violet seal while forging — the
// tab itself signals a live run (the 16px answer to the pulse).
const FAVICON_IDLE = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%2345e08c'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E";
const FAVICON_FORGING = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%237c5cff'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E";

function setForging(forging) {
  document.body.classList.toggle('forging', forging);
  document.getElementById('favicon').href = forging ? FAVICON_FORGING : FAVICON_IDLE;
}

const KNOWN_STATUS = ['completed', 'stopped', 'awaiting_operator', 'running'];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

// SVG children need the SVG namespace — el()'s createElement would
// produce inert HTML elements. Same textContent discipline as el().
function svgEl(tag, className, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (className) node.setAttribute('class', className);
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function badge(text, status) {
  const cls = KNOWN_STATUS.includes(status) ? ' ' + status : '';
  return el('span', 'badge' + cls, text);
}

// A wide table scrolls inside its own container instead of clipping
// invisibly against the viewport edge.
function tableWrap(table) {
  const wrap = el('div', 'tbl');
  wrap.appendChild(table);
  return wrap;
}

// Targets are file paths (record-time ruling); the tail is the
// informative end, so long ones display tail-first with the full
// recorded value in the tooltip.
function shortTarget(target) {
  if (target.length <= 44) return target;
  const parts = target.split('/');
  let tail = parts.pop();
  while (parts.length > 1 &&
         tail.length + parts[parts.length - 1].length + 1 <= 40) {
    tail = parts.pop() + '/' + tail;
  }
  return '…/' + tail;
}

function targetSpan(target) {
  const short = shortTarget(target);
  const span = el('span', null, short);
  if (short !== target) span.title = target;
  return span;
}

// Deliberate absence (a value the journal never carries) renders as a
// dim mark with the reason on hover, not an empty cell.
function absentMark(why) {
  const mark = el('span', 'absent', '—');
  if (why) mark.title = why;
  return mark;
}

function cell(value, cls, why) {
  const td = el('td', cls);
  if (value === undefined || value === null || value === '') {
    td.appendChild(absentMark(why));
  } else {
    td.textContent = String(value);
  }
  return td;
}

// Payload cells clamp to two lines by default; click toggles the full
// text. The text stays in the DOM either way (find-in-page works);
// short payloads get no affordance.
function payloadCell(text) {
  const td = el('td', 'payload');
  td.appendChild(el('div', 'body', text));
  if (text.length > 160) {
    td.className = 'payload clip';
    const more = el('div', 'more', '⌄ expand');
    td.appendChild(more);
    td.onclick = () => {
      const open = td.classList.toggle('open');
      more.textContent = open ? '⌃ collapse' : '⌄ expand';
    };
  }
  return td;
}

// The last ruling rendered natively instead of a JSON block: a
// severity-colored rule badge (fixed class table — journal data never
// names a class), the phase transition, the result. The inputs that
// fed the ruling live in the badge tooltip; a problem renders as a
// halt line only when one exists.
const RULING_SEVERITY_CLASS = { normal: '', flagged: 'awaiting_operator', hard: 'stopped' };
function decisionStrip(d) {
  const wrap = el('div');
  if (!d || typeof d !== 'object' || d.rule_id === undefined) return wrap;
  const line = el('p', 'ruling');
  const cls = Object.hasOwn(RULING_SEVERITY_CLASS, d.severity)
    ? RULING_SEVERITY_CLASS[d.severity] : '';
  const rule = badge(d.rule_id ?? '?', cls);
  const inputs = d.inputs && typeof d.inputs === 'object' ? Object.entries(d.inputs) : [];
  if (inputs.length) {
    rule.title = 'inputs\n' +
      inputs.map(([k, v]) => k + ': ' + JSON.stringify(v)).join('\n');
  }
  line.appendChild(rule);
  line.appendChild(el('span', 'arrow',
    ' ' + (d.from ?? '?') + ' → ' + (d.next ?? '?') + ' '));
  if (d.result) line.appendChild(badge(d.result));
  wrap.appendChild(line);
  if (d.problem) wrap.appendChild(el('p', 'problem', String(d.problem)));
  return wrap;
}

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  setForging(runs.some((run) => run.status === 'running'));
  const list = document.getElementById('runlist');
  list.replaceChildren();
  for (const run of runs.reverse()) {
    const item = el('div', 'run' + (run.run_id === active ? ' active' : ''));
    item.appendChild(el('div', 'id', run.run_id));
    item.appendChild(badge(run.status ?? '?', run.status));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge(run.phase ?? '-'));
    item.appendChild(document.createTextNode(' '));
    item.appendChild(badge('seq ' + (run.seq ?? 0)));
    item.onclick = () => select(run.run_id);
    list.appendChild(item);
  }
}

function row(cells) {
  const tr = el('tr');
  for (const cell of cells) tr.appendChild(cell);
  return tr;
}

// Seats console: the participant model derives client-side from the
// events stream. One participant per seat occurrence (effect/requested);
// checkpoints carrying a member field split that effect into
// 'seat:member' participants (panel members); member-less checkpoints
// belong to the seat itself.
const TERMINAL_STATUS = {
  'effect/succeeded': 'succeeded',
  'effect/failed': 'failed',
  'effect/indeterminate': 'indeterminate',
};
// Derived status -> badge class, a fixed table: journal data never
// becomes a class name.
const STATUS_CLASS = {
  working: 'running',
  succeeded: 'completed',
  failed: 'stopped',
  indeterminate: 'awaiting_operator',
};

function buildParticipants(events) {
  const effects = new Map();      // effect_id -> per-effect facts
  const participants = new Map(); // key -> participant, in first-seen order
  const ensure = (effect, member) => {
    const key = member ? effect.effect_id + ':' + member : effect.effect_id;
    if (!participants.has(key)) {
      participants.set(key, {
        key, effect, member,
        label: member ? effect.seat + ':' + member : effect.seat,
        turns: null, lastTurn: null, session: null,
        memberOutcome: null, memberFinishedAt: null, checkpoints: [],
      });
    }
    return participants.get(key);
  };
  for (const e of events) {
    const p = e.payload || {};
    if (e.type === 'effect/requested' && p.effect_id) {
      const effect = { effect_id: p.effect_id, seat: p.seat ?? '?',
                       phase: typeof p.phase === 'string' ? p.phase : null,
                       attempts: 0, open: null, terminal: null, terminalEvent: null };
      effects.set(p.effect_id, effect);
      ensure(effect, null);
      continue;
    }
    const effect = effects.get(p.effect_id);
    if (!effect) continue;
    if (e.type === 'effect/started') {
      effect.attempts += 1;
      effect.open = p.attempt_id;
    } else if (Object.hasOwn(TERMINAL_STATUS, e.type) && p.attempt_id === effect.open) {
      effect.open = null;
      effect.terminal = TERMINAL_STATUS[e.type];
      effect.terminalEvent = e;
    } else if (e.type === 'effect/checkpointed') {
      const cp = p.checkpoint || {};
      const member = typeof cp.member === 'string' ? cp.member : null;
      const part = ensure(effect, member);
      part.checkpoints.push({ cp, seq: e.seq, recorded_at: e.recorded_at });
      if (cp.step === 'seat-turn') {
        if (typeof cp.turn === 'number') {
          part.turns = part.turns === null ? cp.turn : Math.max(part.turns, cp.turn);
        }
        part.lastTurn = cp;
      } else if (typeof cp.step === 'string' && cp.step.endsWith('-session-finished')) {
        part.session = cp;
      } else if (cp.step === 'panel-member-finished' && member) {
        part.memberOutcome = cp.outcome;
        part.memberFinishedAt = e.recorded_at;
      }
    }
  }
  for (const part of participants.values()) {
    // Working while the latest attempt has no terminal event; members
    // rule on their own panel-member-finished outcome, falling back to
    // the effect's terminal status so a concluded run never shows a
    // member stuck on "working".
    const effectStatus = part.effect.open ? 'working' : (part.effect.terminal ?? 'working');
    part.status = (part.member && Object.hasOwn(STATUS_CLASS, part.memberOutcome))
      ? part.memberOutcome : effectStatus;
    part.attempts = part.effect.attempts;
  }
  return participants;
}

// The loops view — ONE graph: the phase rail with each phase's inner
// topology inlined. A phase whose newest effect shows structure
// (sequence steps, panel members) renders as a capsule of inner nodes
// on the rail; a plain phase stays a single node. Observed events only
// — declared-but-unstarted topology is never invented. State -> class
// is a fixed table; journal strings only reach SVG <text> via
// textContent.
const INNER_STATE_CLASS = { finished: 'on-phosphor', active: 'in-active',
                            failed: 'on-halt', indeterminate: 'on-park' };
function renderLoops(detail, events, summary, participants, id, data) {
  const phases = new Map(); // name -> visit count, in first-visit order
  for (const e of events) {
    if (e.type !== 'phase/entered') continue;
    const name = (e.payload || {}).phase;
    if (typeof name !== 'string') continue;
    phases.set(name, (phases.get(name) ?? 0) + 1);
  }
  if (phases.size === 0) return;
  // Outer selection survives SSE re-renders like activeParticipant does,
  // and clears itself if the phase vanishes on refetch.
  if (selectedPhase && !phases.has(selectedPhase)) selectedPhase = null;
  const names = [...phases.keys()];
  const current = typeof summary.phase === 'string' && phases.has(summary.phase)
    ? summary.phase : names[names.length - 1];
  const status = KNOWN_STATUS.includes(summary.status) ? summary.status : null;
  const pulsing = status === 'running';

  // Geometry: ONE center rail. Sequential work sits on the rail joined
  // by arrowed edges ("then"); a panel forks into symmetric lanes that
  // rejoin the rail (parallel members; the join is the dependency).
  // All step labels share one baseline, phase names another.
  const LANE = 26, TOP = 14, COL_GAP = 30, PHASE_GAP = 44;
  const mono = (s) => String(s).length * 6.3;
  const segsRaw = names.map((name) => ({
    name, columns: innerColumns(events, participants, name),
  }));
  const maxHalf = LANE * Math.max(0, ...segsRaw.map((s) => s.columns
    ? Math.max(...s.columns.map((c) => (c.nodes.length - 1) / 2)) : 0));
  const Y = TOP + Math.ceil(maxHalf) + 8;
  const stepLabelY = Y + maxHalf + 22;
  const nameY = stepLabelY + 18;

  let cursor = 12;
  const segs = segsRaw.map(({ name, columns }) => {
    const seg = { name, cols: [], x0: cursor };
    const plain = !columns ||
      (columns.length === 1 && columns[0].nodes.length === 1);
    if (plain) {
      const w = Math.max(28, mono(name) + 6);
      seg.plain = true;
      seg.cx = cursor + w / 2;
      seg.entry = seg.cx - 9;
      seg.exit = seg.cx + 9;
      cursor += w;
    } else {
      columns.forEach((col, i) => {
        if (i > 0) cursor += COL_GAP;
        const n = col.nodes.length;
        if (n === 1) {
          const w = Math.max(30, mono(col.nodes[0].label) + 6,
                             col.label ? mono(col.label) + 6 : 0);
          seg.cols.push({ col, fork: false, x: cursor + w / 2,
                          entry: cursor + w / 2 - 8, exit: cursor + w / 2 + 8 });
          cursor += w;
        } else {
          const labelW = Math.max(...col.nodes.map((nd) => mono(nd.label)));
          const w = 26 + 10 + labelW + 16 + 14;
          seg.cols.push({ col, fork: true, x0: cursor, x1: cursor + w,
                          nodeX: cursor + 26, entry: cursor, exit: cursor + w });
          cursor += w;
        }
      });
      seg.entry = seg.cols[0].entry;
      seg.exit = seg.cols[seg.cols.length - 1].exit;
      seg.cx = (seg.x0 + cursor) / 2;
    }
    seg.x1 = cursor;
    cursor += PHASE_GAP;
    return seg;
  });

  const wrap = el('div', 'loops');
  const svg = svgEl('svg');
  svg.setAttribute('width', cursor - PHASE_GAP + 12);
  svg.setAttribute('height', nameY + 24);
  const defs = svgEl('defs');
  const marker = svgEl('marker');
  marker.setAttribute('id', 'arr');
  marker.setAttribute('viewBox', '0 0 8 8');
  marker.setAttribute('refX', 7);
  marker.setAttribute('refY', 4);
  // userSpaceOnUse: a fixed 7px head instead of scaling with the 2px
  // stroke (which rendered clunky 13px triangles).
  marker.setAttribute('markerUnits', 'userSpaceOnUse');
  marker.setAttribute('markerWidth', 7);
  marker.setAttribute('markerHeight', 7);
  marker.setAttribute('orient', 'auto');
  const tipPath = svgEl('path', 'arr-tip');
  tipPath.setAttribute('d', 'M0 0 L8 4 L0 8 Z');
  marker.appendChild(tipPath);
  defs.appendChild(marker);
  svg.appendChild(defs);
  const edge = (xa, xb) => {
    const l = svgEl('line', 'edge');
    l.setAttribute('x1', xa);
    l.setAttribute('y1', Y);
    l.setAttribute('x2', xb);
    l.setAttribute('y2', Y);
    svg.appendChild(l);
  };

  // Native tooltip: phase, visit count, and — on the current phase —
  // the last ruling, so the graph explains itself on hover.
  const phaseTip = (seg, isCurrent) => {
    const visits = phases.get(seg.name);
    const tip = [seg.name + (visits > 1 ? ' · visited x' + visits : '')];
    if (isCurrent && summary.last_decision && summary.last_decision.rule_id) {
      tip.push('last ruling: ' + summary.last_decision.rule_id +
               ' → ' + (summary.last_decision.next ?? '?'));
    }
    return tip.join('\n');
  };
  // Click selects (and scopes the consoles below to) the phase;
  // clicking the selected phase again clears the selection.
  const togglePhase = (name) => () => {
    selectedPhase = selectedPhase === name ? null : name;
    renderDetail(id, data);
  };

  segs.forEach((seg, i) => {
    const isCurrent = seg.name === current;
    if (i > 0) edge(segs[i - 1].exit, seg.entry);

    // Background hit zone: click anywhere in the phase to scope. Drawn
    // first so nodes stay on top for their own clicks.
    const hitG = svgEl('g', 'hit');
    hitG.appendChild(svgEl('title', null, phaseTip(seg, isCurrent)));
    const hit = svgEl('rect', 'seg-hit');
    hit.setAttribute('x', seg.x0 - 10);
    hit.setAttribute('y', TOP - 8);
    hit.setAttribute('width', seg.x1 - seg.x0 + 20);
    hit.setAttribute('height', nameY - TOP + 24);
    hitG.appendChild(hit);
    hitG.onclick = togglePhase(seg.name);
    svg.appendChild(hitG);

    if (seg.plain) {
      const cls = !isCurrent ? 'on-visited'
        : status === 'stopped' ? 'on-halt'
        : status === 'awaiting_operator' ? 'on-park'
        : 'on-phosphor';
      if (isCurrent && pulsing) {
        const halo = svgEl('circle', 'halo halo-on');
        halo.setAttribute('cx', seg.cx);
        halo.setAttribute('cy', Y);
        halo.setAttribute('r', 7);
        svg.appendChild(halo);
      }
      const node = svgEl('circle', cls + (isCurrent && pulsing ? ' loop-pulse' : ''));
      node.setAttribute('cx', seg.cx);
      node.setAttribute('cy', Y);
      node.setAttribute('r', isCurrent ? 7 : 5.5);
      svg.appendChild(node);
    } else {
      seg.cols.forEach((c, j) => {
        if (j > 0) edge(seg.cols[j - 1].exit, c.entry);
        const drawNode = (n, x, y) => {
          const g = svgEl('g', 'hit');
          const live = n.state === 'active' && pulsing;
          if (live) {
            const halo = svgEl('circle', 'halo halo-on');
            halo.setAttribute('cx', x);
            halo.setAttribute('cy', y);
            halo.setAttribute('r', 5);
            g.appendChild(halo);
          }
          const cn = svgEl('circle',
            INNER_STATE_CLASS[n.state] + (live ? ' loop-pulse' : ''));
          cn.setAttribute('cx', x);
          cn.setAttribute('cy', y);
          cn.setAttribute('r', 5);
          g.appendChild(cn);
          if (participants.has(n.key)) {
            g.appendChild(svgEl('title', null, n.label + ' — open participant'));
            g.onclick = () => { activeParticipant = n.key; renderDetail(id, data); };
          }
          svg.appendChild(g);
          return g;
        };
        if (!c.fork) {
          const g = drawNode(c.col.nodes[0], c.x, Y);
          const t = svgEl('text', null, c.col.label ?? c.col.nodes[0].label);
          t.setAttribute('x', c.x);
          t.setAttribute('y', stepLabelY);
          t.setAttribute('text-anchor', 'middle');
          g.appendChild(t);
        } else {
          const n = c.col.nodes.length;
          c.col.nodes.forEach((nd, k) => {
            const ly = Y + (k - (n - 1) / 2) * LANE;
            const laneP = svgEl('path', 'rail-line lane');
            laneP.setAttribute('d', 'M' + c.x0 + ' ' + Y +
              ' L' + (c.x0 + 14) + ' ' + ly +
              ' L' + (c.x1 - 14) + ' ' + ly +
              ' L' + c.x1 + ' ' + Y);
            svg.appendChild(laneP);
            const g = drawNode(nd, c.nodeX, ly);
            const t = svgEl('text', null, nd.label);
            t.setAttribute('x', c.nodeX + 10);
            t.setAttribute('y', ly + 3.5);
            g.appendChild(t);
          });
          if (c.col.label) {
            const t = svgEl('text', null, c.col.label);
            t.setAttribute('x', (c.x0 + c.x1) / 2);
            t.setAttribute('y', stepLabelY);
            t.setAttribute('text-anchor', 'middle');
            svg.appendChild(t);
          }
        }
      });
    }

    // Selected phase: dashed outline + tint over the whole segment.
    if (seg.name === selectedPhase) {
      const sel = svgEl('rect', 'seg-sel');
      sel.setAttribute('x', seg.x0 - 10);
      sel.setAttribute('y', TOP - 8);
      sel.setAttribute('width', seg.x1 - seg.x0 + 20);
      sel.setAttribute('height', nameY - TOP + 24);
      sel.setAttribute('rx', 10);
      svg.appendChild(sel);
    }

    // Phase name on its own shared baseline; current phase takes the
    // run-status color, selected takes violet.
    const stateCls = !isCurrent ? ''
      : status === 'stopped' ? ' on-halt'
      : status === 'awaiting_operator' ? ' on-park'
      : ' on-phosphor';
    const nameG = svgEl('g', 'hit');
    nameG.appendChild(svgEl('title', null, phaseTip(seg, isCurrent)));
    const label = svgEl('text', 'phase' + stateCls +
      (seg.name === selectedPhase ? ' phase-sel' : ''), seg.name);
    label.setAttribute('x', seg.cx);
    label.setAttribute('y', nameY);
    label.setAttribute('text-anchor', 'middle');
    nameG.appendChild(label);
    const visits = phases.get(seg.name);
    if (visits > 1) {
      const rev = svgEl('text', 'revisit', 'x' + visits);
      rev.setAttribute('x', seg.cx);
      rev.setAttribute('y', nameY + 12);
      rev.setAttribute('text-anchor', 'middle');
      nameG.appendChild(rev);
    }
    nameG.onclick = togglePhase(seg.name);
    svg.appendChild(nameG);
  });
  wrap.appendChild(svg);
  wrap.appendChild(el('div', 'sub',
    '→ sequential · forked lanes run in parallel and rejoin before the next step · click a phase to scope the tables'));
  detail.appendChild(wrap);
}

// Inner topology for one phase, derived from its NEWEST effect.
// Sequence steps run serially: order comes from sequence-step-finished
// checkpoints (the FINAL step emits none — it concludes in the effect's
// own terminal event, exactly as the seats console rules). Member tags
// '<step>' are single steps; '<step>:<member>' stacks panel members at
// that step's position. Without any observed step order, member-tagged
// participants stack as one parallel panel; otherwise the seat is a
// single node. Returns null when the phase has no observed effect.
function innerColumns(events, participants, phase) {
  let effectId = null;
  for (const e of events) {
    const p = e.payload || {};
    if (e.type === 'effect/requested' && p.effect_id && p.phase === phase) {
      effectId = p.effect_id;
    }
  }
  if (!effectId) return null;
  const finished = []; // step order established by sequence-step-finished
  const tags = [];     // member tags in first-observed order
  for (const e of events) {
    if (e.type !== 'effect/checkpointed') continue;
    const p = e.payload || {};
    if (p.effect_id !== effectId) continue;
    const cp = p.checkpoint || {};
    if (cp.step === 'sequence-step-finished') {
      if (typeof cp.step_name === 'string' && !finished.includes(cp.step_name)) {
        finished.push(cp.step_name);
      }
    } else if (typeof cp.member === 'string' && !tags.includes(cp.member)) {
      tags.push(cp.member);
    }
  }
  // A participant's own panel-member-finished outcome rules first; a
  // finished step is phosphor even though its participant inherits the
  // effect's terminal status; otherwise the effect terminal decides,
  // else the node is active (checkpoints arriving, no terminal yet).
  const OUTCOME_STATE = { succeeded: 'finished', failed: 'failed',
                          indeterminate: 'indeterminate' };
  const state = (part, stepDone) => {
    if (part && Object.hasOwn(OUTCOME_STATE, part.memberOutcome)) {
      return OUTCOME_STATE[part.memberOutcome];
    }
    if (stepDone) return 'finished';
    if (part && Object.hasOwn(OUTCOME_STATE, part.status)) {
      return OUTCOME_STATE[part.status];
    }
    return 'active';
  };
  const node = (label, tag, stepDone) => {
    const key = tag === null ? effectId : effectId + ':' + tag;
    return { label, key, state: state(participants.get(key), stepDone) };
  };
  const columns = [];
  if (finished.length > 0) {
    const steps = [...finished];
    const stepTags = new Map(); // step -> panel member tags at that step
    for (const tag of tags) {
      const cut = tag.indexOf(':');
      const step = cut === -1 ? tag : tag.slice(0, cut);
      if (!steps.includes(step)) steps.push(step);
      if (cut !== -1) {
        if (!stepTags.has(step)) stepTags.set(step, []);
        stepTags.get(step).push(tag);
      }
    }
    for (const step of steps) {
      const members = stepTags.get(step);
      const done = finished.includes(step);
      columns.push(members
        ? { label: step,
            nodes: members.map((t) => node(t.slice(step.length + 1), t, done)) }
        : { label: null, nodes: [node(step, step, done)] });
    }
  } else if (tags.length > 0) {
    columns.push({ label: null, nodes: tags.map((t) => node(t, t, false)) });
  } else {
    const seat = participants.get(effectId);
    columns.push({ label: null,
                   nodes: [node(seat ? seat.label : phase, null, false)] });
  }

  return columns;
}

async function loadDetail(id) {
  const data = await (await fetch('/api/run/' + encodeURIComponent(id))).json();
  renderDetail(id, data);
}

function renderDetail(id, data) {
  const s = data.summary ?? {};
  // Null-prototype: event ids are journal-authored, so a crafted
  // '__proto__' id must not resolve to Object.prototype on lookup.
  const byId = Object.create(null);
  for (const e of data.events ?? []) byId[e.event_id] = e.seq;

  const detail = document.getElementById('detail');
  detail.replaceChildren();
  detail.appendChild(el('h1', null, s.run_id ?? id));
  const line = el('p');
  line.appendChild(badge(s.status ?? '?', s.status));
  line.appendChild(document.createTextNode(' '));
  line.appendChild(badge('phase ' + (s.phase ?? '-')));
  detail.appendChild(line);

  // The loops view (outer phase rail + inner mini-rail) and everything
  // below share one participant derivation per render.
  const events = data.events ?? [];
  const participants = buildParticipants(events);
  if (activeParticipant && !participants.has(activeParticipant)) activeParticipant = null;
  renderLoops(detail, events, s, participants, id, data);

  if (s.park_reason) detail.appendChild(el('pre', null, s.park_reason));
  detail.appendChild(decisionStrip(s.last_decision));

  // An explicitly selected phase scopes the consoles below: seats to
  // effects requested in that phase, events to that phase's traffic.
  // Clicking the selected node again (or the × here) clears the scope.
  const phaseFilter = selectedPhase;
  if (phaseFilter) {
    const chip = el('p', 'ruling');
    chip.appendChild(badge('phase · ' + phaseFilter));
    chip.appendChild(document.createTextNode(' '));
    const clear = el('a', null, '× show all phases');
    clear.href = '#';
    clear.onclick = (ev) => {
      ev.preventDefault();
      selectedPhase = null;
      renderDetail(id, data);
    };
    chip.appendChild(clear);
    detail.appendChild(chip);
  }

  // Live seat telemetry: while an attempt is open (an effect/started
  // with no later terminal effect event), show one activity line PER
  // live participant. Checkpoints without a member field belong to the
  // single seat; member-tagged ones (panel members) get 'seat:member'.
  // Disappears when the attempt concludes; SSE re-renders keep it
  // current.
  const TERMINAL = ['effect/succeeded', 'effect/failed', 'effect/indeterminate'];
  let open = null;
  for (const e of events) {
    const p = e.payload || {};
    if (e.type === 'effect/started') {
      open = { effect_id: p.effect_id, attempt_id: p.attempt_id };
    } else if (open && TERMINAL.includes(e.type) &&
               p.effect_id === open.effect_id && p.attempt_id === open.attempt_id) {
      open = null;
    }
  }
  if (open) {
    let seat = '?';
    const participants = new Map(); // label -> newest seat-turn checkpoint (or null)
    for (const e of events) {
      const p = e.payload || {};
      if (e.type === 'effect/requested' && p.effect_id === open.effect_id && p.seat) {
        seat = p.seat;
      }
      if (e.type === 'effect/checkpointed' && p.effect_id === open.effect_id &&
          p.attempt_id === open.attempt_id) {
        const cp = p.checkpoint || {};
        const label = cp.member ? seat + ':' + cp.member : seat;
        if (cp.step === 'seat-turn') {
          participants.set(label, cp);
        } else if (!participants.get(label)) {
          participants.set(label, null);
        }
      }
    }
    if (participants.size === 0) participants.set(seat, null);
    for (const [label, turnCp] of participants) {
      detail.appendChild(el('p', 'live', turnCp
        ? label + ' · turn ' + turnCp.turn + ' · ' + turnCp.tool
        : label + ' · working'));
    }
  }

  // Seats console: per-participant table above the events table. Rows
  // drill down into that participant's progress; the selected key lives
  // in activeParticipant so the drill-down survives SSE re-renders, and
  // clears itself if the participant vanishes after a refetch (ruled
  // above, where participants are derived).
  const shownParts = [...participants.values()]
    .filter((part) => !phaseFilter || part.effect.phase === phaseFilter);
  if (shownParts.length > 0) {
    const seats = el('table');
    seats.appendChild(row([
      el('th', null, 'participant'), el('th', null, 'status'),
      el('th', null, 'attempts'), el('th', null, 'turns'),
      el('th', null, 'cost'), el('th', null, 'last activity'),
    ]));
    for (const part of shownParts) {
      let cost = part.session ? part.session.total_cost_usd : undefined;
      let turns = part.turns;
      // A panel/sequence seat carries no telemetry of its own — its
      // members do. The parent row aggregates them (Σ) so it never
      // reads as an empty participant.
      const members = part.member ? []
        : [...participants.values()].filter((q) => q.effect === part.effect && q.member);
      let costAgg = false, turnsAgg = false;
      if (members.length > 0) {
        const costs = members.map((q) => q.session ? q.session.total_cost_usd : undefined)
          .filter((v) => typeof v === 'number');
        const turnSums = members.map((q) => q.turns).filter((v) => typeof v === 'number');
        if (typeof cost !== 'number' && costs.length > 0) {
          cost = costs.reduce((a, b) => a + b, 0);
          costAgg = true;
        }
        if (typeof turns !== 'number' && turnSums.length > 0) {
          turns = turnSums.reduce((a, b) => a + b, 0);
          turnsAgg = true;
        }
      }
      const statusCell = el('td');
      statusCell.appendChild(badge(part.status, STATUS_CLASS[part.status]));
      const activity = el('td', 'target');
      if (part.lastTurn) {
        activity.appendChild(document.createTextNode(part.lastTurn.tool));
        if (part.lastTurn.target) {
          activity.appendChild(document.createTextNode(' · '));
          activity.appendChild(targetSpan(part.lastTurn.target));
        }
      } else if (members.length > 0) {
        activity.appendChild(el('span', 'absent', members.length + ' members ↓'));
      } else {
        activity.appendChild(absentMark('no seat-turn telemetry recorded'));
      }
      const tr = row([
        el('td', null, part.label),
        statusCell,
        el('td', null, part.attempts),
        cell(typeof turns === 'number' ? (turnsAgg ? 'Σ ' : '') + turns : null,
             null, 'no turn telemetry recorded'),
        cell(typeof cost === 'number' ? (costAgg ? 'Σ ' : '') + '$' + cost.toFixed(4) : null,
             null, 'no session cost recorded'),
        activity,
      ]);
      tr.className = 'seat';
      tr.onclick = () => { activeParticipant = part.key; renderDetail(id, data); };
      seats.appendChild(tr);
    }
    detail.appendChild(tableWrap(seats));
  }

  if (activeParticipant) {
    const part = participants.get(activeParticipant);
    const back = el('p');
    const link = el('a', null, '← all events');
    link.href = '#';
    link.onclick = (ev) => {
      ev.preventDefault();
      activeParticipant = null;
      renderDetail(id, data);
    };
    back.appendChild(link);
    detail.appendChild(back);
    const header = el('p');
    header.appendChild(document.createTextNode(part.label + ' '));
    header.appendChild(badge(part.status, STATUS_CLASS[part.status]));
    if (part.session && part.session.session_id !== undefined) {
      header.appendChild(document.createTextNode(' · session ' + part.session.session_id));
    }
    detail.appendChild(header);
    const stream = el('table');
    stream.appendChild(row([
      el('th', null, 'turn'), el('th', null, 'tool'),
      el('th', null, 'target'), el('th', null, 'recorded'),
    ]));
    for (const item of part.checkpoints) {
      const cp = item.cp;
      const target = el('td', 'target');
      if (cp.target) {
        target.appendChild(targetSpan(cp.target));
      } else {
        target.appendChild(absentMark(
          'no target recorded — the journal carries file targets only'));
      }
      stream.appendChild(row([
        cell(cp.turn, null, 'not a numbered turn'),
        el('td', null, cp.step === 'seat-turn' ? cp.tool : cp.step),
        target,
        el('td', null, item.recorded_at),
      ]));
    }
    detail.appendChild(tableWrap(stream));
    // Terminal line: members conclude on their panel-member-finished
    // outcome; the seat itself on the effect's terminal event.
    let terminal = null;
    if (part.member && part.memberOutcome !== null) {
      terminal = 'panel-member-finished · ' + part.memberOutcome +
                 (part.memberFinishedAt ? ' · ' + part.memberFinishedAt : '');
    } else if (part.effect.terminalEvent) {
      terminal = part.effect.terminalEvent.type + ' · ' +
                 part.effect.terminalEvent.recorded_at;
    }
    detail.appendChild(el('p', terminal ? null : 'cause',
                          terminal ?? 'no terminal event yet'));
    return;
  }

  const table = el('table');
  table.appendChild(row([
    el('th', null, 'seq ←cause'), el('th', null, 'type'), el('th', null, 'label'),
    el('th', null, 'payload'), el('th', null, 'recorded'),
  ]));
  // Phase scope for the events grid: an event belongs to the selected
  // phase if it names it (phase/entered, effect/requested), left it
  // (a decision's `from`), or rides an effect requested in it.
  const phaseEffects = new Set();
  if (phaseFilter) {
    for (const e of events) {
      const p = e.payload || {};
      if (e.type === 'effect/requested' && p.phase === phaseFilter && p.effect_id) {
        phaseEffects.add(p.effect_id);
      }
    }
  }
  for (const e of data.events ?? []) {
    const p = e.payload || {};
    if (phaseFilter && p.phase !== phaseFilter && p.from !== phaseFilter &&
        !(p.effect_id && phaseEffects.has(p.effect_id))) {
      continue;
    }
    // First STRING wins — effect results are objects (their inner
    // .result token is the label), and nothing non-string may reach the
    // cell, or it renders as '[object Object]'.
    const resultToken = (p.result && typeof p.result === 'object')
      ? p.result.result : p.result;
    let label = [p.rule_id, p.phase, resultToken, p.command, p.reason]
      .find((v) => typeof v === 'string' && v !== '') ?? '';
    // Checkpoint events label with their step (tool for seat turns) so
    // the column is never blank for the densest event type.
    if (e.type === 'effect/checkpointed') {
      const cp = p.checkpoint || {};
      label = cp.step === 'seat-turn' ? (cp.tool ?? 'seat-turn') : (cp.step ?? '');
      if (typeof cp.member === 'string') label = cp.member + ' · ' + label;
    }
    const seqCell = el('td', null, e.seq);
    if (e.causation_id && byId[e.causation_id]) {
      seqCell.appendChild(document.createTextNode(' '));
      seqCell.appendChild(el('span', 'cause', '← ' + byId[e.causation_id]));
    }
    table.appendChild(row([
      seqCell,
      el('td', null, e.type),
      cell(label, 'label'),
      payloadCell(JSON.stringify(p)),
      el('td', null, e.recorded_at),
    ]));
  }
  detail.appendChild(tableWrap(table));
}

function select(id) {
  active = id;
  activeParticipant = null; // drill-down selection is per-run
  selectedPhase = null;     // outer-rail selection is per-run too
  loadRuns();
  loadDetail(id);
  if (source) source.close();
  source = new EventSource('/sse/' + encodeURIComponent(id));
  source.onmessage = () => { loadDetail(id); loadRuns(); };
}

loadRuns();
setInterval(loadRuns, 5000);
</script>
