[package]
name = "brokkr-runtime"
description = "Durable engine loop: bundles, effects, recovery, operator commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
brokkr-core = { workspace = true }
brokkr-store = { workspace = true }
brokkr-protocol = { workspace = true }
brokkr-view = { workspace = true }
# Decision 0065: a realm's restriction keys are judged against the schema
# its tool dialect embeds, in production. The same locked package
# brokkr-store already validates seat records with, default features off
# (no retrieval): a new edge, not a new package or version.
jsonschema = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
brokkr-store = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }
# Decision 0014's dependency ruling of 2026-09-26 (#342): report-only token
# counts for the prompt byte budgets. The bytes are gated; tokens are not.
tiktoken-rs = "=0.12.1"

# Operator ruling 2026-09-29 (main merged into decision 0065's slice): this
# crate forbids `unsafe` (decision 0071 ruling 1), so the owner-rooted
# lookups of decision 0065's bound reads use rustix's safe calls. A direct
# edge to the version brokkr-protocol and brokkr-cli already take; no
# registry version moves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
