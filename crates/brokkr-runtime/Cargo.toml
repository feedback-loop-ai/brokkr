[package]
name = "brokkr-runtime"
description = "Durable engine loop: bundles, effects, recovery, operator commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are declared below, one binary and the files that
# need a process of their own (#423).
autotests = false

[lints]
workspace = true

# The integration tests link as one binary (#423): `tests/it.rs` holds every
# file under tests/ as a module, so a test runs as `<file>::<name>`. A file
# that needs a process of its own is its own binary below, with the reason.
# Cargo builds no test it is not told of here, and brokkr-cli's
# `test_targets` refuses a file under tests/ that is neither.
[[test]]
name = "it"

# Re-executes this binary on single tests by their unprefixed names, and
# leaves launches alive in those children; decision 0065 slice two edits
# its body while this lands, so only its own binary keeps both as they are.
[[test]]
name = "capability_launch"

# Each moves the process's working directory, which every other file's
# relative paths and spawned children would stand in.
[[test]]
name = "operated_repo"

[[test]]
name = "queued_launch"

[dependencies]
brokkr-core = { workspace = true }
brokkr-store = { workspace = true }
brokkr-protocol = { workspace = true }
brokkr-view = { workspace = true }
# Decision 0065: a realm's restriction keys are judged against the schema
# its tool dialect embeds, in production. The same locked package
# brokkr-store already validates seat records with, default features off
# (no retrieval): a new edge, not a new package or version.
jsonschema = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
brokkr-store = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }
# Decision 0014's dependency ruling of 2026-09-26 (#342): report-only token
# counts for the prompt byte budgets. The bytes are gated; tokens are not.
tiktoken-rs = "=0.12.1"

# Operator ruling 2026-09-29 (main merged into decision 0065's slice): this
# crate forbids `unsafe` (decision 0071 ruling 1), so the owner-rooted
# lookups of decision 0065's bound reads use rustix's safe calls. A direct
# edge to the version brokkr-protocol and brokkr-cli already take; no
# registry version moves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
