[package]
name = "brokkr-core"
description = "Pure core: event envelope, fold, and the strict policy evaluator. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are declared below (#423).
autotests = false

[lints]
workspace = true

# The integration tests link as one binary (#423): `tests/it.rs` holds every
# file under tests/ as a module, so a test runs as `<file>::<name>`. Cargo
# builds no test it is not told of here, and brokkr-cli's `test_targets`
# refuses a file under tests/ that is not a module of the root.
[[test]]
name = "it"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
url = { workspace = true }
