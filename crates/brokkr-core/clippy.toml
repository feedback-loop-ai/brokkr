disallowed-types = [
  { path = "std::fs::File", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::OpenOptions", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::process::Command", reason = "core and view are pure: processes live in protocol and runtime" },
  { path = "std::process::Child", reason = "core and view are pure: processes live in protocol and runtime" },
  { path = "std::net::TcpStream", reason = "core and view are pure: the network lives in brokkr-bridge" },
  { path = "std::net::TcpListener", reason = "core and view are pure: the network lives in brokkr-bridge" },
  { path = "std::net::UdpSocket", reason = "core and view are pure: the network lives in brokkr-bridge" },
  { path = "std::thread::Builder", reason = "core and view are pure: threads live in runtime and cli" },
  { path = "std::time::SystemTime", reason = "core and view are pure: `now` arrives as an argument" },
  { path = "std::time::Instant", reason = "core and view are pure: `now` arrives as an argument" },
  { path = "std::collections::HashMap", reason = "core and view are pure: RandomState seeds from the OS, use BTreeMap" },
  { path = "std::collections::HashSet", reason = "core and view are pure: RandomState seeds from the OS, use BTreeSet" },
  { path = "std::hash::RandomState", reason = "core and view are pure: RandomState seeds from the OS" },
