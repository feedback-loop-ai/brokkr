# Decision 0071 ruling 1: brokkr-core and brokkr-view are pure. They do
# no I/O and read no clock, environment or randomness; a `now`, a path or
# an environment value arrives as an argument. This file and
# crates/brokkr-view/clippy.toml are the same bytes, and a crate-level
# clippy.toml replaces the root one rather than merging with it, so
# crates/brokkr-cli/tests/layering.rs holds both to each other and to the
# root's thresholds. Clippy names items, not modules, so the same test
# runs a `git grep` backstop over whole modules.

disallowed-methods = [
  { path = "std::fs::read", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::read_to_string", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::read_dir", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::write", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::copy", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::rename", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::create_dir", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::create_dir_all", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::remove_file", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::remove_dir", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::remove_dir_all", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::metadata", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::symlink_metadata", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::canonicalize", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::fs::exists", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::exists", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::is_file", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::is_dir", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::metadata", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::read_dir", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::path::Path::canonicalize", reason = "core and view are pure: I/O lives in store and runtime" },
  { path = "std::io::stdin", reason = "core and view are pure: the terminal lives in brokkr-cli" },
  { path = "std::io::stdout", reason = "core and view are pure: the terminal lives in brokkr-cli" },
  { path = "std::io::stderr", reason = "core and view are pure: the terminal lives in brokkr-cli" },
  { path = "std::process::exit", reason = "core and view are pure: processes live in protocol and runtime" },
  { path = "std::process::abort", reason = "core and view are pure: processes live in protocol and runtime" },
  { path = "std::env::var", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::var_os", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::vars", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::vars_os", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::args", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::args_os", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::current_dir", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::set_current_dir", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::current_exe", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::home_dir", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::temp_dir", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::set_var", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::env::remove_var", reason = "core and view are pure: the environment arrives as an argument" },
  { path = "std::time::SystemTime::now", reason = "core and view are pure: `now` arrives as an argument" },
  { path = "std::time::Instant::now", reason = "core and view are pure: `now` arrives as an argument" },
  { path = "time::OffsetDateTime::now_utc", reason = "core and view are pure: `now` arrives as an argument", allow-invalid = true },
  { path = "time::OffsetDateTime::now_local", reason = "core and view are pure: `now` arrives as an argument", allow-invalid = true },
  { path = "time::UtcDateTime::now", reason = "core and view are pure: `now` arrives as an argument", allow-invalid = true },
  { path = "uuid::Uuid::new_v4", reason = "core and view are pure: fresh ids are drawn in store and runtime", allow-invalid = true },
  { path = "std::thread::spawn", reason = "core and view are pure: threads live in runtime and cli" },
  { path = "std::thread::scope", reason = "core and view are pure: threads live in runtime and cli" },
  { path = "std::thread::sleep", reason = "core and view are pure: `now` arrives as an argument" },
