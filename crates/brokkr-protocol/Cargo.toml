[package]
name = "brokkr-protocol"
description = "forge-driver/v1: NDJSON stdio driver protocol, subprocess transport, fake driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
# The operator's ruling of 2026-10-04 on #484: the harness probe reads
# dsh's session log, which dsh writes zstd-compressed
# (`session.v3.jsonl.zstd`), through a pure-Rust, decode-only decoder,
# MIT, with no dependency of its own. `hash` is off: a frame's checksum
# is not verified, and a corrupt frame decodes to lines the typed reader
# does not read.
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }

# The same narrow, explicit exception decision 0055 took for the local
# transcript reader, for the same reason: a PATH lookup must decide
# executability the way the child it stands in for does, which is
# `faccessat(AT_EACCESS)` against the process's EFFECTIVE identity, and
# the standard library exposes no such call. This extends a direct edge
# to a version already in Cargo.lock; no registry version moves.
#
# #415 widens it for a hands session's scratch tree: `process` asks the
# kernel whether an owner pid is alive (kill with no signal) and
# `signal-hook` lets a server remove its tree when a termination signal
# ends it. Both are crates Cargo.lock already holds (signal-hook through
# crossterm); no registry version moves.
#
# `process` is also the attempt's process group (#403): signal the group,
# probe it, and observe the leader's exit without reaping it.
# `signal-hook` and `libc` are the engine's stop handler (#403): SIGINT,
# SIGTERM and SIGHUP end every live attempt before the engine exits, and
# `libc::sigaction` reads whether a signal was inherited as ignored. Both
# are direct edges to versions already in Cargo.lock: the lock records the
# two edges, and no registry version moves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }
signal-hook = "0.3.18"
libc = "0.2.189"
