[package]
name = "brokkr-protocol"
description = "forge-driver/v1: NDJSON stdio driver protocol, subprocess transport, fake driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

# The same narrow, explicit exception decision 0055 took for the local
# transcript reader, for the same reason: a PATH lookup must decide
# executability the way the child it stands in for does, which is
# `faccessat(AT_EACCESS)` against the process's EFFECTIVE identity, and
# the standard library exposes no such call. This extends a direct edge
# to a version already in Cargo.lock; no registry version moves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }

# Decision 0046 slice II design D3: one committed test-support executable
# provides the probe's payload, descendant, guard, supervisor and startup
# roles so the native feasibility path has no interpreter dependency. Its
# source lives beside the probe under `tests/`, which also keeps it out of
# the exact-coverage production denominator.
[[bin]]
name = "seatbelt-probe-helper"
path = "tests/seatbelt_probe/helper.rs"
test = false
bench = false
