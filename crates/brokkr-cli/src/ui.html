<!doctype html>
<meta charset="utf-8">
<title>brokkr</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%2345e08c'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --void: #12101a; --panel: #1a1726; --line: #2c2840;
    --text: #e8e6f0; --dim: #8b87a0;
    --violet: #7c5cff; --phosphor: #45e08c; --park: #f0b15a; --halt: #ff6b5e;
  }
  body { font: 14px/1.5 'JetBrains Mono', ui-monospace, monospace; margin: 0;
         display: flex; flex-direction: column; height: 100vh;
         background: var(--void); color: var(--text); }
  #brand { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  #brand .word { font-size: 15px; letter-spacing: 0.06em; font-weight: 700; }
  #brand .tag { margin-left: auto; font-size: 11px; color: var(--phosphor);
                letter-spacing: 0.08em; }
  #cols { display: flex; flex: 1; min-height: 0; }
  #runs { width: clamp(220px, 26vw, 340px); flex-shrink: 0;
          overflow-y: auto; padding: .5rem; }
  #detail { flex: 1; min-width: 0; overflow-y: auto; padding: 1rem; }
  h1 { font-size: 1rem; margin: .3rem 0 .8rem; }
  .run { padding: .45rem .5rem; border: 1px solid var(--line); border-radius: 8px;
         margin-bottom: .4rem; cursor: pointer; background: var(--panel); }
  .run:hover, .run.active { border-color: var(--violet); }
  .run .id { font-weight: 600; overflow-wrap: anywhere; }
  /* The whole runs pane collapses once a run is chosen: the pane hides
     and the divider strip stays as the reopen affordance. The chevron
     lives ON the divider between the panes — it can never overlap the
     run list. */
  #divider { flex: none; width: 14px; border-right: 1px solid var(--line);
             display: flex; align-items: center; justify-content: center;
             cursor: pointer; color: var(--dim); user-select: none; }
  #divider:hover { color: var(--text); background: rgba(124,92,255,.08); }
  #runsToggle { font-size: 11px; opacity: .7; }
  #runs.collapsed { display: none; }
  /* Collapsed run rows: one line, status dot + ellipsized id. */
  .run.row { display: flex; align-items: center; gap: 8px;
             padding: .3rem .5rem; }
  .run.row .line { overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; min-width: 0; }
  .run .dot { width: 8px; height: 8px; border-radius: 999px; flex: none;
              background: var(--dim); }
  .run .dot.completed { background: var(--phosphor); }
  .run .dot.stopped { background: var(--halt); }
  .run .dot.awaiting_operator { background: var(--park); }
  .run .dot.running { background: var(--violet); }
  .badge { display: inline-block; padding: 0 .5em; border-radius: 999px;
           border: 1px solid var(--line); font-size: .85em; color: var(--dim); }
  .completed { color: var(--phosphor); border-color: rgba(69,224,140,.45);
               background: rgba(69,224,140,.10); }
  .stopped { color: var(--halt); border-color: rgba(255,107,94,.45);
             background: rgba(255,107,94,.10); }
  .awaiting_operator { color: var(--park); border-color: rgba(240,177,90,.45);
                       background: rgba(240,177,90,.10); }
  .running { color: var(--violet); border-color: rgba(124,92,255,.45);
             background: rgba(124,92,255,.10); }
  /* Tables live in .tbl scroll containers: a wide table scrolls inside
     its own box instead of clipping invisibly on narrow screens. */
  .tbl { overflow-x: auto; margin-top: .8rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: .3rem .5rem;
           text-align: left; vertical-align: top; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; }
  td.payload { min-width: 18rem; max-width: 46rem; overflow-wrap: anywhere;
               white-space: normal; color: var(--dim); }
  /* Payloads clamp to two lines by default — a 5KB feature text must
     not become a 3500px row. Click toggles the full text; the text
     itself stays in the DOM either way, so find-in-page still works. */
  td.payload.clip { cursor: pointer; }
  td.payload.clip > .body { display: -webkit-box; -webkit-line-clamp: 2;
                            -webkit-box-orient: vertical; overflow: hidden; }
  td.payload.clip.open > .body { display: block; }
  td.payload.clip > .more { color: var(--violet); opacity: .8;
                            font-size: .85em; user-select: none; }
  /* The last ruling, natively: badge + transition, inputs in the
     tooltip. The raw payload stays reachable in the events table. */
  .ruling { margin: .2rem 0 .6rem; }
  .ruling .arrow { color: var(--dim); }
  .problem { color: var(--halt); white-space: pre-wrap; }
  /* Target cells hold short (tail-first) paths: keep them on one line
     and let the .tbl container scroll instead of letter-wrapping. */
  td.target { color: var(--dim); }
  /* Label cells wrap: one long member-tagged step name must not claim
     column width the (longer, clamped) payload needs more. */
  td.label { max-width: 15rem; white-space: normal; overflow-wrap: anywhere; }
  /* Deliberate absence (a value the journal never carries) renders as a
     dim mark, not an empty cell that reads as broken data. */
  td .absent { color: var(--dim); opacity: .55; }
  .cause { color: var(--dim); font-size: .85em; }
  /* Transcript prose: assistant turns violet-edged, seat-charter/user
     turns phosphor-edged and dim, tool calls as small markers. */
  .transcript { margin-top: .6rem; max-width: 72rem; }
  .tr-msg { white-space: pre-wrap; overflow-wrap: anywhere;
            padding: .4rem .65rem; margin: .35rem 0;
            border-left: 2px solid var(--line); }
  .tr-a { border-left-color: var(--violet); }
  .tr-u { border-left-color: var(--phosphor); color: var(--dim); }
  .tr-tool { color: var(--dim); font-size: .85em;
             margin: .12rem 0 .12rem .65rem; opacity: .85; }
  tr.seat { cursor: pointer; }
  tr.seat:hover td { background: rgba(124,92,255,.08); }
  .live { color: var(--phosphor); margin: .3rem 0; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: .6rem;
        border-radius: 8px; overflow-x: auto; }
  /* The forge-in-progress pulse: rail nodes strike in sequence while any
     run is live; still otherwise. */
  #mark circle { transform-box: fill-box; transform-origin: center; }
  @keyframes forge-strike {
    0%, 100% { opacity: .55; transform: scale(1); }
    45% { opacity: 1; transform: scale(1.45); }
  }
  @keyframes forge-halo {
    0% { opacity: .6; transform: scale(1); }
    100% { opacity: 0; transform: scale(3.2); }
  }
  body.forging .rail-n { animation: forge-strike 1.8s ease-in-out infinite; }
  body.forging .rail-n2 { animation-delay: .3s; }
  body.forging .rail-t { animation: forge-strike 1.8s ease-in-out .6s infinite; }
  body.forging .rail-halo { animation: forge-halo 1.8s ease-out .6s infinite; }
  /* The loops view: outer phase rail + inner loop mini-rail. Node state
     classes are a fixed allowlist below; journal strings only ever reach
     SVG <text> via textContent. The pulse reuses the brand keyframes but
     is gated on the SELECTED run's status, not body.forging. */
  .loops { margin: .7rem 0 .3rem; overflow-x: auto; }
  .loops svg { display: block; overflow: visible; }
  .loops .rail-line { stroke: var(--line); stroke-width: 2; }
  .loops .hit { cursor: pointer; }
  .loops text { font: 10px 'JetBrains Mono', ui-monospace, monospace;
                fill: var(--dim); }
  .loops text.revisit { font-size: 9px; fill: var(--park); }
  .loops .on-visited { fill: var(--violet); }
  .loops .on-phosphor { fill: var(--phosphor); }
  .loops .on-park { fill: var(--park); }
  .loops .on-halt { fill: var(--halt); }
  .loops .in-active { fill: var(--violet); }
  .loops .sel-ring { fill: none; stroke: var(--dim); stroke-width: 1.2;
                     stroke-dasharray: 3 2; }
  /* Graph grammar: arrowed edges read as "then" (sequence); forked
     lanes leaving and rejoining the rail read as parallel members —
     the join is the dependency. */
  .loops .edge { stroke: var(--line); stroke-width: 2; marker-end: url(#arr); }
  .loops .arr-tip { fill: var(--dim); }
  .loops .lane { fill: none; }
  /* The road back (decision 0022): SOLID, in the rail's own line
     colour, never dashed — dashes read as "not taken", and this road
     was taken. The head is the mirror of the forward arrow's and wears
     the same fill, because it means the same thing: arrival. */
  .loops .ret { fill: none; stroke: var(--line); stroke-width: 2; }
  .loops .ret-tip { fill: var(--dim); }
  .loops .seg-hit { fill: transparent; }
  .loops .seg-sel { fill: rgba(124,92,255,.06); stroke: var(--dim);
                    stroke-dasharray: 4 3; pointer-events: none; }
  .loops text.phase { font-weight: 700; fill: var(--text); opacity: .75; }
  .loops text.phase-sel { fill: var(--violet); opacity: 1; }
  .loops .halo { fill: none; stroke: var(--phosphor); stroke-width: 1.4;
                 opacity: 0; }
  .loops .loop-pulse, .loops .halo-on { transform-box: fill-box;
                                        transform-origin: center; }
  .loops .loop-pulse { animation: forge-strike 1.8s ease-in-out infinite; }
  .loops .halo-on { animation: forge-halo 1.8s ease-out infinite; }
  .loops .sub { color: var(--dim); font-size: .85em; margin: .15rem 0; }
  @media (max-width: 760px) {
    #brand .tag { display: none; }
    #runs { width: clamp(180px, 34vw, 260px); }
  }
</style>
<div id="brand">
  <svg id="mark" width="24" height="24" viewBox="0 0 44 44" fill="none" aria-hidden="true">
    <rect x="3" y="3" width="38" height="38" rx="7" stroke="#45e08c" stroke-width="2.5"/>
    <path d="M10 28h9l-3 6h12l-3-6h9v-5H12l-2-6h24" stroke="#45e08c" stroke-width="2.5" stroke-linejoin="round"/>
    <circle class="rail-n" cx="15" cy="11" r="2.2" fill="#7c5cff"/>
    <circle class="rail-n rail-n2" cx="22" cy="11" r="2.2" fill="#7c5cff"/>
    <circle class="rail-t" cx="30" cy="11" r="3" fill="#45e08c"/>
    <circle class="rail-halo" cx="30" cy="11" r="3" fill="none" stroke="#45e08c" stroke-width="1.4" opacity="0"/>
  </svg>
  <!-- Decision 0019 ruling 1: the wordmark is BROKKR. The tagline is
       the product's motto, not the old name, and survives the rename. -->
  <span class="word">BROKKR</span>
  <span class="tag">&gt; the machine is the outer loop_</span>
</div>
<div id="cols">
<div id="runs"><h1>runs</h1><div id="runlist">loading…</div></div>
<div id="divider" title="collapse the runs pane"><span id="runsToggle">«</span></div>
<div id="detail"><h1>select a run</h1>
  <p>Read-only surface: this page submits no commands and writes nothing
  (decision 0003, constitutional boundary 6).</p></div>
</div>
<script>
// SECURITY DISCIPLINE: journal content is seat/driver-authored and
// untrusted. Nothing journal-derived is ever parsed as markup — all
// dynamic content is set through textContent (el()); class names come
// from the fixed allowlists below and never from data. A model's
// *_class field is an INDEX INTO an allowlist, not a class name.
//
// DERIVATION DISCIPLINE (decision 0013): this page PAINTS. Every value
// it shows is a field of the models `brokkr ui` serves from `brokkr-view`
// — the same models `brokkr inspect` and `brokkr watch` render as text,
// so the two surfaces cannot disagree. The page may branch on a model
// field; it may NOT compute one. A formatter, a duration, a sum, a
// truncation or a scoping predicate written here is a second
// derivation; it belongs in `brokkr-view`, and a test in `ui/tests.rs`
// fails the day the old helpers come back.
let active = null, source = null, activeParticipant = null, selectedPhase = null;
let rawJournal = false; // events table mode: decision trail (default) or raw
let runsCollapsed = false; // the runs pane folds to a rail once a run is chosen

function applyRunsPane() {
  document.getElementById('runs').classList.toggle('collapsed', runsCollapsed);
  document.getElementById('runsToggle').textContent = runsCollapsed ? '»' : '«';
  document.getElementById('divider').title = runsCollapsed
    ? 'expand the runs pane' : 'collapse the runs pane';
}

// Favicon pair: phosphor seal at rest, violet seal while forging — the
// tab itself signals a live run (the 16px answer to the pulse).
const FAVICON_IDLE = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%2345e08c'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E";
const FAVICON_FORGING = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect width='150' height='150' rx='30' fill='%237c5cff'/%3E%3Cpath d='M26 96h40l-13 26h44l-13-26h26V66H38l-10-24h94v24' fill='%2312101a'/%3E%3C/svg%3E";

function setForging(forging) {
  document.body.classList.toggle('forging', forging);
  document.getElementById('favicon').href = forging ? FAVICON_FORGING : FAVICON_IDLE;
}

const KNOWN_STATUS = ['completed', 'stopped', 'awaiting_operator', 'running'];

// The two fixed class allowlists. A model carries a closed-set key; the
// page looks it up here before anything touches className.
const BADGE_CLASS = { '': '', running: 'running', completed: 'completed',
                      stopped: 'stopped', awaiting_operator: 'awaiting_operator' };
const NODE_CLASS = { 'on-phosphor': 'on-phosphor', 'in-active': 'in-active',
                     'on-halt': 'on-halt', 'on-park': 'on-park' };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

// SVG children need the SVG namespace — el()'s createElement would
// produce inert HTML elements. Same textContent discipline as el().
function svgEl(tag, className, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (className) node.setAttribute('class', className);
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function badge(text, classKey) {
  const cls = Object.hasOwn(BADGE_CLASS, classKey) ? BADGE_CLASS[classKey] : '';
  return el('span', cls ? 'badge ' + cls : 'badge', text);
}

function nodeCls(classKey) {
  return Object.hasOwn(NODE_CLASS, classKey) ? NODE_CLASS[classKey] : 'in-active';
}

// A wide table scrolls inside its own container instead of clipping
// invisibly against the viewport edge.
function tableWrap(table) {
  const wrap = el('div', 'tbl');
  wrap.appendChild(table);
  return wrap;
}

// A shortened target displays tail-first with the full recorded value in
// the tooltip. Both strings come from the model — the shortening rule
// lives in brokkr-view, where it is tested.
function targetSpan(short, full) {
  const span = el('span', null, short);
  if (full !== null) span.title = full;
  return span;
}

// Deliberate absence (a value the journal never carries) renders as a
// dim mark with the reason on hover, not an empty cell.
function absentMark(text, why) {
  const mark = el('span', 'absent', text);
  if (why) mark.title = why;
  return mark;
}

function cell(model, className) {
  const td = el('td', className);
  if (model.absent) {
    td.appendChild(absentMark(model.text, model.note));
  } else {
    td.textContent = model.text;
  }
  return td;
}

// Payload cells clamp to two lines by default; click toggles the full
// text. The text stays in the DOM either way (find-in-page works);
// short payloads get no affordance.
function payloadCell(text) {
  const td = el('td', 'payload');
  td.appendChild(el('div', 'body', text));
  if (text.length > 160) {
    td.className = 'payload clip';
    const more = el('div', 'more', '⌄ expand');
    td.appendChild(more);
    td.onclick = () => {
      const open = td.classList.toggle('open');
      more.textContent = open ? '⌃ collapse' : '⌄ expand';
    };
  }
  return td;
}

// The last ruling rendered natively instead of a JSON block: a
// severity-colored rule badge (fixed class table — journal data never
// names a class), the phase transition, the result. The inputs that
// fed the ruling live in the badge tooltip; a problem renders as a
// halt line only when one exists.
function decisionStrip(ruling) {
  const wrap = el('div');
  if (!ruling) return wrap;
  const line = el('p', 'ruling');
  const rule = badge(ruling.rule_id, ruling.severity_class);
  if (ruling.inputs.length) {
    rule.title = 'inputs\n' +
      ruling.inputs.map((pair) => pair[0] + ': ' + pair[1]).join('\n');
  }
  line.appendChild(rule);
  line.appendChild(el('span', 'arrow', ' ' + ruling.from + ' → ' + ruling.next + ' '));
  if (ruling.result !== null) line.appendChild(badge(ruling.result, ''));
  wrap.appendChild(line);
  if (ruling.problem !== null) wrap.appendChild(el('p', 'problem', ruling.problem));
  return wrap;
}

async function loadRuns() {
  // Already newest first: ordering is a derivation rule.
  const runs = await (await fetch('/api/runs')).json();
  setForging(runs.some((run) => run.status === 'running'));
  const list = document.getElementById('runlist');
  list.replaceChildren();
  for (const run of runs) {
    // A run is selected once — unselected rows collapse to one line
    // (status dot + id, details in the tooltip); only the active run
    // expands to its full card.
    const isActive = run.run_id === active;
    const item = el('div', 'run' + (isActive ? ' active' : ' row'));
    if (isActive) {
      item.appendChild(el('div', 'id', run.run_id));
      item.appendChild(badge(run.status ?? '?', run.status_known ? run.status : ''));
      item.appendChild(document.createTextNode(' '));
      item.appendChild(badge(run.phase ?? '-', ''));
      item.appendChild(document.createTextNode(' '));
      item.appendChild(badge('seq ' + (run.seq ?? 0), ''));
    } else {
      const dot = el('span', 'dot' + (run.status_known ? ' ' + run.status : ''));
      item.appendChild(dot);
      const idEl = el('span', 'id line', run.run_id);
      item.appendChild(idEl);
      item.title = run.run_id + '\n' + (run.status ?? '?') +
        ' · phase ' + (run.phase ?? '-') + ' · seq ' + (run.seq ?? 0);
    }
    item.onclick = (ev) => {
      // Don't bubble into the pane's expand-on-click handler — the
      // selection itself is what collapses the pane.
      ev.stopPropagation();
      select(run.run_id);
    };
    list.appendChild(item);
  }
}

function row(cells) {
  const tr = el('tr');
  for (const cell of cells) tr.appendChild(cell);
  return tr;
}

// Every road back the rail can draw, as [landing, departure] pairs of
// phase INDICES. The pairs themselves are `phase.returns` — derived
// once in brokkr-view from the ruling that sent the run BACK, already
// deduped there, one name per distinct backward transition — so this
// reads a model field and never infers a road from `visits > 1`: the
// count says a phase was entered twice, and only the transition says
// where from.
//
// Two pairs are dropped, both for want of geometry and neither as a
// judgement about the journal: a departure naming no phase on this rail
// has no column to leave from, and a landing sitting at or after its
// departure is not a road drawn leftward — the head has one direction.
// Same rule the TUI's rail applies (decision 0022).
function returnPairs(rail) {
  const roads = [];
  rail.forEach((phase, to) => {
    for (const source of phase.returns) {
      const from = rail.findIndex((other) => other.name === source);
      if (from > to) roads.push([to, from]);
    }
  });
  return roads;
}

// The loops view — ONE graph: the phase rail with each phase's inner
// topology inlined. A phase whose newest effect shows structure
// (sequence steps, panel members) renders as a capsule of inner nodes
// on the rail; a plain phase stays a single node. Which is which, and
// what state each node is in, is the model's ruling; the geometry below
// is this page's job and nobody else's.
function renderLoops(detail, view, id) {
  const rail = view.phases;
  if (rail.length === 0) return;
  // Outer selection survives SSE re-renders like activeParticipant does,
  // and clears itself if the phase vanishes on refetch.
  if (selectedPhase && !rail.some((phase) => phase.name === selectedPhase)) {
    selectedPhase = null;
  }
  const summary = view.summary ?? {};
  const status = KNOWN_STATUS.includes(summary.status) ? summary.status : null;
  const pulsing = status === 'running';
  const drillable = new Set(view.participants.map((part) => part.key));
  // The rail carries structure, not the leaf's facts: a node reads as
  // its label and nothing else. The served model is a seat's field and
  // is shown where a seat is (the seats table and the seat pane), never
  // on the abstraction that only says which work followed which.
  const nodeText = (node, label = node.label) => label;

  // Geometry: ONE center rail. Sequential work sits on the rail joined
  // by arrowed edges ("then"); a panel forks into symmetric lanes that
  // rejoin the rail (parallel members; the join is the dependency).
  // All step labels share one baseline, phase names another.
  const LANE = 26, TOP = 14, COL_GAP = 30, PHASE_GAP = 44;
  const mono = (s) => String(s).length * 6.3;
  const maxHalf = LANE * Math.max(0, ...rail.map((phase) => phase.columns.length
    ? Math.max(...phase.columns.map((c) => (c.nodes.length - 1) / 2)) : 0));
  const Y = TOP + Math.ceil(maxHalf) + 8;
  const stepLabelY = Y + maxHalf + 22;
  const nameY = stepLabelY + 18;
  // The roads back ride two rows of their own UNDER the names, clear of
  // the ×N markers that sit at nameY + 12 — and those rows exist only
  // for a run whose journal recorded a return. A forward-only run's
  // graph is exactly the graph it was before arcs existed.
  const roads = returnPairs(rail);
  const retTopY = nameY + 18, retY = nameY + 30;

  let cursor = 12;
  const segs = rail.map((phase) => {
    const seg = { name: phase.name, strategy: phase.strategy, visits: phase.visits, current: phase.current,
                  plain: phase.plain, cols: [], x0: cursor };
    if (phase.plain) {
      const phaseLabel = phase.name + (phase.strategy ? ' · ' + phase.strategy : '');
      const w = Math.max(28, mono(phaseLabel) + 6);
      seg.cx = cursor + w / 2;
      seg.entry = seg.cx - 9;
      seg.exit = seg.cx + 9;
      cursor += w;
    } else {
      phase.columns.forEach((col, i) => {
        if (i > 0) cursor += COL_GAP;
        const n = col.nodes.length;
        if (n === 1) {
          const w = Math.max(30, mono(nodeText(col.nodes[0], col.label ?? col.nodes[0].label)) + 6);
          seg.cols.push({ col, fork: false, x: cursor + w / 2,
                          entry: cursor + w / 2 - 8, exit: cursor + w / 2 + 8 });
          cursor += w;
        } else {
          const labelW = Math.max(...col.nodes.map((nd) => mono(nodeText(nd))));
          const w = 26 + 10 + labelW + 16 + 14;
          seg.cols.push({ col, fork: true, x0: cursor, x1: cursor + w,
                          nodeX: cursor + 26, entry: cursor, exit: cursor + w });
          cursor += w;
        }
      });
      seg.entry = seg.cols[0].entry;
      seg.exit = seg.cols[seg.cols.length - 1].exit;
      seg.cx = (seg.x0 + cursor) / 2;
    }
    seg.x1 = cursor;
    cursor += PHASE_GAP;
    return seg;
  });

  const wrap = el('div', 'loops');
  const svg = svgEl('svg');
  svg.setAttribute('width', cursor - PHASE_GAP + 12);
  svg.setAttribute('height', roads.length ? retY + 8 : nameY + 24);
  const defs = svgEl('defs');
  const marker = svgEl('marker');
  marker.setAttribute('id', 'arr');
  marker.setAttribute('viewBox', '0 0 8 8');
  marker.setAttribute('refX', 7);
  marker.setAttribute('refY', 4);
  // userSpaceOnUse: a fixed 7px head instead of scaling with the 2px
  // stroke (which rendered clunky 13px triangles).
  marker.setAttribute('markerUnits', 'userSpaceOnUse');
  marker.setAttribute('markerWidth', 7);
  marker.setAttribute('markerHeight', 7);
  marker.setAttribute('orient', 'auto');
  const tipPath = svgEl('path', 'arr-tip');
  tipPath.setAttribute('d', 'M0 0 L8 4 L0 8 Z');
  marker.appendChild(tipPath);
  defs.appendChild(marker);
  svg.appendChild(defs);
  const edge = (xa, xb) => {
    const l = svgEl('line', 'edge');
    l.setAttribute('x1', xa);
    l.setAttribute('y1', Y);
    l.setAttribute('x2', xb);
    l.setAttribute('y2', Y);
    svg.appendChild(l);
  };

  // Native tooltip: phase, visit count, and — on the current phase —
  // the last ruling, so the graph explains itself on hover.
  const phaseTip = (seg) => {
    const tip = [seg.name + (seg.strategy ? ' · ' + seg.strategy : '') +
      (seg.visits > 1 ? ' · visited ×' + seg.visits : '')];
    if (seg.current && view.ruling) {
      tip.push('last ruling: ' + view.ruling.rule_id + ' → ' + view.ruling.next);
    }
    return tip.join('\n');
  };
  // Click selects (and scopes the consoles below to) the phase;
  // clicking the selected phase again clears the selection. Scopes are
  // mutually exclusive: choosing a phase drops any drilled participant
  // (their intersection was empty and read as broken).
  const togglePhase = (name) => () => {
    selectedPhase = selectedPhase === name ? null : name;
    activeParticipant = null;
    renderDetail(id, view);
  };

  segs.forEach((seg, i) => {
    const isCurrent = seg.current;
    if (i > 0) edge(segs[i - 1].exit, seg.entry);

    // Background hit zone: click anywhere in the phase to scope. Drawn
    // first so nodes stay on top for their own clicks.
    const hitG = svgEl('g', 'hit');
    hitG.appendChild(svgEl('title', null, phaseTip(seg)));
    const hit = svgEl('rect', 'seg-hit');
    hit.setAttribute('x', seg.x0 - 10);
    hit.setAttribute('y', TOP - 8);
    hit.setAttribute('width', seg.x1 - seg.x0 + 20);
    hit.setAttribute('height', nameY - TOP + 24);
    hitG.appendChild(hit);
    hitG.onclick = togglePhase(seg.name);
    svg.appendChild(hitG);

    if (seg.plain) {
      const cls = !isCurrent ? 'on-visited'
        : status === 'stopped' ? 'on-halt'
        : status === 'awaiting_operator' ? 'on-park'
        : 'on-phosphor';
      if (isCurrent && pulsing) {
        const halo = svgEl('circle', 'halo halo-on');
        halo.setAttribute('cx', seg.cx);
        halo.setAttribute('cy', Y);
        halo.setAttribute('r', 7);
        svg.appendChild(halo);
      }
      const node = svgEl('circle', cls + (isCurrent && pulsing ? ' loop-pulse' : ''));
      node.setAttribute('cx', seg.cx);
      node.setAttribute('cy', Y);
      node.setAttribute('r', isCurrent ? 7 : 5.5);
      svg.appendChild(node);
    } else {
      seg.cols.forEach((c, j) => {
        if (j > 0) edge(seg.cols[j - 1].exit, c.entry);
        const drawNode = (n, x, y) => {
          const g = svgEl('g', 'hit');
          const live = n.state === 'active' && pulsing;
          if (live) {
            const halo = svgEl('circle', 'halo halo-on');
            halo.setAttribute('cx', x);
            halo.setAttribute('cy', y);
            halo.setAttribute('r', 5);
            g.appendChild(halo);
          }
          const cn = svgEl('circle',
            nodeCls(n.state_class) + (live ? ' loop-pulse' : ''));
          cn.setAttribute('cx', x);
          cn.setAttribute('cy', y);
          cn.setAttribute('r', 5);
          g.appendChild(cn);
          if (drillable.has(n.key)) {
            g.appendChild(svgEl('title', null,
              nodeText(n) + ' — open participant'));
            g.onclick = () => {
              activeParticipant = n.key;
              selectedPhase = null;
              renderDetail(id, view);
            };
          }
          svg.appendChild(g);
          return g;
        };
        if (!c.fork) {
          const g = drawNode(c.col.nodes[0], c.x, Y);
          const t = svgEl('text', null,
            nodeText(c.col.nodes[0], c.col.label ?? c.col.nodes[0].label));
          t.setAttribute('x', c.x);
          t.setAttribute('y', stepLabelY);
          t.setAttribute('text-anchor', 'middle');
          g.appendChild(t);
        } else {
          const n = c.col.nodes.length;
          c.col.nodes.forEach((nd, k) => {
            const ly = Y + (k - (n - 1) / 2) * LANE;
            const laneP = svgEl('path', 'rail-line lane');
            laneP.setAttribute('d', 'M' + c.x0 + ' ' + Y +
              ' L' + (c.x0 + 14) + ' ' + ly +
              ' L' + (c.x1 - 14) + ' ' + ly +
              ' L' + c.x1 + ' ' + Y);
            svg.appendChild(laneP);
            const g = drawNode(nd, c.nodeX, ly);
            const t = svgEl('text', null, nodeText(nd));
            t.setAttribute('x', c.nodeX + 10);
            t.setAttribute('y', ly + 3.5);
            g.appendChild(t);
          });
          if (c.col.label) {
            const t = svgEl('text', null, c.col.label);
            t.setAttribute('x', (c.x0 + c.x1) / 2);
            t.setAttribute('y', stepLabelY);
            t.setAttribute('text-anchor', 'middle');
            svg.appendChild(t);
          }
        }
      });
    }

    // Selected phase: dashed outline + tint over the whole segment.
    if (seg.name === selectedPhase) {
      const sel = svgEl('rect', 'seg-sel');
      sel.setAttribute('x', seg.x0 - 10);
      sel.setAttribute('y', TOP - 8);
      sel.setAttribute('width', seg.x1 - seg.x0 + 20);
      sel.setAttribute('height', nameY - TOP + 24);
      sel.setAttribute('rx', 10);
      svg.appendChild(sel);
    }

    // Phase name on its own shared baseline; current phase takes the
    // run-status color, selected takes violet.
    const stateCls = !isCurrent ? ''
      : status === 'stopped' ? ' on-halt'
      : status === 'awaiting_operator' ? ' on-park'
      : ' on-phosphor';
    const nameG = svgEl('g', 'hit');
    nameG.appendChild(svgEl('title', null, phaseTip(seg)));
    const label = svgEl('text', 'phase' + stateCls +
      (seg.name === selectedPhase ? ' phase-sel' : ''),
      seg.name + (seg.strategy ? ' · ' + seg.strategy : ''));
    label.setAttribute('x', seg.cx);
    label.setAttribute('y', nameY);
    label.setAttribute('text-anchor', 'middle');
    nameG.appendChild(label);
    if (seg.visits > 1) {
      const rev = svgEl('text', 'revisit', '×' + seg.visits);
      rev.setAttribute('x', seg.cx);
      rev.setAttribute('y', nameY + 12);
      rev.setAttribute('text-anchor', 'middle');
      nameG.appendChild(rev);
    }
    nameG.onclick = togglePhase(seg.name);
    svg.appendChild(nameG);
  });

  // The road back. A reforging is a road, and a road is drawn: without
  // this the rail says `review` finished and `implement` lit up again,
  // which reads as teleportation rather than a loop. It rides two rows
  // of its own BELOW the selection box, which ends at nameY + 16 — the
  // clearance is that geometry and not the paint order, so a road moved
  // upward would cross the box however late it is drawn. Same answer
  // the TUI gives: a row reserved under the names.
  //
  // One road per distinct pair, however many times the journal took it:
  // the repeats ride the ×N marker, which was already the rail's answer
  // to a revisit.
  roads.forEach(([to, from]) => {
    const xa = segs[to].cx, xb = segs[from].cx;
    const r = Math.min(9, Math.max(0, (xb - xa) / 2));
    const g = svgEl('g');
    g.appendChild(svgEl('title', null,
      segs[from].name + ' → ' + segs[to].name + ' · the run went back'));
    // Corners rise toward the phases they belong to, so the arc reads
    // as one road leaving the rail and returning to it.
    const road = svgEl('path', 'ret');
    road.setAttribute('d',
      'M' + xb + ' ' + retTopY +
      ' L' + xb + ' ' + (retY - r) +
      ' Q' + xb + ' ' + retY + ' ' + (xb - r) + ' ' + retY +
      ' L' + (xa + r) + ' ' + retY +
      ' Q' + xa + ' ' + retY + ' ' + xa + ' ' + (retY - r) +
      ' L' + xa + ' ' + retTopY);
    g.appendChild(road);
    // The head marks the LANDING only, mirroring the rail's own arrow:
    // it marks arrival, never departure. It sits inside the landing
    // corner, pointing into it.
    const tip = svgEl('path', 'ret-tip');
    tip.setAttribute('d',
      'M' + (xa + r + 8) + ' ' + (retY - 4) +
      ' L' + (xa + r) + ' ' + retY +
      ' L' + (xa + r + 8) + ' ' + (retY + 4) + ' Z');
    g.appendChild(tip);
    svg.appendChild(g);
  });

  wrap.appendChild(svg);
  wrap.appendChild(el('div', 'sub',
    '→ sequential · forked lanes run in parallel and rejoin before the next step · click a phase to scope the tables'
    + (roads.length ? ' · the arc under the rail is a reforging: the run went back' : '')));
  detail.appendChild(wrap);
}

// The journal's checkpoint stream — the drill-down fallback when no
// local transcript exists for the participant.
function checkpointTable(part) {
  const stream = el('table');
  stream.appendChild(row([
    el('th', null, 'turn'), el('th', null, 'tool'),
    el('th', null, 'model'), el('th', null, 'tokens'), el('th', null, 'target'),
    el('th', null, 'recorded'),
  ]));
  for (const item of part.checkpoints) {
    const target = el('td', 'target');
    if (item.target.absent) {
      target.appendChild(absentMark(item.target.text, item.target.note));
    } else {
      target.appendChild(targetSpan(item.target.text, item.target_full));
    }
    stream.appendChild(row([
      cell(item.turn),
      el('td', null, item.step),
      cell(item.model),
      cell(item.usage),
      target,
      el('td', null, item.recorded_at),
    ]));
  }
  return tableWrap(stream);
}

// Session prose, fetched from the local transcript endpoint. Cached per
// session so SSE re-renders don't refetch. textContent discipline holds:
// transcript text is seat-authored and untrusted.
const transcriptCache = new Map();

// A WORKING seat writes prose between journal checkpoints, so the run's
// head does not move when its words land. That session's own stream
// says when its transcript file grew; on each event exactly one cache
// entry is dropped and repainted. Never opened for a concluded seat —
// its transcript is already whole.
let sessionSource = null, sessionWatch = null;
function closeSessionWatch() {
  if (sessionSource) sessionSource.close();
  sessionSource = null;
  sessionWatch = null;
}
function watchSession(sessionId, box, part) {
  if (sessionWatch !== sessionId) {
    closeSessionWatch();
    sessionWatch = sessionId;
    sessionSource = new EventSource('/sse/session/' + encodeURIComponent(sessionId));
  }
  // Rebound every render so the growth repaints into the box the
  // current frame is showing, not one a previous render has dropped.
  sessionSource.onmessage = () => {
    transcriptCache.delete(sessionId);
    renderTranscript(box, sessionId, part);
  };
}
async function renderTranscript(box, sessionId, part) {
  let data = transcriptCache.get(sessionId);
  if (!data) {
    try {
      const res = await fetch('/api/session/' + encodeURIComponent(sessionId));
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json();
      transcriptCache.set(sessionId, data);
    } catch {
      box.replaceChildren(el('p', 'cause',
        'no local transcript for this session — showing the journal checkpoint stream'));
      box.appendChild(checkpointTable(part));
      return;
    }
  }
  box.replaceChildren();
  for (const turn of data.turns ?? []) {
    for (const b of turn.blocks ?? []) {
      if (b.kind === 'tool') {
        box.appendChild(el('div', 'tr-tool', '⚙ ' + b.text));
      } else {
        box.appendChild(el('div',
          'tr-msg ' + (turn.role === 'assistant' ? 'tr-a' : 'tr-u'), b.text));
      }
    }
  }
  if ((data.turns ?? []).length === 0) {
    box.appendChild(el('p', 'cause', 'transcript holds no prose'));
  }
  if (data.truncated) {
    box.appendChild(el('p', 'cause',
      'transcript truncated (size cap) — resume the session for the rest'));
  }
}

async function loadDetail(id) {
  const view = await (await fetch('/api/view/' + encodeURIComponent(id))).json();
  renderDetail(id, view);
}

function renderDetail(id, view) {
  const s = view.summary ?? {};
  const detail = document.getElementById('detail');
  detail.replaceChildren();
  detail.appendChild(el('h1', null, s.run_id ?? id));
  const line = el('p');
  line.appendChild(badge(s.status ?? '?',
    KNOWN_STATUS.includes(s.status) ? s.status : ''));
  line.appendChild(document.createTextNode(' '));
  line.appendChild(badge('phase ' + (s.phase ?? '-'), ''));
  detail.appendChild(line);

  // A drilled participant clears itself if it vanished on refetch.
  if (activeParticipant && !view.participants.some((p) => p.key === activeParticipant)) {
    activeParticipant = null;
  }
  renderLoops(detail, view, id);

  if (s.park_reason) detail.appendChild(el('pre', null, s.park_reason));
  detail.appendChild(decisionStrip(view.ruling));

  // One scope at a time — a selected phase or a drilled participant —
  // named in a chip whose × clears everything. The consoles below are
  // scoped to it: seats to the phase's effects (or the one
  // participant), events to the phase's traffic. Membership is a model
  // field on both sides, so neither edge knows the rule.
  const phaseFilter = selectedPhase;
  const scopedPart = activeParticipant
    ? view.participants.find((p) => p.key === activeParticipant) : null;
  // Leaving the drill ends the prose watch: the box it paints into is
  // gone with this render.
  if (!scopedPart) closeSessionWatch();
  if (phaseFilter || scopedPart) {
    const chip = el('p', 'ruling');
    chip.appendChild(badge(scopedPart
      ? 'participant · ' + scopedPart.label
      : 'phase · ' + phaseFilter, ''));
    chip.appendChild(document.createTextNode(' '));
    const clear = el('a', null, '× show all');
    clear.href = '#';
    clear.onclick = (ev) => {
      ev.preventDefault();
      selectedPhase = null;
      activeParticipant = null;
      renderDetail(id, view);
    };
    chip.appendChild(clear);
    detail.appendChild(chip);
  }

  // Run-level notices (decision 0016): an optional capability gap
  // recorded at compile time, or a fallback that actually happened. The
  // text is the model's; this surface only places it, so a fallback
  // cannot go unmentioned here while it shows in `brokkr inspect`.
  for (const notice of view.notices ?? []) {
    const note = el('p', 'ruling');
    note.appendChild(badge(notice.kind, ''));
    note.appendChild(document.createTextNode(' ' + notice.text));
    detail.appendChild(note);
  }

  // Live seat telemetry: one line per live participant while an attempt
  // is open. Disappears when the attempt concludes; SSE re-renders keep
  // it current.
  for (const live of view.live) {
    detail.appendChild(el('p', 'live', live.text));
  }

  // Seats console: per-participant table above the events table. Rows
  // drill down into that participant's progress; the selected key lives
  // in activeParticipant so the drill-down survives SSE re-renders.
  const shownParts = view.participants
    .filter((part) => !phaseFilter || part.phase === phaseFilter)
    .filter((part) => !activeParticipant || part.key === activeParticipant);
  if (shownParts.length > 0) {
    const seats = el('table');
    seats.appendChild(row([
      el('th', null, 'participant'), el('th', null, 'status'),
      el('th', null, 'attempts'), el('th', null, 'turns'),
      el('th', null, 'cost'), el('th', null, 'tokens'), el('th', null, 'model'),
      el('th', null, 'activity'),
    ]));
    for (const part of shownParts) {
      const statusCell = el('td');
      statusCell.appendChild(badge(part.status, part.status_class));
      // Activity earns its place in both states: a live participant
      // shows what it is doing right now (tool · target); a concluded
      // one shows what mattered in the end — its result token and how
      // long the work took.
      const act = part.activity;
      const activity = el('td', 'target');
      if (act.tool !== null) {
        activity.appendChild(document.createTextNode(act.tool));
        if (act.target_short !== null) {
          activity.appendChild(document.createTextNode(' · '));
          activity.appendChild(targetSpan(act.target_short, act.target_full));
        }
      } else if (act.absent) {
        activity.appendChild(absentMark(act.text, act.note));
      } else {
        activity.textContent = act.text;
      }
      // The agent resolution that selected this invocation, rendered
      // separately from the provider-reported model cell.
      const label = el('td');
      label.appendChild(document.createTextNode(part.label));
      if (part.provenance) {
        label.appendChild(el('div', 'target', part.provenance.line));
      }
      const tr = row([
        label,
        statusCell,
        el('td', null, part.attempts),
        cell(part.turns_cell),
        cell(part.cost_cell),
        cell(part.usage_cell),
        cell(part.model),
        activity,
      ]);
      tr.className = 'seat';
      tr.onclick = () => {
        activeParticipant = part.key;
        selectedPhase = null;
        renderDetail(id, view);
      };
      seats.appendChild(tr);
    }
    detail.appendChild(tableWrap(seats));
  }

  if (scopedPart) {
    const part = scopedPart;
    const back = el('p');
    const link = el('a', null, '← all events');
    link.href = '#';
    link.onclick = (ev) => {
      ev.preventDefault();
      activeParticipant = null;
      renderDetail(id, view);
    };
    back.appendChild(link);
    detail.appendChild(back);
    // A session id is a raw journal string rendered into a command the
    // operator is invited to paste: ';', '&&', '$(…)' and backticks all
    // survive textContent, so an id that cannot name a transcript is
    // treated as absent rather than shown. Same guard, same shape, as
    // the server's session lookup and the TUI's resume line.
    const sessionId = typeof part.session_id === 'string' &&
      part.session_id.length > 0 && part.session_id.length <= 64 &&
      /^[0-9a-fA-F-]+$/.test(part.session_id) ? part.session_id : null;
    const header = el('p');
    header.appendChild(document.createTextNode(part.label + ' '));
    header.appendChild(badge(part.status, part.status_class));
    if (sessionId !== null) {
      header.appendChild(document.createTextNode(' · session ' + sessionId));
    }
    detail.appendChild(header);
    detail.appendChild(el('p', 'cause', 'model ' + part.model.text));
    detail.appendChild(el('p', 'cause', 'tokens ' + part.usage_cell.text));
    if (part.provenance) {
      detail.appendChild(el('p', 'cause', 'selected by ' + part.provenance.line));
    }
    // The lowest level IS the session prose. When the seat's transcript
    // exists on this machine it renders here; the journal's checkpoint
    // stream is only the fallback (exec steps, vanished transcripts).
    if (sessionId !== null) {
      // Only a claude harness answers to `claude --resume`; a session
      // held by another harness is named with its holder and no
      // command, so a codex thread id is never a pasteable claude lie.
      // Provenance absent means a pre-0016 journal, all claude seats.
      const holder = part.provenance && typeof part.provenance.provider === 'string'
        ? part.provenance.provider : null;
      detail.appendChild(el('p', 'cause',
        holder === null || holder === 'claude' || holder === 'lanetally'
          ? 'full session: claude --resume ' + sessionId
          : 'full session: ' + sessionId + ' · held by ' + holder + ', no resume verb yet'));
      const box = el('div', 'transcript');
      box.appendChild(el('p', 'cause', 'loading transcript…'));
      detail.appendChild(box);
      if (part.status === 'working') {
        watchSession(sessionId, box, part);
      } else {
        // Nothing more will land here. If THIS session was the one being
        // watched, drop its cache once more so this render is the final
        // look — the last words written before the seat concluded are
        // not lost to an entry that predates them. A watch on some other
        // seat ends too: its box is gone with this render.
        if (sessionWatch === sessionId) transcriptCache.delete(sessionId);
        closeSessionWatch();
      }
      renderTranscript(box, sessionId, part);
    } else {
      // No id to watch: nothing streams, and any earlier watch ends.
      closeSessionWatch();
      detail.appendChild(checkpointTable(part));
    }
    // Terminal line: members conclude on their panel-member-finished
    // outcome; the seat itself on the effect's terminal event.
    detail.appendChild(el('p', part.terminal_line.absent ? 'cause' : null,
                          part.terminal_line.text));
    return;
  }

  // The events surface defaults to the DECISION TRAIL: why the machine
  // moved — rulings, phase entries, effect outcomes, run start/end.
  // Checkpoints (the transcript's job now) and effect plumbing hide
  // behind the raw-journal toggle, kept for forensics.
  const modeLine = el('p', 'cause');
  const modeLink = el('a', null, rawJournal
    ? '◂ decision trail'
    : 'full journal · ' + view.event_count + ' events ▸');
  modeLink.href = '#';
  modeLink.onclick = (ev) => {
    ev.preventDefault();
    rawJournal = !rawJournal;
    renderDetail(id, view);
  };
  modeLine.appendChild(modeLink);
  detail.appendChild(modeLine);

  const table = el('table');
  table.appendChild(row(rawJournal
    ? [el('th', null, 'seq ←cause'), el('th', null, 'type'), el('th', null, 'label'),
       el('th', null, 'model'), el('th', null, 'payload'), el('th', null, 'recorded')]
    : [el('th', null, 'seq ←cause'), el('th', null, 'event'),
       el('th', null, 'what happened'), el('th', null, 'model'),
       el('th', null, 'recorded')]));
  for (const e of view.journal) {
    if (phaseFilter && !e.phases.includes(phaseFilter)) continue;
    if (!rawJournal && !e.in_trail) continue;
    const seqCell = el('td', null, e.seq);
    if (e.causation_seq !== null) {
      seqCell.appendChild(document.createTextNode(' '));
      seqCell.appendChild(el('span', 'cause', '← ' + e.causation_seq));
    }
    if (!rawJournal) {
      // Trail row: the human answer to "what happened here".
      const what = el('td');
      if (e.what.badge !== null) {
        what.appendChild(badge(e.what.badge, e.what.badge_class ?? ''));
      }
      if (e.what.arrow !== null) {
        what.appendChild(el('span', 'arrow', e.what.arrow));
      }
      if (e.what.badge === null && e.what.arrow === null) {
        what.appendChild(document.createTextNode(e.what.text));
      }
      if (e.what.problem !== null) {
        what.appendChild(el('div', 'problem', e.what.problem));
      }
      table.appendChild(row([
        seqCell, el('td', null, e.event_type), what, cell(e.model),
        el('td', null, e.recorded_at),
      ]));
      continue;
    }
    // Raw journal row (forensics): every envelope, clamped payload.
    table.appendChild(row([
      seqCell,
      el('td', null, e.event_type),
      cell(e.label, 'label'),
      cell(e.model),
      payloadCell(e.payload_json),
      el('td', null, e.recorded_at),
    ]));
  }
  detail.appendChild(tableWrap(table));
}

function select(id) {
  active = id;
  runsCollapsed = true; // a run is selected once — give detail the width
  applyRunsPane();
  activeParticipant = null; // drill-down selection is per-run
  selectedPhase = null;     // outer-rail selection is per-run too
  rawJournal = false;       // journal mode resets to the trail per-run
  loadRuns();
  loadDetail(id);
  if (source) source.close();
  // The prose watch is a child of the run's stream: replacing one ends
  // the other, and so does the run stream failing.
  closeSessionWatch();
  source = new EventSource('/sse/' + encodeURIComponent(id));
  source.onmessage = () => { loadDetail(id); loadRuns(); };
  source.onerror = () => closeSessionWatch();
}

document.getElementById('divider').onclick = () => {
  runsCollapsed = !runsCollapsed;
  applyRunsPane();
};

loadRuns();
setInterval(loadRuns, 5000);
</script>
