[package]
name = "brokkr-store"
description = "SQLite journal: append-only hash-chained events, runs, export, verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are declared below (#423).
autotests = false

[lints]
workspace = true

# The integration tests link as one binary (#423): `tests/it.rs` holds every
# file under tests/ as a module, so a test runs as `<file>::<name>`. Cargo
# builds no test it is not told of here, and brokkr-cli's `test_targets`
# refuses a file under tests/ that is not a module of the root.
[[test]]
name = "it"

# Installs a counting allocator as the process's global allocator and
# measures the peak heap of the doctor's summary comparison (decision
# 0089 ruling 4): another file's allocations would count against it.
[[test]]
name = "summary_heap"

[features]
# Row planting for tests that need a journal the store would never write
# (#354), and SQLite's trace, by which a heap test counts the statements a
# read begins (#753). Only dev-dependencies enable it.
test-support = ["rusqlite/trace"]

[dependencies]
brokkr-core = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
